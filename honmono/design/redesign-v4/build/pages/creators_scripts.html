
<script>
'use strict';

/* 掲載データは creators.json で管理(掲載申請を確認後にJSONへ追記する)。
   file:// などfetch不可の環境向けに同内容のフォールバックを持つ。 */

const FALLBACK_CREATORS = [
  {
    sample: true,
    name: '掲載カードの見本 ①',
    category: 'イラストレーター',
    desc: 'ここに紹介文(100字以内)が入ります。活動内容と、実在をどうやって検証できるようにしているかを書きます。例:「制作過程をすべてタイムラプスで公開し、手描きの全工程を検証可能にしています」',
    links: { '証明ページ': '#', 'X': '#', 'ポートフォリオ': '#' },
    promise: '自分で決めた約束をここに書きます(例: 生成AI不使用・制作過程公開)',
  },
  {
    sample: true,
    name: '掲載カードの見本 ②',
    category: 'コスプレイヤー',
    desc: 'ジャンルは自由に書けます。「証明ページ」のリンクから相互リンクの輪をたどれることが、掲載の唯一の条件です。',
    links: { '証明ページ': '#', 'Instagram': '#', 'イベント出演記録': '#' },
    promise: '例: 全写真に来歴データを付与・加工内容を明記',
  },
  {
    sample: true,
    name: '掲載カードの見本 ③',
    category: '写真家・モデル',
    desc: 'リンクは何本でも載せられます。実在の裏付けになるもの(イベント出演記録・受賞歴・掲載誌など)があれば、それも書けます。',
    links: { '証明ページ': '#', 'X': '#', '作品集': '#' },
    promise: '例: RAW照合に応じる・AIレタッチの範囲を明記',
  },
  {
    sample: true,
    name: '掲載カードの見本 ④',
    category: 'VTuber・配信者',
    desc: '「中の人は実在の一人の人間」といった宣言も、相互リンク証明で示せます。姿を出さない活動でも掲載できます。',
    links: { '証明ページ': '#', '配信チャンネル': '#' },
    promise: '例: 週3回のライブ配信で継続的に実在を示す',
  },
];


let CREATORS = [];

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const GLYPH_OK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2H2v12h2M12 2h2v12h-2"/><path d="m5.5 8 1.8 2L10.5 6"/></svg>';
const GLYPH_WARN = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M11 2 5 14"/></svg>';
const TICK = '<span class="tick" aria-hidden="true">' + GLYPH_OK + '</span>';

let activeCat = 'すべて';

function initFilters() {
  const cats = ['すべて', ...new Set(CREATORS.map(c => c.category))];
  $('filters').innerHTML = cats.map(c =>
    `<button type="button" data-cat="${esc(c)}" class="${c === activeCat ? 'active' : ''}" aria-pressed="${c === activeCat}">${TICK}${esc(c)}</button>`).join('');
}

function render() {
  const q = $('q').value.trim().toLowerCase();
  const shown = CREATORS.filter(c => {
    if (activeCat !== 'すべて' && c.category !== activeCat) return false;
    if (!q) return true;
    return (c.name + c.category + c.desc + c.promise).toLowerCase().includes(q);
  });
  $('list').innerHTML = shown.map(c =>
    `<article class="entry">` +
    `<div class="entry__tags">` +
    `<span class="chip chip--ok"><span class="glyph" aria-hidden="true">${GLYPH_OK}</span>実在証明ページあり</span>` +
    (c.sample ? `<span class="chip chip--warn"><span class="glyph" aria-hidden="true">${GLYPH_WARN}</span>見本</span>` : '') +
    `</div>` +
    `<h3>${esc(c.name)}</h3>` +
    `<p class="cat">${esc(c.category)}</p>` +
    `<p class="desc">${esc(c.desc)}</p>` +
    `<div class="links">` +
    Object.entries(c.links).map(([label, url]) =>
      `<a href="${esc(url)}" ${url === '#' ? '' : 'target="_blank" rel="noopener"'}>${esc(label)}</a>`).join('') +
    `</div>` +
    `<div class="promise">約束: <b>${esc(c.promise)}</b></div>` +
    `</article>`).join('');
  $('empty').style.display = shown.length ? 'none' : 'block';
  // いまどの条件で何件見えているかを、絞り込みのすぐ下に出す
  $('resultCount').textContent = activeCat === 'すべて' && !q
    ? shown.length + '件をすべて表示中'
    : `${shown.length}件 / 条件: ${activeCat}${q ? '・「' + q + '」' : ''}`;
}

function rerender() {
  const list = $('list');
  list.classList.add('swapping');
  render();
  requestAnimationFrame(() => list.classList.remove('swapping'));
}

$('filters').addEventListener('click', e => {
  const btn = e.target.closest('button[data-cat]');
  if (!btn) return;
  activeCat = btn.dataset.cat;
  document.querySelectorAll('#filters button').forEach(b => {
    const on = b === btn;
    b.classList.toggle('active', on);
    b.setAttribute('aria-pressed', on);
  });
  rerender();
});
$('q').addEventListener('input', rerender);
$('clearFilters').addEventListener('click', () => {
  $('q').value = '';
  activeCat = 'すべて';
  initFilters();
  rerender();
});

(async () => {
  try {
    if (location.protocol !== 'http:' && location.protocol !== 'https:') throw new Error('local file');
    const r = await fetch('creators.json', { cache: 'no-store' });
    if (!r.ok) throw new Error('fetch failed');
    const data = await r.json();
    CREATORS = Array.isArray(data) ? data : FALLBACK_CREATORS;
  } catch {
    CREATORS = FALLBACK_CREATORS;
  }
  initFilters();
  render();
})();
</script>
