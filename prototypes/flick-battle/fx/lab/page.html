<title>はじきバトル 音の聴き比べ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex,nofollow">
<style>
  /* レイアウト: 1 列の聴き比べカード。各カードに「聴く」ボタンと「選ぶ」チップ。下に選んだ結果のまとめ。色は試作の画面と同じトークン */
  :root {
    --bg: #eef0ee; --surface: #ffffff; --fg: #1d2622; --muted: #5d6a64; --line: #c9d0cc;
    --accent: #0b7a53; --accent-fg: #ffffff; --ult: #b7791f; --ult-fg: #ffffff; --table: #d9c7a3;
    --font: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141a17; --surface: #1e2622; --fg: #e6ece8; --muted: #9aa8a1; --line: #36423c;
      --accent: #46c493; --accent-fg: #06261a; --ult: #f0b54a; --ult-fg: #2a1c02; --table: #5b4b33;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141a17; --surface: #1e2622; --fg: #e6ece8; --muted: #9aa8a1; --line: #36423c;
    --accent: #46c493; --accent-fg: #06261a; --ult: #f0b54a; --ult-fg: #2a1c02; --table: #5b4b33;
    color-scheme: dark;
  }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.55;
    padding-block: 20px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  main { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  header { display: flex; flex-direction: column; gap: 6px; }
  h1 { font-size: 21px; margin: 0; text-wrap: balance; }
  .lead { margin: 0; color: var(--muted); }
  .note { margin: 0; font-size: 13px; color: var(--muted); border-left: 3px solid var(--table); padding-left: 10px; }
  section.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  h2 { font-size: 16px; margin: 0; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  h2 .tag { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .04em; }
  .why { margin: 0; font-size: 13px; color: var(--muted); }
  .plays { display: flex; flex-wrap: wrap; gap: 8px; }
  button { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; min-height: 44px; cursor: pointer; }
  button.play { display: inline-flex; gap: 8px; align-items: center; }
  button.play b { display: inline-grid; place-items: center; min-width: 22px; height: 22px; border-radius: 6px; background: var(--fg); color: var(--bg); font-size: 13px; }
  button.play.planned b { background: var(--accent); color: var(--accent-fg); }
  button.play[aria-pressed="true"] { border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  legend { font-size: 13px; color: var(--muted); padding: 0; margin-bottom: 4px; }
  .pick { position: relative; }
  .pick input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .pick span { display: inline-flex; align-items: center; min-height: 36px; padding: 4px 12px; border: 1px solid var(--line); border-radius: 999px; font-size: 14px; }
  .pick input:checked + span { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
  .pick input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 8px; }
  .grid button { padding: 8px 10px; font-size: 14px; text-align: left; }
  .summary { display: flex; flex-direction: column; gap: 8px; }
  .summary pre { margin: 0; white-space: pre-wrap; font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-variant-numeric: tabular-nums; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .status { font-size: 13px; color: var(--muted); min-height: 1.4em; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<main>
  <header>
    <h1>はじきバトル 音の聴き比べ</h1>
    <p class="lead">演出の調査で「耳で決める」とした項目です。それぞれ聴いて、よいと思うほうを選んでください。最後に、選んだ結果をまとめた文章が出ます。</p>
    <p class="note">iPhone はマナーモードだと鳴りません。音量を上げ、できればイヤホンで聴いてください。音はすべて端末の中で作っていて、音源ファイルは使っていません。</p>
  </header>
  <div id="cards"></div>
  <section class="card">
    <h2>そのほかの音<span class="tag">参考</span></h2>
    <p class="why">新しく作った音の一覧です。選ぶ必要はありません。気になる音があれば、その名前を教えてください。</p>
    <div class="grid" id="others"></div>
  </section>
  <section class="card summary">
    <h2>選んだ結果</h2>
    <pre id="sum"></pre>
    <div class="row"><button id="copy" type="button">結果をコピー</button><span class="status" id="copied" role="status"></span></div>
  </section>
</main>
<script>
