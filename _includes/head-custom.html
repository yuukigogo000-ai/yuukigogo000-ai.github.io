<!-- Jekyll が生成するページ(README.md 由来など)にも CSP を入れる。
     手書きの .html には各ファイルの charset 行の直後に同じ内容が入っている。
     このテーマ(primer)は head の末尾でこのファイルを読み込む。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; worker-src 'self' blob:; frame-src 'self'">
