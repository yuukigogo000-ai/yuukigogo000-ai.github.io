<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; form-action 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; worker-src 'self'; frame-src 'none'">
<meta name="referrer" content="no-referrer">
<title>BANDHUB | 共有セットリスト</title>
<meta name="description" content="BANDHUBから共有されたセットリストの曲順・曲名・メモを、アプリのインストールなしで確認できます。">
<meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141613" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="viewer.css">
<script type="module" src="viewer.js"></script>
</head>
<body>
<div class="page">
  <header class="brand-bar">
    <div class="brand"><img src="icon.svg" alt="" width="32" height="32"><span>BANDHUB</span></div>
    <button id="language" type="button">English</button>
  </header>
  <main>
    <section class="sheet" aria-labelledby="title">
      <p id="eyebrow" class="eyebrow">共有されたセットリスト</p>
      <h1 id="title">セットリストを受け取る</h1>
      <p id="summary" class="summary"></p>
      <p id="status" class="status" role="status">セットリストを開いています…</p>
      <ol id="songs" class="songs" hidden></ol>
      <noscript><p>共有リンクの表示にはJavaScriptを有効にしてください。 / Enable JavaScript to view this setlist.</p></noscript>
    </section>
    <aside id="sharedNotes" class="shared-notes" hidden>
      <p id="readOnly"></p><p id="privacy"></p>
    </aside>
  </main>
  <footer>
    <a id="legacyLink" href="legacy.html">以前のWeb版・保存データを開く</a>
    <p id="legacyNote">以前このブラウザで作ったセットリストは、こちらから開けます。</p>
  </footer>
</div>
</body>
</html>
