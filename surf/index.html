<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>波チェック — 公開停止中</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #061a26;
    color: #e6f2f7;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }
  main {
    width: 100%;
    max-width: 26rem;
    background: #0a2230;
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 16px;
    padding: 32px 24px;
    text-align: center;
  }
  h1 {
    margin: 0 0 6px;
    font-size: 1.125rem;
    letter-spacing: .04em;
  }
  .sub {
    margin: 0 0 20px;
    font-size: .8125rem;
    color: #7fa8bb;
    letter-spacing: .06em;
  }
  p {
    margin: 0 0 12px;
    font-size: .875rem;
    color: #b9d3de;
  }
  hr {
    border: 0;
    border-top: 1px solid rgba(255, 255, 255, .08);
    margin: 20px 0;
  }
  .note {
    margin: 0;
    font-size: .75rem;
    color: #6f93a4;
  }
</style>
</head>
<body>
<main>
  <h1>波チェック</h1>
  <p class="sub">現在、公開を停止しています</p>
  <p>内容の見直しのため、一時的に公開を取りやめています。</p>
  <p>再開の時期は未定です。</p>
  <hr>
  <p class="note">このページでは、波・風・潮位などの情報は提供していません。</p>
</main>
</body>
</html>
