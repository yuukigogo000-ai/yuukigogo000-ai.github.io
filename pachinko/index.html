<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04050a">
<meta name="color-scheme" content="dark">
<meta name="description" content="出玉設定のジレンマを核にしたパチンコホール経営シミュレーション。実機の試打もできる。目指せ純資産1億円!">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>パチスロ帝国 〜ホール経営シミュレーション〜</title>
<style>
/* ==========================================================================
   パチスロ帝国 — Design Tokens (Approved Master Reference / dark × gold × neon)
   ========================================================================== */
:root{
  --ink-0:#04050a; --ink-1:#090a11; --ink-2:#0f1119; --ink-3:#161926; --ink-4:#1f2333;
  --edge:rgba(255,214,150,.13); --edge-s:rgba(255,214,150,.26); --edge-h:rgba(255,214,150,.45);
  --gold-1:#ffe1a2; --gold-2:#f6bd4e; --gold-3:#c9902c; --amber:#ff9f3d;
  --tx-1:#f4efe6; --tx-2:#a9a08f; --tx-3:#6d6657;
  --red:#ff5f52; --purple:#b06cff; --blue:#4ea8ff; --green:#4fe0a0; --pink:#ff74be;
  --pos:#5fe3a6; --neg:#ff6f5e; --warn:#ffb24d; --danger:#ff4d43;
  --disp:"Yu Mincho","YuMincho","Hiragino Mincho ProN","Hiragino Mincho Pro",serif;
  --ui:system-ui,-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;
  --num:"SF Pro Display",system-ui,-apple-system,"Yu Gothic UI",sans-serif;
  --r-s:6px; --r-m:10px; --r-l:16px;
  --tap:44px; --cta:56px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --topbar:calc(52px + var(--sat)); --navbar:calc(112px + var(--sab));
  --e-out:cubic-bezier(.16,1,.3,1); --e-in:cubic-bezier(.7,0,.84,0);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--ink-0); color:var(--tx-1); font-family:var(--ui);
  font-size:14px; line-height:1.5; -webkit-text-size-adjust:100%;
  overflow-x:hidden; overscroll-behavior-y:none;
}
button,select,input{font-family:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.mincho{font-family:var(--disp)}
svg{flex:0 0 auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- app frame ---------- */
#app{
  position:relative;min-height:100dvh;max-width:560px;margin:0 auto;
  background:
    radial-gradient(120% 60% at 50% 0%,rgba(255,160,60,.10),transparent 60%),
    linear-gradient(180deg,var(--ink-1) 0%,var(--ink-0) 60%);
  padding-left:var(--sal);padding-right:var(--sar);
  isolation:isolate;
}
#app::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(90% 50% at 50% 8%,rgba(255,150,50,.10),transparent 70%),var(--ink-0);
}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  padding:calc(var(--sat) + 8px) 14px 8px;
  display:flex;align-items:center;gap:10px;
  background:linear-gradient(180deg,rgba(6,7,12,.96) 55%,rgba(6,7,12,0));
  backdrop-filter:blur(6px);
}
.brand{display:flex;flex-direction:column;line-height:1;min-width:0}
.brand b{
  font-family:var(--disp);font-size:19px;font-weight:700;letter-spacing:.10em;
  background:linear-gradient(180deg,var(--gold-1),var(--gold-3));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 18px rgba(246,189,78,.18);
}
.brand span{font-size:8px;letter-spacing:.30em;color:var(--tx-3);margin-top:3px}
.daychip{
  margin-left:auto;display:flex;align-items:center;gap:8px;
  border:1px solid var(--edge);border-radius:var(--r-m);
  background:linear-gradient(180deg,var(--ink-3),var(--ink-2));
  padding:5px 10px;
}
.daychip .d{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:17px;font-weight:800;color:var(--gold-1)}
.daychip .u{font-size:9px;color:var(--tx-3);letter-spacing:.14em}
.tag{
  font-size:10px;font-weight:700;letter-spacing:.08em;padding:3px 7px;border-radius:999px;
  border:1px solid currentColor;line-height:1.2;white-space:nowrap;
}
.tag.tokubi{color:#ffcf5c;background:rgba(255,160,40,.13)}
.tag.week{color:var(--blue);background:rgba(78,168,255,.11)}
.tag.boom{color:var(--pink);background:rgba(255,116,190,.11)}

/* ---------- HUD ---------- */
.hud{margin:2px 14px 12px;border:1px solid var(--edge);border-radius:var(--r-l);
  background:linear-gradient(180deg,rgba(28,31,44,.92),rgba(12,14,20,.92));
  box-shadow:0 10px 34px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,225,170,.09);overflow:hidden}
.hud-top{display:flex;align-items:flex-end;gap:12px;padding:12px 14px 10px;
  background:linear-gradient(180deg,rgba(255,166,60,.10),transparent)}
.hud-top .lbl{font-size:9px;letter-spacing:.20em;color:var(--tx-3)}
.hud-top .v{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:28px;font-weight:800;
  color:var(--gold-1);line-height:1.05;text-shadow:0 0 22px rgba(246,189,78,.28)}
.hud-top .delta{margin-left:auto;text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums}
.hud-top .delta i{display:block;font-size:9px;font-style:normal;letter-spacing:.14em;color:var(--tx-3)}
.hud-top .delta b{font-size:15px;font-weight:800}
.hud-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--edge)}
.hud-cell{background:var(--ink-2);padding:7px 7px 8px;min-width:0;overflow:hidden}
.hud-cell .k{font-size:9px;color:var(--tx-3);letter-spacing:.06em;display:flex;align-items:center;gap:3px}
.hud-cell .n{white-space:nowrap;font-family:var(--num);font-variant-numeric:tabular-nums;
  font-size:clamp(12px,3.5vw,15px);font-weight:700;
  margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-cell .n.warnv{color:var(--warn)} .hud-cell .n.dangerv{color:var(--danger)}
.goal{padding:8px 14px 11px;border-top:1px solid var(--edge)}
.goal-head{display:flex;justify-content:space-between;align-items:baseline;font-size:10px;color:var(--tx-3);letter-spacing:.08em}
.goal-head b{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:12px;color:var(--gold-2)}
.meter{height:6px;border-radius:99px;background:#000;border:1px solid var(--edge);margin-top:5px;overflow:hidden;position:relative}
.meter>i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--gold-3),var(--gold-1));box-shadow:0 0 12px rgba(246,189,78,.55);
  transition:width .6s var(--e-out)}
.meter.thin{height:4px}
.meter.risk>i{background:linear-gradient(90deg,#7a5a12,var(--warn),var(--danger))}

/* ---------- stage (hall artwork) ---------- */
.stage{position:relative;margin:0 14px 12px;border-radius:var(--r-l);overflow:hidden;
  border:1px solid var(--edge);background:var(--ink-0);
  box-shadow:0 14px 40px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,225,170,.08)}
.stage-art{position:relative;aspect-ratio:16/9.4;background:#05060b center/cover no-repeat}
.stage-art::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(4,5,10,.62) 0%,rgba(4,5,10,.04) 38%,rgba(4,5,10,.30) 62%,rgba(4,5,10,.88) 100%)}
.stage-fallback{position:absolute;inset:0;overflow:hidden}
.stage-cap{position:absolute;left:12px;top:10px;z-index:2;display:flex;align-items:center;gap:7px}
.stage-cap .eyebrow{font-family:var(--disp);font-size:12px;letter-spacing:.22em;color:var(--gold-1);
  text-shadow:0 2px 10px #000}
.stage-chips{position:absolute;left:10px;right:10px;bottom:10px;z-index:2;display:flex;gap:6px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:5px;padding:5px 9px;border-radius:var(--r-m);
  border:1px solid var(--edge-s);background:rgba(10,11,17,.72);backdrop-filter:blur(5px);
  font-size:10px;color:var(--tx-2);white-space:nowrap}
.chip b{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:12px;color:var(--tx-1)}
.chip.acc b{color:var(--gold-1)}
.chip svg{width:12px;height:12px;opacity:.85}
.strat{display:flex;align-items:center;gap:8px;padding:9px 12px;border-top:1px solid var(--edge);
  background:linear-gradient(180deg,rgba(20,22,32,.9),rgba(10,11,17,.9))}
.strat .lead{font-size:9px;letter-spacing:.16em;color:var(--tx-3)}
.strat .val{font-family:var(--disp);font-size:15px;font-weight:700;letter-spacing:.06em}
.strat .val.give{color:var(--green)} .strat .val.mid{color:var(--gold-1)} .strat .val.take{color:var(--red)}
.strat .side{margin-left:auto;display:flex;gap:10px;font-size:10px;color:var(--tx-3)}
.strat .side b{font-family:var(--num);font-variant-numeric:tabular-nums;color:var(--tx-1);font-size:12px}

/* ---------- section / panels ---------- */
.panel{display:none;padding:0 0 var(--navbar)}
.panel.on{display:block;animation:panelIn .28s var(--e-out) both}
@keyframes panelIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sec{margin:0 14px 12px}
.sec-h{display:flex;align-items:center;gap:8px;margin:16px 0 8px}
.sec-h .bar{width:3px;height:15px;border-radius:2px;background:linear-gradient(180deg,var(--gold-1),var(--gold-3));
  box-shadow:0 0 10px rgba(246,189,78,.5)}
.sec-h h2{font-family:var(--disp);font-size:15px;font-weight:700;letter-spacing:.12em;margin:0}
.sec-h .sub{margin-left:auto;font-size:10px;color:var(--tx-3);letter-spacing:.06em}
.note{font-size:11px;line-height:1.65;color:var(--tx-2)}
.note b{color:var(--gold-1);font-weight:600}
.card{border:1px solid var(--edge);border-radius:var(--r-l);
  background:linear-gradient(180deg,rgba(24,27,38,.92),rgba(11,13,19,.92));
  box-shadow:0 8px 26px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,225,170,.06);
  padding:12px;margin-bottom:10px}
.card.tight{padding:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;font-size:12px}
.row+.row{border-top:1px solid rgba(255,255,255,.04)}
.row .k{color:var(--tx-2)}
.row .v{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:700}
.empty{padding:26px 14px;text-align:center;color:var(--tx-3);font-size:12px}
.empty svg{width:30px;height:30px;opacity:.35;display:block;margin:0 auto 8px}

/* ---------- cabinet card (machine) ---------- */
.cab{position:relative;border:1px solid var(--edge);border-radius:14px;margin-bottom:10px;overflow:hidden;
  background:linear-gradient(180deg,rgba(26,29,41,.95),rgba(10,12,18,.95));
  box-shadow:0 8px 24px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,225,170,.07)}
.cab::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--cc,var(--gold-2));
  box-shadow:0 0 16px var(--cc,var(--gold-2))}
.cab.hot{border-color:var(--edge-s)}
.cab-top{display:flex;gap:10px;padding:11px 12px 8px}
.cab-face{width:46px;height:60px;flex:0 0 auto;border-radius:8px;position:relative;overflow:hidden;
  background:linear-gradient(180deg,#20222d,#0b0c11);border:1px solid rgba(255,255,255,.07)}
.cab-face i{position:absolute;left:5px;right:5px;top:5px;height:20px;border-radius:3px;
  background:linear-gradient(180deg,var(--cc),rgba(0,0,0,.35));box-shadow:0 0 12px var(--cc);display:block}
.cab-face u{position:absolute;left:7px;right:7px;top:29px;height:6px;border-radius:2px;
  background:rgba(255,238,206,.66);display:block}
.cab-face s{position:absolute;left:5px;right:5px;bottom:6px;height:11px;border-radius:2px;
  background:#05060a;display:block;text-decoration:none}
.cab-id{min-width:0;flex:1}
.cab-name{font-size:13px;font-weight:700;line-height:1.35;letter-spacing:.01em}
.cab-spec{font-size:10px;color:var(--gold-2);margin-top:2px;letter-spacing:.02em}
.cab-desc{font-size:10px;color:var(--tx-3);margin-top:1px}
.badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.bdg{font-size:9px;font-weight:700;letter-spacing:.05em;padding:2px 6px;border-radius:4px;
  border:1px solid currentColor;line-height:1.3}
.bdg.new{color:#ffd76a;background:rgba(255,190,60,.14)}
.bdg.boom{color:var(--pink);background:rgba(255,116,190,.13)}
.bdg.isl{color:var(--blue);background:rgba(78,168,255,.12)}
.bdg.pro{color:var(--red);background:rgba(255,95,82,.13)}
.cab-metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--edge);border-top:1px solid var(--edge)}
.cab-metrics div{background:rgba(9,10,16,.86);padding:6px 8px}
.cab-metrics .k{font-size:9px;color:var(--tx-3)}
.cab-metrics .v{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:12px;font-weight:700;margin-top:1px}
.pop{margin-top:4px}
.pop .meter{height:3px;margin-top:3px}
.pop .meter>i{background:linear-gradient(90deg,var(--cc),#fff2d0);box-shadow:0 0 8px var(--cc)}
/* setting selector */
.setrow{display:flex;align-items:center;gap:8px;padding:9px 10px 10px;border-top:1px solid var(--edge);
  background:linear-gradient(180deg,rgba(255,166,60,.05),transparent)}
.setrow .lb{font-size:9px;letter-spacing:.14em;color:var(--tx-3);flex:0 0 auto}
.seg{display:flex;gap:3px;flex:1}
.seg button{flex:1;height:var(--tap);min-width:0;border-radius:8px;border:1px solid var(--edge);
  background:linear-gradient(180deg,#191c27,#0c0e15);color:var(--tx-2);
  font-family:var(--num);font-size:14px;font-weight:800;position:relative;
  transition:transform .12s var(--e-out),background .18s,color .18s,border-color .18s}
.seg button:active{transform:translateY(1px) scale(.97)}
.seg button[aria-pressed="true"]{
  color:#1a1204;border-color:var(--gold-1);
  background:linear-gradient(180deg,var(--gold-1),var(--gold-3));
  box-shadow:0 0 16px rgba(246,189,78,.5),inset 0 1px 0 rgba(255,255,255,.5)}
.seg button[aria-pressed="true"]::after{content:"";position:absolute;inset:-3px;border-radius:10px;
  border:1px solid rgba(246,189,78,.35);animation:segPulse .5s var(--e-out)}
@keyframes segPulse{from{opacity:1;transform:scale(.88)}to{opacity:0;transform:scale(1.15)}}
.seg.lowset button[aria-pressed="true"]{color:#2a0d09;border-color:#ff9b8f;
  background:linear-gradient(180deg,#ff9b8f,#c0392b);box-shadow:0 0 16px rgba(255,95,82,.5)}
.seg.highset button[aria-pressed="true"]{color:#04241a;border-color:#8ff0c6;
  background:linear-gradient(180deg,#8ff0c6,#1f9d6b);box-shadow:0 0 16px rgba(79,224,160,.5)}
.cab-acts{display:flex;gap:6px;padding:0 10px 10px}

/* ---------- buttons ---------- */
.btn{min-height:var(--tap);padding:0 14px;border-radius:10px;border:1px solid var(--edge);
  background:linear-gradient(180deg,#1b1f2b,#0d1017);color:var(--tx-1);font-size:12px;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:transform .12s var(--e-out),filter .18s;
  white-space:normal;flex-wrap:wrap;text-align:center;line-height:1.3;min-width:0;padding-top:5px;padding-bottom:5px}
.btn:active{transform:translateY(1px) scale(.985)}
.btn[disabled]{opacity:.42;pointer-events:none}
.btn svg{width:15px;height:15px}
.btn.gold{color:#1c1305;border-color:var(--gold-1);
  background:linear-gradient(180deg,var(--gold-1),var(--gold-3));
  box-shadow:0 4px 18px rgba(246,189,78,.35),inset 0 1px 0 rgba(255,255,255,.45)}
.btn.ghost{background:linear-gradient(180deg,rgba(28,32,44,.7),rgba(10,12,18,.7))}
.btn.danger{color:#ffb4ab;border-color:rgba(255,95,82,.4);background:linear-gradient(180deg,#2a1512,#160a09)}
.btn.wide{width:100%}
.btn.sm{min-height:var(--tap);font-size:11px;padding:0 10px}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}

/* ---------- bottom bar : CTA + nav ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:45;max-width:560px;margin:0 auto;
  padding:8px calc(12px + var(--sal)) calc(8px + var(--sab)) calc(12px + var(--sar));
  background:linear-gradient(180deg,rgba(4,5,10,0),rgba(4,5,10,.94) 26%);
  backdrop-filter:blur(8px)}
.cta{width:100%;min-height:var(--cta);border-radius:14px;position:relative;overflow:hidden;
  border:1px solid rgba(255,225,170,.55);
  background:linear-gradient(180deg,#ffe6ae,#f0a92f 46%,#a5651a);
  color:#1d1204;font-family:var(--disp);font-size:19px;font-weight:800;letter-spacing:.16em;
  box-shadow:0 10px 30px rgba(240,169,47,.30),inset 0 1px 0 rgba(255,255,255,.6);
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .12s var(--e-out),filter .2s}
.cta svg{width:20px;height:20px;flex:0 0 auto}
.cta:active{transform:translateY(2px) scale(.99)}
.cta::after{content:"";position:absolute;top:0;bottom:0;width:38%;left:-45%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);
  animation:sheen 3.6s var(--e-out) infinite}
@keyframes sheen{0%,72%{left:-45%}100%{left:120%}}
.cta[disabled]{filter:grayscale(.7) brightness(.6);pointer-events:none}
.cta small{font-family:var(--ui);font-size:10px;letter-spacing:.1em;opacity:.75;font-weight:700}
.cta.tokubi{border-color:#ffd9a0;box-shadow:0 10px 34px rgba(255,120,40,.45),inset 0 1px 0 rgba(255,255,255,.6)}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:7px}
.nav button{min-height:var(--tap);border-radius:10px;border:1px solid transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--tx-3);font-size:10px;font-weight:700;letter-spacing:.04em;
  transition:color .18s,background .18s,border-color .18s}
.nav button svg{width:19px;height:19px}
.nav button[aria-current="page"]{color:var(--gold-1);border-color:var(--edge);
  background:linear-gradient(180deg,rgba(255,180,70,.14),rgba(255,150,40,.03))}
.nav .dot{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--danger);
  top:6px;right:calc(50% - 16px);box-shadow:0 0 8px var(--danger)}
.nav button{position:relative}

/* ---------- sheets / takeover ---------- */
.veil{position:fixed;inset:0;z-index:60;display:none;background:rgba(2,3,6,.86);backdrop-filter:blur(3px)}
.veil.on{display:block;animation:veilIn .22s ease both}
@keyframes veilIn{from{opacity:0}to{opacity:1}}
.sheet{position:fixed;inset:0;z-index:61;display:none;
  max-width:560px;margin:0 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(var(--sat) + 12px) calc(12px + var(--sar)) calc(var(--sab) + 14px) calc(12px + var(--sal))}
.sheet.on{display:block;animation:sheetIn .3s var(--e-out) both}
@keyframes sheetIn{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
.sheet-card{border:1px solid var(--edge-s);border-radius:18px;overflow:hidden;
  background:linear-gradient(180deg,rgba(23,26,37,.98),rgba(8,9,14,.99));
  box-shadow:0 24px 70px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,225,170,.10)}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px 14px 10px}
.sheet-h .t{font-family:var(--disp);font-size:16px;letter-spacing:.10em;font-weight:700}
.sheet-h .x{margin-left:auto;width:var(--tap);height:var(--tap);border-radius:10px;border:1px solid var(--edge);
  display:grid;place-items:center;color:var(--tx-2);background:rgba(255,255,255,.03)}
.sheet-h svg{width:19px;height:19px;flex:0 0 auto}
.sheet-h .x svg{width:16px;height:16px}
.sheet-b{padding:0 14px 14px}

/* result */
.res-hero{position:relative;padding:16px 14px 14px;text-align:center;overflow:hidden;
  background:radial-gradient(120% 80% at 50% 0%,rgba(255,170,60,.20),transparent 62%)}
.res-hero .lbl{font-size:10px;letter-spacing:.24em;color:var(--tx-3)}
.res-hero .amt{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:42px;font-weight:800;
  line-height:1.05;margin-top:4px;letter-spacing:-.02em}
.res-hero .amt.pos{color:var(--pos);text-shadow:0 0 30px rgba(95,227,166,.35)}
.res-hero .amt.neg{color:var(--neg);text-shadow:0 0 30px rgba(255,111,94,.30)}
.res-hero .day{font-family:var(--disp);font-size:12px;letter-spacing:.18em;color:var(--gold-1)}
.slam{animation:slam .5s var(--e-out) both}
@keyframes slam{0%{opacity:0;transform:scale(1.5)}55%{opacity:1;transform:scale(.96)}100%{transform:scale(1)}}
.ev{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:10px;margin-bottom:6px;
  border:1px solid var(--edge);background:linear-gradient(180deg,rgba(38,28,18,.8),rgba(14,12,10,.8));font-size:11.5px;line-height:1.55}
.ev .ic{color:var(--gold-2);flex:0 0 auto;margin-top:1px}
.ev svg{width:14px;height:14px}
.bd{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:12px;padding:2px 0}
.bd .k{color:var(--tx-2)} .bd .k.sub{padding-left:12px;color:var(--tx-3);font-size:11px}
.bd .v{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.bd .v.sub{font-weight:500;color:var(--tx-3);font-size:11px}
.bd .div{grid-column:1/-1;height:1px;background:var(--edge);margin:6px 0}
.mach-res{max-height:190px;overflow-y:auto;overscroll-behavior:contain;margin-top:6px;
  border:1px solid var(--edge);border-radius:10px;
  -webkit-mask-image:linear-gradient(180deg,#000 88%,rgba(0,0,0,.15));mask-image:linear-gradient(180deg,#000 88%,rgba(0,0,0,.15))}
.mach-res div{display:flex;justify-content:space-between;gap:10px;padding:6px 9px;font-size:11px;
  border-bottom:1px solid rgba(255,255,255,.04)}
.mach-res div:last-child{border-bottom:0}
.mach-res .m{color:var(--tx-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mach-res .n{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:700;flex:0 0 auto}
.banner{border-radius:12px;padding:12px;margin-top:10px;text-align:center;border:1px solid}
.banner.clear{border-color:var(--gold-1);background:linear-gradient(180deg,rgba(255,190,70,.2),rgba(90,60,10,.2))}
.banner.dead{border-color:rgba(255,77,67,.6);background:linear-gradient(180deg,rgba(120,25,20,.35),rgba(30,8,6,.4))}
.banner .rank{font-family:var(--disp);font-size:38px;font-weight:800;color:var(--gold-1);line-height:1;
  text-shadow:0 0 26px rgba(246,189,78,.5)}
.week{margin-top:10px;border-top:1px dashed var(--edge);padding-top:10px}
.week h4{margin:0 0 6px;font-family:var(--disp);font-size:13px;letter-spacing:.1em;color:var(--gold-1)}
.adv{display:flex;gap:7px;font-size:11.5px;line-height:1.6;color:var(--tx-2);padding:5px 0}
.adv svg{width:13px;height:13px;color:var(--gold-2);flex:0 0 auto;margin-top:3px}

/* day transition */
#curtain{position:fixed;inset:0;z-index:70;display:none;pointer-events:none;background:#04050a}
#curtain.on{display:block}
#curtain .flare{position:absolute;left:50%;top:50%;width:150vmax;height:150vmax;transform:translate(-50%,-50%) scale(0);
  background:radial-gradient(circle,rgba(255,196,110,.9),rgba(255,150,50,.25) 30%,transparent 62%)}
#curtain.run{animation:curtain 760ms var(--e-out) both}
#curtain.run .flare{animation:flare 760ms var(--e-out) both}
@keyframes curtain{0%{opacity:0}18%{opacity:1}72%{opacity:1}100%{opacity:0}}
@keyframes flare{0%{transform:translate(-50%,-50%) scale(0);opacity:0}
  30%{transform:translate(-50%,-50%) scale(.6);opacity:1}100%{transform:translate(-50%,-50%) scale(1.6);opacity:0}}
#curtain .cw{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
#curtain .cw .t{font-family:var(--disp);font-size:26px;letter-spacing:.5em;color:var(--gold-1);
  text-shadow:0 0 26px rgba(246,189,78,.6);opacity:0}
#curtain.run .cw .t{animation:ctext 760ms var(--e-out) both}
@keyframes ctext{0%{opacity:0;letter-spacing:.2em}30%{opacity:1;letter-spacing:.5em}80%{opacity:1}100%{opacity:0}}

/* toast */
#toasts{position:fixed;left:0;right:0;bottom:calc(var(--navbar) + 8px);z-index:80;
  display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 14px}
.toast{max-width:400px;width:100%;display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:12px;
  border:1px solid var(--gold-2);background:linear-gradient(180deg,rgba(62,44,12,.96),rgba(20,14,5,.96));
  box-shadow:0 10px 30px rgba(0,0,0,.6),0 0 26px rgba(246,189,78,.18);
  font-size:12px;font-weight:700;animation:toastIn .34s var(--e-out) both}
.toast .medal{width:26px;height:26px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  background:linear-gradient(180deg,var(--gold-1),var(--gold-3));color:#1c1305}
.toast .medal svg{width:15px;height:15px}
.toast small{display:block;font-weight:500;color:var(--tx-3);font-size:10px}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}

/* ---------- shop ---------- */
.shop-card{position:relative;border:1px solid var(--edge);border-radius:14px;overflow:hidden;margin-bottom:10px;
  background:linear-gradient(180deg,rgba(26,29,41,.95),rgba(10,12,18,.95))}
.shop-hero{display:flex;gap:12px;padding:12px}
.shop-art{width:74px;height:96px;flex:0 0 auto;border-radius:9px;position:relative;overflow:hidden;
  border:1px solid rgba(255,255,255,.08);background:linear-gradient(180deg,#232634,#0a0b11)}
.shop-art i{position:absolute;left:6px;right:6px;top:6px;height:30px;border-radius:4px;display:block;
  background:linear-gradient(180deg,var(--cc),rgba(0,0,0,.4));box-shadow:0 0 18px var(--cc)}
.shop-art u{position:absolute;left:9px;right:9px;top:42px;height:9px;border-radius:2px;
  background:rgba(255,240,210,.7);display:block}
.shop-art s{position:absolute;left:6px;right:6px;bottom:8px;height:20px;border-radius:3px;background:#05060a;display:block;text-decoration:none}
.shop-meta{min-width:0;flex:1}
.shop-name{font-size:14px;font-weight:700;line-height:1.3}
.shop-price{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:17px;font-weight:800;color:var(--gold-1);margin-top:4px}
.kv{display:flex;gap:10px;margin-top:6px;font-size:10px;color:var(--tx-3);flex-wrap:wrap}
.kv b{font-family:var(--num);color:var(--tx-1);font-weight:700}
.shop-acts{display:flex;gap:6px;padding:0 12px 12px}

/* ---------- ledger ---------- */
.chart-wrap{position:relative}
.chart-wrap svg{width:100%;height:auto;display:block}
.tip{position:absolute;pointer-events:none;display:none;transform:translate(-50%,-118%);
  background:rgba(8,9,14,.96);border:1px solid var(--edge-s);border-radius:8px;padding:5px 9px;
  font-family:var(--num);font-variant-numeric:tabular-nums;font-size:11px;white-space:nowrap;z-index:3}
.legend{display:flex;gap:12px;justify-content:center;font-size:10px;color:var(--tx-3);margin-top:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.led{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;
  padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.05)}
.led:last-child{border-bottom:0}
.led .d{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:11px;color:var(--tx-3)}
.led .net{grid-row:1/3;font-family:var(--num);font-variant-numeric:tabular-nums;font-size:15px;font-weight:800;text-align:right}
.led .meta{grid-column:1/3;font-size:10px;color:var(--tx-3);font-family:var(--num);font-variant-numeric:tabular-nums}
.led .flag{font-size:9px;font-weight:700;padding:1px 5px;border-radius:4px;border:1px solid currentColor;margin-left:5px}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ---------- achievements ---------- */
.ach{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.ach:last-child{border-bottom:0}
.ach .m{width:34px;height:34px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;
  border:1px solid var(--edge);background:linear-gradient(180deg,#1a1d28,#0b0d13);color:var(--tx-3)}
.ach.got .m{border-color:var(--gold-1);color:#1c1305;background:linear-gradient(180deg,var(--gold-1),var(--gold-3));
  box-shadow:0 0 16px rgba(246,189,78,.35)}
.ach .n{font-size:12px;font-weight:700}
.ach.got .n{color:var(--gold-1)}
.ach .d{font-size:10px;color:var(--tx-3)}
.ach:not(.got){opacity:.55}
.ach svg{width:17px;height:17px}

/* ---------- trial machines ---------- */
.mach{border:1px solid var(--edge-s);border-radius:18px;overflow:hidden;
  background:linear-gradient(180deg,#1b1e2a,#07080d);
  box-shadow:0 20px 60px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.08)}
.mach-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--edge);
  background:linear-gradient(180deg,rgba(255,166,60,.10),transparent)}
.mach-h .nm{display:block;font-size:13px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mach-h .sp{display:block;font-size:9.5px;color:var(--gold-2);margin-top:2px}
.mach-h svg{width:16px;height:16px;flex:0 0 auto}
.mach-stage{position:relative;padding:14px 12px 10px;text-align:center;
  background:radial-gradient(90% 60% at 50% 22%,rgba(255,170,60,.16),transparent 62%),#06070c}
.lamp{width:34px;height:34px;border-radius:50%;margin:0 auto 10px;
  background:radial-gradient(circle at 35% 32%,#3a2e1c,#120e08);border:2px solid #4a3c22;
  transition:all .2s}
.lamp.on{background:radial-gradient(circle at 35% 32%,#fff3cf,var(--gold-2));border-color:var(--gold-1);
  box-shadow:0 0 24px var(--gold-2),0 0 60px rgba(246,189,78,.55);animation:lampB .5s ease infinite alternate}
@keyframes lampB{from{box-shadow:0 0 16px var(--gold-2),0 0 40px rgba(246,189,78,.4)}
  to{box-shadow:0 0 30px var(--gold-1),0 0 80px rgba(255,190,90,.75)}}
.reels{display:flex;gap:8px;justify-content:center}
.reel{flex:1;max-width:96px;aspect-ratio:3/4;border-radius:10px;position:relative;overflow:hidden;
  background:linear-gradient(180deg,#fffaf0,#e8dcc4);border:3px solid #8a6c2c;
  box-shadow:inset 0 0 22px rgba(90,60,10,.35),0 6px 18px rgba(0,0,0,.5);
  display:grid;place-items:center;font-size:34px;line-height:1}
.reel.spin{animation:reelSpin .09s linear infinite}
@keyframes reelSpin{0%{box-shadow:inset 0 12px 14px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.5)}
  100%{box-shadow:inset 0 -12px 14px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.5)}}
.reel.stopped{animation:reelLand .22s var(--e-out) both}
@keyframes reelLand{0%{transform:translateY(-9%)}60%{transform:translateY(3%)}100%{transform:none}}
.digits{display:flex;gap:8px;justify-content:center}
.digit{flex:1;max-width:86px;aspect-ratio:3/4;border-radius:10px;display:grid;place-items:center;
  font-family:var(--num);font-size:40px;font-weight:800;color:var(--blue);
  background:linear-gradient(180deg,#03060e,#000);border:2px solid #23415f;
  box-shadow:inset 0 0 26px rgba(40,110,190,.28),0 6px 18px rgba(0,0,0,.5)}
.digit.spin{animation:digitF .09s linear infinite;color:#6f9fc8}
@keyframes digitF{50%{opacity:.5}}
.digit.hit{color:var(--gold-1);border-color:var(--gold-2);
  box-shadow:inset 0 0 30px rgba(246,189,78,.4),0 0 22px rgba(246,189,78,.55)}
.mach-banner{min-height:26px;margin-top:8px;font-family:var(--disp);font-size:17px;font-weight:800;
  letter-spacing:.06em;color:var(--gold-1)}
.mach-banner.win{animation:winPulse .45s ease infinite alternate}
@keyframes winPulse{from{text-shadow:0 0 10px rgba(246,189,78,.6);transform:scale(1)}
  to{text-shadow:0 0 28px rgba(255,210,120,.95);transform:scale(1.045)}}
.reach{min-height:20px;font-family:var(--disp);font-size:14px;font-weight:800;letter-spacing:.16em;color:var(--pink)}
.reach.on{animation:winPulse .4s ease infinite alternate}
.mach-ctl{display:flex;gap:8px;justify-content:center;align-items:center;padding:12px;flex-wrap:wrap;
  border-top:1px solid var(--edge);background:linear-gradient(180deg,#12141d,#080910)}
.lever{min-height:var(--cta);flex:1;min-width:140px;border-radius:14px;border:1px solid rgba(255,225,170,.5);
  background:linear-gradient(180deg,#ffe6ae,#e59a29 50%,#96591a);color:#1d1204;
  font-family:var(--disp);font-size:16px;font-weight:800;letter-spacing:.1em;
  box-shadow:0 8px 22px rgba(229,154,41,.3),inset 0 1px 0 rgba(255,255,255,.55)}
.lever:active{transform:translateY(2px)}
.stopb{width:var(--tap);height:var(--tap);flex:0 0 auto;border-radius:50%;
  border:2px solid #7d1f18;color:#fff;font-size:11px;font-weight:800;
  background:radial-gradient(circle at 36% 30%,#ff8a7d,#b4271b 60%,#6d130e);
  box-shadow:0 6px 14px rgba(0,0,0,.55),inset 0 2px 4px rgba(255,255,255,.35)}
.stopb:active{transform:translateY(2px)}
.stopb[disabled]{filter:grayscale(.8) brightness(.55);pointer-events:none}
.mach-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--edge);border-top:1px solid var(--edge)}
.mach-stats div{background:#0a0c12;padding:7px 4px;text-align:center;min-width:0}
.mach-stats .k{font-size:8.5px;color:var(--tx-3);letter-spacing:.04em}
.mach-stats .v{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:13px;font-weight:800;margin-top:2px}
.switch{display:inline-flex;align-items:center;gap:7px;min-height:var(--tap);padding:0 12px;border-radius:10px;
  border:1px solid var(--edge);background:linear-gradient(180deg,#1b1f2b,#0d1017);font-size:12px;font-weight:700}
.switch input{appearance:none;width:34px;height:20px;border-radius:99px;background:#2a2f3d;position:relative;
  transition:background .2s;flex:0 0 auto}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
  background:#8a8577;transition:transform .2s,background .2s}
.switch input:checked{background:linear-gradient(90deg,var(--gold-3),var(--gold-1))}
.switch input:checked::after{transform:translateX(14px);background:#1c1305}
.trial-sel{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--tx-3)}
.trial-sel select{min-height:38px;border-radius:8px;border:1px solid var(--edge);
  background:linear-gradient(180deg,#1b1f2b,#0d1017);color:var(--tx-1);padding:0 8px;font-size:12px;font-weight:700}

/* onboarding */
.ob-hero{text-align:center;padding:20px 14px 14px;
  background:radial-gradient(120% 70% at 50% 0%,rgba(255,170,60,.22),transparent 62%)}
.ob-hero .logo{font-family:var(--disp);font-size:30px;font-weight:800;letter-spacing:.14em;
  background:linear-gradient(180deg,#fff3d4,var(--gold-3));-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 34px rgba(246,189,78,.28)}
.ob-hero .sub{font-size:9px;letter-spacing:.4em;color:var(--tx-3);margin-top:6px}
.ob-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:11.5px;line-height:1.6}
.ob-item:last-child{border-bottom:0}
.ob-item .ic{width:28px;height:28px;flex:0 0 auto;border-radius:8px;display:grid;place-items:center;
  border:1px solid var(--edge);background:linear-gradient(180deg,#1c202c,#0b0d13);color:var(--gold-2)}
.ob-item svg{width:15px;height:15px}
.ob-item .tt{color:var(--gold-1);display:block;font-weight:700;font-size:12px;margin-bottom:2px}
.ob-item b{color:var(--gold-1)}
.diff-grid{display:grid;gap:7px;margin-top:12px}
.diff{min-height:56px;border-radius:12px;border:1px solid var(--edge);display:flex;align-items:center;gap:10px;
  padding:0 14px;text-align:left;background:linear-gradient(180deg,#1a1e29,#0c0e15);transition:border-color .2s,transform .12s}
.diff:active{transform:scale(.99)}
.diff .nm{font-family:var(--disp);font-size:16px;font-weight:700;letter-spacing:.1em}
.diff .ds{display:block;font-size:10px;color:var(--tx-3);margin-top:2px}
.diff .mn{margin-left:auto;font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:800;font-size:14px;color:var(--gold-1)}
.diff.easy{border-color:rgba(79,224,160,.3)} .diff.easy .nm{color:var(--green)}
.diff.normal{border-color:rgba(246,189,78,.35)} .diff.normal .nm{color:var(--gold-1)}
.diff.hard{border-color:rgba(255,95,82,.35)} .diff.hard .nm{color:var(--red)}

/* wide screens: expand as side panel instead of stretching the phone UI */
#side{display:none}
@media (min-width:900px){
  #app{max-width:1000px;display:grid;grid-template-columns:minmax(0,430px) minmax(0,1fr);
    grid-template-areas:"top top" "main dock" "main side";grid-template-rows:auto auto 1fr;
    gap:0 20px;padding-right:calc(20px + var(--sar))}
  .topbar{grid-area:top}
  #main{grid-area:main}
  #main .panel{padding-bottom:28px}
  #side{grid-area:side;display:block;padding:0 0 28px}
  .dock{grid-area:dock;position:sticky;top:calc(var(--topbar) + 10px);z-index:45;
    max-width:none;margin:0;left:auto;right:auto;bottom:auto;
    padding:0 0 14px;background:none;backdrop-filter:none}
  #toasts{bottom:20px}
  .sheet{max-width:640px}
}
#side .side-in{position:sticky;top:calc(var(--topbar) + 8px)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important}
  .cta::after{display:none}
}
</style>

// ---- ゲーム状態 ----
let state = null;

function newGame(diff) {
  diff = DIFFS[diff] ? diff : "normal";
  return {
    day: 1,
    diff: diff,
    money: DIFFS[diff].money,
    rep: 50,
    regulars: 8,
    heat: 0,
    debt: 0,
    maxDebt: 0,
    rate: "normal",     // 交換率: normal=等価 / low=低換金
    trend: null,
    grandOpen: false,
    lastGrand: -99,
    cap: 10,
    staff: 2,
    ad: "none",
    machines: [
      makeMachine("p1"),
      makeMachine("s1"),
    ],
    history: [],
    ach: [],
    evCd: {},
    cleared: false,
    clearDay: null,
    uid: 1000,
  };
}

function makeMachine(catalogId) {
  const c = CATALOG.find(m => m.id === catalogId);
  return {
    uid: null,
    cid: c.id,
    pop: c.pop,
    setting: 3,
    boughtDay: null,
    lastNet: null,
    lastCust: null,
  };
}

function catalogOf(m) { return CATALOG.find(c => c.id === m.cid); }
function machineValue(m) { return Math.round(catalogOf(m).price * 0.45); }
function machineAssets() { return state.machines.reduce((s, m) => s + machineValue(m), 0); }
function totalAssets() { return state.money + machineAssets() - state.debt; }
function creditLimit() { return Math.round(machineAssets() * 0.7) + 2000000; }
function isTokubi(day) { return String(day).includes("7"); }
function isWeekend(day) { const w = day % 7; return w === 6 || w === 0; }
function staffNeeded() { return Math.max(1, Math.ceil(state.machines.length / 8)); }

function islandBonus(cid) {
  const n = state.machines.filter(x => x.cid === cid).length;
  return 1 + Math.min(0.06 * (n - 1), 0.3);
}
function trendMult(cid) {
  return state.trend && state.trend.ids.includes(cid) ? 1.4 : 1;
}
function effectivePop(m) {
  const isNew = state.day - (m.boughtDay ?? -99) < 5;
  return m.pop * (isNew ? 1.4 : 1) * (1 + (m.setting - 3) * 0.05) * islandBonus(m.cid) * trendMult(m.cid);
}

function simulateDay() {
  const s = state;
  const D = DIFFS[s.diff] || DIFFS.normal;
  const notes = [];

  // --- トレンド更新(7日ごと) ---
  if (!s.trend || s.day % 7 === 1) {
    const t = TRENDS[Math.floor(Math.random() * TRENDS.length)];
    s.trend = { name: t.name, ids: t.ids.slice() };
    notes.push(t.ids.length
      ? `📈 今週の街は「${t.name}」!該当機種の人気1.4倍`
      : "📉 今週は特にブームなし。地力の勝負。");
  }

  const tokubi = isTokubi(s.day);
  const weekend = isWeekend(s.day);

  // --- 設定集計 ---
  const n = s.machines.length;
  const avgSet = n ? s.machines.reduce((a, m) => a + m.setting, 0) / n : 3;
  const highList = s.machines.filter(m => m.setting >= 5);

  // --- イベント(運80種+数値依存50種) ---
  let custMult = 1, repDelta = 0, extraCost = 0, marginDelta = 0, eventGain = 0;
  const applyEv = e => {
    notes.push(e.msg);
    if (e.cust) custMult *= e.cust;
    repDelta += e.rep ?? 0;
    extraCost += e.cost ?? 0;
    eventGain += e.gain ?? 0;
    marginDelta += e.margin ?? 0;
    if (e.regs) s.regulars = Math.max(0, s.regulars + e.regs);
    if (e.heat) s.heat = Math.max(0, s.heat + e.heat);
  };
  // 運イベント: 1日1回、50%で重み抽選
  if (Math.random() < LUCK_DAILY_P) {
    const totalW = LUCK_EVENTS.reduce((a, e) => a + e.w, 0);
    let r = Math.random() * totalW;
    for (const e of LUCK_EVENTS) { r -= e.w; if (r < 0) { applyEv(e); break; } }
  }
  // 数値依存イベント: 条件を満たすものから1日最大1つ
  {
    if (!s.evCd) s.evCd = {};
    const x = {
      n, avgSet, tokubi, weekend,
      highCount: highList.length,
      avgPop: n ? s.machines.reduce((a, m) => a + m.pop, 0) / n : 0,
      maxPop: s.machines.reduce((a, m) => Math.max(a, m.pop), 0),
      maxIsland: (() => { const c = {}; let mx = 0; for (const m of s.machines) { c[m.cid] = (c[m.cid] || 0) + 1; mx = Math.max(mx, c[m.cid]); } return mx; })(),
      newCount: s.machines.filter(m => m.boughtDay !== null && s.day - m.boughtDay < 5).length,
      hasP: s.machines.some(m => catalogOf(m).type === "P"),
      hasS: s.machines.some(m => catalogOf(m).type === "S"),
      allSame: n > 0 && s.machines.every(m => m.setting === s.machines[0].setting),
    };
    const elig = COND_EVENTS.filter(e => s.day - (s.evCd[e.id] ?? -1e9) >= (e.cd ?? 7) && e.when(s, x));
    const fired = elig.filter(e => Math.random() < (e.p ?? 0.4));
    if (fired.length) {
      const e = fired[Math.floor(Math.random() * fired.length)];
      s.evCd[e.id] = s.day;
      applyEv(e);
    }
  }

  if (tokubi) { custMult *= 1.7; notes.push("🔥 本日は特日(7のつく日)!開店前から行列が!"); }
  else if (weekend) { custMult *= 1.3; notes.push("📅 週末で客足は上々。"); }

  // --- 新装開店フェア ---
  const grandToday = s.grandOpen;
  if (grandToday) {
    s.grandOpen = false;
    custMult *= 1.5; repDelta += 2;
    notes.push("🎊 新装開店フェア開催!普段来ない客まで大挙来店!");
  }

  // --- 行政・組合ヒート(回収営業の監視) ---
  if (n && avgSet < 2.6) s.heat += (2.6 - avgSet) * 2.2 * D.heatMul;
  else s.heat = Math.max(0, s.heat * 0.65 - 0.2);
  if (s.heat > 8 && Math.random() < 0.25) {
    extraCost += 500000; repDelta -= 8; s.heat = 2;
    notes.push("🚨 行政指導が入った!罰金¥500,000、悪評が広がり評判ダウン…");
    grantAch("shidou");
  } else if (s.heat > 5) {
    notes.push("⚠️ 渋い営業が続き、組合・行政の目が厳しくなっている…(指導リスク上昇中)");
  }

  // --- 客層別の来店数 ---
  // 集客力: 台の実効人気(新台効果・トレンド・シマ・設定込み)の平均が
  // 来店客数の絶対値を動かす。古い台を放置した店には客は来ない。
  const capacity = n * 20;
  const totalW = s.machines.reduce((sum, m) => sum + effectivePop(m), 0) || 1;
  // 集客力 = 素の台人気の平均(ボロ台を並べた店に客は来ない)+ 新台の話題性
  const avgPopRaw = n ? s.machines.reduce((a, m) => a + m.pop, 0) / n : 0;
  const newCountA = s.machines.filter(m => m.boughtDay !== null && s.day - m.boughtDay < 5).length;
  const attract = Math.min(1.25, Math.max(0.65,
    0.55 + (avgPopRaw / 65) * 0.45 + Math.min(0.12, newCountA * 0.03)));
  const fillRate = (0.10 + (s.rep / 100) * 0.66) * attract * (D.fillMul || 1);
  const rateMod = s.rate === "low" ? 0.88 : 1;

  // 広告: 固定分+店舗規模に比例する分
  const ad = ADS.find(a => a.id === s.ad);
  const adBoost = ad.flat + capacity * fillRate * ad.pct;

  let casual = (capacity * fillRate * custMult + adBoost) * rand(0.9, 1.1);

  const need = staffNeeded();
  const staffOK = s.staff >= need;
  if (!staffOK) {
    casual *= 0.85; repDelta -= 2;
    notes.push("⚠️ スタッフ不足で店内が回らず、客が苛立っている…");
  }

  let regs = Math.round(s.regulars * (tokubi ? 0.9 : 0.65) * (s.rate === "low" ? 0.95 : 1) * rand(0.9, 1.05));
  let pros = highList.length
    ? Math.round(Math.min(highList.length * 3 * D.proMul * (tokubi ? 1.5 : 1), capacity * 0.15) * rand(0.8, 1.2))
    : 0;
  if (pros > 0) notes.push(`🕶️ 高設定の匂いを嗅ぎつけたプロが${pros}人来店。彼らは勝ちにだけ来る…`);
  // 特日・新装開店は立ち回り客で収容+15%まで詰め込める
  const capMax = Math.round(capacity * ((tokubi || grandToday) ? 1.15 : 1));
  regs = Math.min(regs, capMax);
  casual = Math.floor(Math.max(0, Math.min(casual, capMax - regs - pros)) * rateMod);
  const customers = n ? casual + regs + pros : 0;

  // --- 台ごとの売上・粗利 ---
  const highW = highList.reduce((sum, m) => sum + effectivePop(m), 0) || 1;
  const rateBonus = s.rate === "low" ? 0.025 : 0;
  let sales = 0, gross = 0;
  // 特日に渋い店では客が期待外れと悟って早帰り→打ち込みが浅くなる
  const tokubiGap = (tokubi && avgSet < 3.5) ? 0.7 : 1;
  for (const m of s.machines) {
    const c = catalogOf(m);
    const w = effectivePop(m) / totalW;
    const nCas = casual * w;
    const nReg = regs * w;
    const nPro = m.setting >= 5 ? pros * (effectivePop(m) / highW) : 0;
    // 台の鮮度: 人気が枯れた台は座られても打ち込まれない
    const qual = 0.75 + 0.25 * Math.min(1, m.pop / 80);
    const spend = (c.type === "P" ? 30000 : 36000) * qual * tokubiGap * rand(0.8, 1.2);
    const margin = MARGIN[m.setting] + rateBonus + marginDelta + rand(-0.09, 0.09);
    const mSales = nCas * spend + nReg * spend * 1.35 + nPro * 45000;
    const mGross = (nCas * spend + nReg * spend * 1.35) * margin + nPro * 45000 * (margin - 0.16);
    sales += mSales;
    gross += mGross;
    m.lastNet = Math.round(mGross);
    m.lastCust = Math.round(nCas + nReg + nPro);
    m.pop = Math.max(15, m.pop - c.decay * rand(0.7, 1.3));
  }
  const payout = sales - gross;

  // --- 経費 ---
  const rent = Math.round((30000 + s.cap * 2500) * D.rentMul);
  const wages = s.staff * 13000;
  const utility = n * 2500;
  const interest = Math.round(s.debt * 0.0025);
  const expenses = rent + wages + utility + ad.cost + extraCost + interest;
  if (extraCost > 0) notes.push(`💸 臨時支出 ${yen(extraCost)}`);

  const net = gross - expenses + eventGain;
  s.money += Math.round(net);

  // --- 常連プールの増減 ---
  if (n) {
    // 特日に応えた日・新装開店の日は新規客が固定客になりやすい
    let convMult = 1;
    if (tokubi && avgSet >= 4.5) convMult = 2;
    else if (tokubi && avgSet >= 4) convMult = 1.5;
    if (grandToday) convMult *= 2;
    convMult *= 1 + ad.pct * 3; // 広告で来た新規客が気に入れば固定客に
    if (avgSet >= 3.4 && staffOK) s.regulars += (casual * 0.025 + 0.5) * convMult;
    else if (avgSet < 2.5) s.regulars *= 0.94;
    if (tokubi && avgSet < 3) { s.regulars *= 0.85; }
    else if (tokubi && avgSet < 3.5) { s.regulars *= 0.95; }
    if (s.rep < 35) s.regulars *= 0.97;
    s.regulars = Math.max(0, Math.min(capacity * 0.5, s.regulars));
  }

  // --- 評判の増減 ---
  if (n) {
    let d = (avgSet - 3) * 1.4;
    if (tokubi) {
      // 特日は客の期待値が高い: 「普段通り」ですら減点される
      if (avgSet >= 4.5) { d += 5; notes.push("🤩 特日に全力放出!伝説の一日として語り草に!"); }
      else if (avgSet >= 4) { d += 4; notes.push("😊 特日にしっかり出した!客は大満足、評判が上がった!"); }
      else if (avgSet >= 3.5) { /* 及第点: 加点も減点もなし */ }
      else if (avgSet >= 3) { d -= 1; notes.push("😕 特日なのに普段通りの営業…期待して来た客はしらけ気味。"); }
      else { d -= 6; notes.push("😡 特日なのに回収営業…客が激怒、評判ガタ落ち!"); }
    }
    repDelta += d;
  }
  s.rep = Math.max(1, Math.min(100, s.rep + repDelta + rand(-0.5, 0.5)));

  s.ad = "none";

  // --- 資金ショート時の緊急融資 ---
  if (s.money < 0) {
    const need2 = -s.money + 200000;
    if (s.debt + need2 <= creditLimit()) {
      s.debt += need2;
      s.maxDebt = Math.max(s.maxDebt, s.debt);
      s.money += need2;
      notes.push(`🏦 資金ショート!銀行から緊急融資 ${yen(need2)} を受けた(金利0.25%/日)。借金地獄に注意…`);
    }
  }

  // --- 記録 ---
  const rec = {
    day: s.day, cust: customers, cas: casual, reg: regs, pro: pros,
    sales: Math.round(sales), payout: Math.round(payout),
    exp: Math.round(expenses), net: Math.round(net), interest,
    note: tokubi ? "特日" : (weekend ? "週末" : ""),
  };
  s.history.unshift(rec);
  if (s.history.length > 60) s.history.pop();

  s.day++;

  // --- 実績チェック ---
  grantAch("first-day");
  if (rec.net >= 1000000) grantAch("million");
  if (s.rep >= 90) grantAch("rep90");
  if (s.regulars >= 50) grantAch("reg50");
  if (s.machines.length >= 20) grantAch("m20");
  if (s.machines.length >= 60) grantAch("m60");
  if (rec.day >= 30) grantAch("d30");
  if (tokubi && avgSet >= 5) grantAch("tokubi-god");
  if (s.debt === 0 && s.maxDebt >= 10000000) grantAch("loan-clear");
  if (totalAssets() >= 30000000) grantAch("asset30m");
  if (totalAssets() >= GOAL_ASSETS) grantAch("asset100m");
  if (!s.cleared && totalAssets() >= GOAL_ASSETS) { s.cleared = true; s.clearDay = rec.day; }

  save(true);
  return { rec, notes };
}

function clearRank(d) { return d <= 65 ? "S" : d <= 85 ? "A" : d <= 120 ? "B" : "C"; }

function weeklyReport(rec) {
  if (rec.day % 7 !== 0 || state.history.length < 7) return "";
  const wk = state.history.slice(0, 7);
  const total = wk.reduce((a, r) => a + r.net, 0);
  const avgCust = Math.round(wk.reduce((a, r) => a + r.cust, 0) / 7);
  const advice = [];
  const avgSet = state.machines.length
    ? state.machines.reduce((a, m) => a + m.setting, 0) / state.machines.length : 3;
  const avgPop = state.machines.length
    ? state.machines.reduce((a, m) => a + m.pop, 0) / state.machines.length : 0;
  if (state.rep < 40) advice.push("評判が危険水域。設定を上げて信頼回復を。");
  else if (state.rep > 85 && avgSet > 4) advice.push("評判は十分高い。設定を少し落として回収しても客はすぐには離れない。");
  if (state.heat > 5) advice.push("行政の目が厳しい。数日は設定を開けてほとぼりを冷まそう。");
  if (state.debt > 0 && state.debt > totalAssets() * 0.5) advice.push("借金が資産に対して重い。利息が経営を蝕む前に返済を。");
  if (avgPop < 40 && state.machines.length) advice.push("台の人気が枯れてきている。新台入替+新装開店フェアで話題を作ろう。");
  if (state.regulars < state.machines.length * 3 && avgSet < 3.4)
    advice.push("常連が育っていない。平均設定3.4以上を保つ日を作ると固定客が増える。");
  if (state.cap < MAX_CAP && state.machines.length >= state.cap && state.money > expandCost() + 2000000)
    advice.push("満台状態で資金にも余裕あり。店舗拡張のチャンス。");
  if (!advice.length) advice.push("経営は順調。この調子で!");
  return `<div class="weekreport">
    <h4>📋 週次レポート (${rec.day - 6}〜${rec.day}日目)</h4>
    <div class="result-row"><span>週間純利益</span><b class="${total >= 0 ? "pos" : "neg"}">${total >= 0 ? "+" : ""}${yen(total)}</b></div>
    <div class="result-row"><span>平均客数</span><b>${avgCust}人/日</b></div>
    <div class="result-row"><span>常連客</span><b>${Math.round(state.regulars)}人</b></div>
    <div class="eventmsg">💡 ${advice.join("<br>💡 ")}</div>
  </div>`;
}

const SLOT_SYMBOLS = ["7️⃣", "🍇", "🍒", "🅱️", "🔔", "🃏"];

// セーブデータの無害化: 型崩れ・範囲外・不正ID・HTML注入をすべて補正/除去する。
// (手動編集・旧バージョン・破損への防御。ここを通った値だけがゲームに入る)
function sanitizeState(s) {
  const num = (v, def, min, max) => {
    v = Number(v);
    if (!Number.isFinite(v)) v = def;
    return Math.min(max, Math.max(min, v));
  };
  s.day = Math.floor(num(s.day, 1, 1, 1000000));
  s.money = Math.round(num(s.money, 0, -1e13, 1e13));
  s.rep = num(s.rep, 50, 1, 100);
  s.regulars = num(s.regulars, 0, 0, 100000);
  s.heat = num(s.heat, 0, 0, 200);
  s.debt = Math.round(num(s.debt, 0, 0, 1e12));
  s.maxDebt = Math.round(num(s.maxDebt, 0, 0, 1e12));
  s.cap = Math.floor(num(s.cap, 10, 10, MAX_CAP));
  s.staff = Math.floor(num(s.staff, 2, 1, 200));
  s.uid = Math.floor(num(s.uid, 1000, 0, 1e9));
  s.lastGrand = Math.floor(num(s.lastGrand, -99, -99, 1000000));
  s.diff = DIFFS[s.diff] ? s.diff : "normal";
  s.rate = s.rate === "low" ? "low" : "normal";
  s.ad = ADS.some(a => a.id === s.ad) ? s.ad : "none";
  s.grandOpen = s.grandOpen === true;
  s.cleared = s.cleared === true;
  s.clearDay = Number.isFinite(Number(s.clearDay)) && s.clearDay !== null
    ? Math.floor(Number(s.clearDay)) : null;
  // 台: 実在機種のみ・値をクランプ・上限台数まで
  s.machines = (Array.isArray(s.machines) ? s.machines : [])
    .filter(m => m && typeof m === "object" && CATALOG.some(c => c.id === m.cid))
    .slice(0, MAX_CAP)
    .map(m => {
      const c = CATALOG.find(x => x.id === m.cid);
      return {
        uid: Math.floor(num(m.uid, 0, 0, 1e9)),
        cid: c.id,
        pop: num(m.pop, c.pop, 15, 300),
        setting: Math.floor(num(m.setting, 3, 1, 6)),
        boughtDay: Number.isFinite(Number(m.boughtDay)) && m.boughtDay !== null
          ? Math.floor(Number(m.boughtDay)) : null,
        lastNet: Number.isFinite(Number(m.lastNet)) && m.lastNet !== null ? Math.round(Number(m.lastNet)) : null,
        lastCust: Number.isFinite(Number(m.lastCust)) && m.lastCust !== null ? Math.round(Number(m.lastCust)) : null,
      };
    });
  // トレンド: 既知の名前だけ許可(表示はinnerHTML経由のため必須)
  if (s.trend && typeof s.trend === "object") {
    const t = TRENDS.find(x => x.name === s.trend.name);
    s.trend = t ? { name: t.name, ids: t.ids.slice() } : null;
  } else s.trend = null;
  // 実績/イベントCD: 既知IDのみ
  s.ach = (Array.isArray(s.ach) ? s.ach : []).filter(id => ACHIEVEMENTS.some(a => a.id === id));
  const cd = {};
  if (s.evCd && typeof s.evCd === "object" && !Array.isArray(s.evCd)) {
    for (const e of COND_EVENTS) {
      if (Number.isFinite(Number(s.evCd[e.id]))) cd[e.id] = Math.floor(Number(s.evCd[e.id]));
    }
  }
  s.evCd = cd;
  // 帳簿: 数値フィールドを再構築、noteは既知の値だけ(innerHTML表示のため)
  s.history = (Array.isArray(s.history) ? s.history : [])
    .filter(r => r && typeof r === "object")
    .slice(0, 60)
    .map(r => ({
      day: Math.floor(num(r.day, 0, 0, 1000000)),
      cust: Math.round(num(r.cust, 0, 0, 1e6)),
      cas: Math.round(num(r.cas, 0, 0, 1e6)),
      reg: Math.round(num(r.reg, 0, 0, 1e6)),
      pro: Math.round(num(r.pro, 0, 0, 1e6)),
      sales: Math.round(num(r.sales, 0, -1e13, 1e13)),
      payout: Math.round(num(r.payout, 0, -1e13, 1e13)),
      exp: Math.round(num(r.exp, 0, 0, 1e13)),
      net: Math.round(num(r.net, 0, -1e13, 1e13)),
      interest: Math.round(num(r.interest, 0, 0, 1e12)),
      note: (r.note === "特日" || r.note === "週末") ? r.note : "",
    }));
  return s;
}

function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (!s || typeof s !== "object" || !Array.isArray(s.machines)) return null;
      return sanitizeState(s);
    }
  } catch (e) {}
  return null;
}

/* ---------- ART_SLOT: hall-overview (手続き生成のプレースホルダ) ----------
   最終稿は同スロットへ差し替える。dark × gold の統一トーンで、
   奥行き・熱気・営業中の気配だけを表現する(実機の意匠は描かない)。 */
function buildStageArt() {
  const W = 900, H = 520, VX = 450, VY = 214;
  const out = [];
  let seed = 20250904;
  const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647;
  const lerp = (a, b, t) => a + (b - a) * t;
  const ACCENTS = ["#ffb04d", "#ff8a2b", "#d9553f", "#c98a35", "#e0a24a", "#a8602f"];

  out.push(`<defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0b12"/><stop offset="1" stop-color="#17120c"/></linearGradient>
    <linearGradient id="flr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241a10"/><stop offset="1" stop-color="#07070b"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffcf8a" stop-opacity=".85"/>
      <stop offset="45%" stop-color="#ff9a3c" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#ff8a2b" stop-opacity="0"/></radialGradient>
    <linearGradient id="vig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04050a" stop-opacity=".80"/>
      <stop offset="38%" stop-color="#04050a" stop-opacity="0"/>
      <stop offset="72%" stop-color="#04050a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#04050a" stop-opacity=".62"/></linearGradient>
    <filter id="sb" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="hz" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="26"/></filter>
  </defs>`);

  /* 天井と床 */
  out.push(`<rect width="${W}" height="${VY + 6}" fill="url(#sky)"/>`);
  out.push(`<rect y="${VY}" width="${W}" height="${H - VY}" fill="url(#flr)"/>`);

  /* 天井の照明ライン(消失点へ収束) */
  for (let i = -5; i <= 5; i++) {
    const x0 = VX + i * 190, y0 = -30;
    out.push(`<path d="M${x0} ${y0} L${VX} ${VY}" stroke="#ffcf8a" stroke-width="${2.2 - Math.abs(i) * 0.16}"
      opacity="${0.16 - Math.abs(i) * 0.02}" filter="url(#sb)"/>`);
  }
  /* 奥のホール灯 */
  out.push(`<ellipse cx="${VX}" cy="${VY + 4}" rx="230" ry="120" fill="url(#glow)"/>`);

  /* 島(バンク)を手前から奥へ */
  const ROWS = 13;
  for (let k = ROWS - 1; k >= 0; k--) {
    const t = k / (ROWS - 1);                    // 0=手前 1=奥
    const d = 0.74 * Math.pow(1 - t, 1.75) + .02; // 手前ほど大きい(画角に収まる範囲で)
    const y = lerp(VY + 10, H + 40, d);          // 床の接地位置
    const aisle = lerp(16, 300, d);              // 通路の半幅
    const cw = lerp(9, 128, d);                  // 筐体の幅
    const ch = lerp(24, 300, d);                 // 筐体の高さ
    const op = lerp(0.5, 1, d);
    for (const side of [-1, 1]) {
      const near = VX + side * aisle;
      const far = near + side * cw;
      const x0 = Math.min(near, far);
      const acc = ACCENTS[(k * 2 + (side > 0 ? 1 : 0)) % ACCENTS.length];
      out.push(`<g opacity="${op.toFixed(3)}">`);
      /* 筐体本体 */
      out.push(`<path d="M${x0} ${y - ch} h${cw} v${ch} h${-cw} z" fill="#12131b"/>`);
      /* 上部の冠ランプ */
      out.push(`<rect x="${x0}" y="${y - ch}" width="${cw}" height="${ch * 0.055}" fill="${acc}" opacity=".95"/>`);
      out.push(`<rect x="${x0 - cw * .06}" y="${y - ch - ch * .02}" width="${cw * 1.12}" height="${ch * 0.11}"
        fill="${acc}" opacity=".33" filter="url(#sb)"/>`);
      /* 液晶面 */
      out.push(`<rect x="${x0 + cw * .12}" y="${y - ch * .84}" width="${cw * .76}" height="${ch * .40}"
        rx="${cw * .05}" fill="${acc}" opacity=".62"/>`);
      out.push(`<rect x="${x0 + cw * .12}" y="${y - ch * .84}" width="${cw * .76}" height="${ch * .40}"
        rx="${cw * .05}" fill="#fff2d8" opacity=".14"/>`);
      /* 受け皿・下皿 */
      out.push(`<rect x="${x0 + cw * .08}" y="${y - ch * .40}" width="${cw * .84}" height="${ch * .05}" fill="#f6dcae" opacity=".5"/>`);
      out.push(`<rect x="${x0}" y="${y - ch * .27}" width="${cw}" height="${ch * .12}" fill="#05060a" opacity=".9"/>`);
      /* 床への映り込み */
      out.push(`<rect x="${x0}" y="${y}" width="${cw}" height="${ch * .22}" fill="${acc}" opacity="${0.12 * d}"/>`);
      out.push(`</g>`);
    }
    /* 通路の光だまり */
    out.push(`<ellipse cx="${VX}" cy="${y}" rx="${aisle * .9}" ry="${lerp(3, 26, d)}"
      fill="#ffb861" opacity="${(0.05 + 0.06 * d).toFixed(3)}" filter="url(#sb)"/>`);
    /* 客のシルエット(手前側の島だけ) */
    if (d > 0.16) {
      const n = Math.round(lerp(1, 4, d));
      for (let i = 0; i < n; i++) {
        const side = rnd() < 0.5 ? -1 : 1;
        const px = VX + side * (aisle * lerp(0.25, 0.92, rnd()));
        const s = ch * 0.34;
        out.push(`<g fill="#020308" opacity="${(0.55 + 0.4 * d).toFixed(2)}">`);
        out.push(`<circle cx="${px}" cy="${y - s * 0.92}" r="${s * 0.17}"/>`);
        out.push(`<path d="M${px - s * .21} ${y} q${-s * .02} ${-s * .52} ${s * .09} ${-s * .60}
          h${s * .25} q${s * .12} ${s * .08} ${s * .09} ${s * .60} z"/></g>`);
      }
    }
  }

  /* 空気(熱気)と周辺減光 */
  out.push(`<ellipse cx="${VX}" cy="${VY + 30}" rx="330" ry="150" fill="#ff9a3c" opacity=".14" filter="url(#hz)"/>`);
  out.push(`<rect width="${W}" height="${H}" fill="url(#vig)"/>`);
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMax slice" style="position:absolute;inset:0;width:100%;height:100%">${out.join("")}</svg>`;
}

/* ---------- top / hud ---------- */
function renderTop() {
  const tk = isTokubi(state.day), wk = isWeekend(state.day);
  $("tDay").textContent = state.day;
  const f = [];
  if (tk) f.push('<span class="tag tokubi">特日</span>');
  else if (wk) f.push('<span class="tag week">週末</span>');
  if (state.trend && state.trend.ids.length) f.push(`<span class="tag boom">${esc(state.trend.name)}</span>`);
  $("tFlags").innerHTML = f.join("");
}
function renderHud() {
  $("hMoney").textContent = yen(state.money);
  const last = state.history[0];
  const nEl = $("hNet");
  if (last) { nEl.textContent = sign(last.net); nEl.className = "num " + (last.net >= 0 ? "pos" : "neg"); }
  else { nEl.textContent = "—"; nEl.className = "num"; }
  $("hAsset").textContent = yenShort(totalAssets());
  $("hRep").textContent = Math.round(state.rep) + " / 100";
  $("hRep").className = "n num" + (state.rep < 35 ? " warnv" : "");
  $("hReg").textContent = Math.round(state.regulars) + "人";
  $("hDebt").textContent = state.debt > 0 ? yenShort(state.debt) : "なし";
  $("hDebt").className = "n num" + (state.debt > 0 ? " warnv" : "");
  const pct = Math.max(0, Math.min(100, totalAssets() / GOAL_ASSETS * 100));
  $("gPct").textContent = pct.toFixed(1) + "%";
  $("gBar").style.width = pct + "%";
}
const renderStatus = () => { renderTop(); renderHud(); };

function renderStage() {
  const n = state.machines.length, last = state.history[0];
  const heat = Math.min(100, state.heat / 12 * 100);
  const chips = [
    `<span class="chip acc">${ic("slot")}台数 <b>${n}/${state.cap}</b></span>`,
    `<span class="chip">${ic("users")}常連 <b>${Math.round(state.regulars)}</b></span>`,
    `<span class="chip">${ic("star")}評判 <b>${Math.round(state.rep)}</b></span>`,
    last ? `<span class="chip">${ic("cal")}前日客数 <b>${last.cust}</b></span>` : "",
    state.heat > 5 ? `<span class="chip" style="color:${state.heat > 8 ? "var(--danger)" : "var(--warn)"}">${ic("shield")}警戒 <b>${Math.round(heat)}%</b></span>` : "",
  ].filter(Boolean).join("");
  $("stageChips").innerHTML = chips;
  const s = stratSummary();
  if (s) {
    $("stratVal").className = "val " + s.mode.k;
    $("stratVal").textContent = s.mode.t;
    $("stratSide").innerHTML =
      `<span>平均設定 <b>${s.avg.toFixed(1)}</b></span><span>高設定 <b>${s.hi}</b></span><span>低設定 <b>${s.lo}</b></span>`;
  } else {
    $("stratVal").className = "val"; $("stratVal").textContent = "台がありません";
    $("stratSide").innerHTML = "";
  }
}

    "<b>設定5〜6</b>は常連が育つが<b>プロ</b>に狙われる。全台一律より「出す台・回収する台」の作り分けが勝負。" +
    "同一機種を並べると<b>シマ効果</b>、週替わりの<b>ブーム</b>機種は集客1.4倍。";
  if (!state.machines.length) {
    wrap.innerHTML = `<div class="card"><div class="empty">${ic("slot")}台がありません!<br>「新台購入」から台を導入しよう。</div></div>`;

    const c = catalogOf(m), col = accOf(c.id);

    const bd = [
      isNew ? '<span class="bdg new">NEW</span>' : "",

    const segCls = m.setting <= 2 ? "lowset" : m.setting >= 5 ? "highset" : "";
    return `<article class="cab" style="--cc:${col}">
      <div class="cab-top">
        <div class="cab-face"><i></i><u></u><s></s></div>
        <div class="cab-id">
          <div class="cab-name">${esc(c.name)}</div>
          <div class="cab-spec">${esc(c.spec.label)}</div>
          <div class="cab-desc">${esc(c.desc)}</div>
          ${bd ? `<div class="badges">${bd}</div>` : ""}
          <div class="pop"><div class="meter thin"><i style="width:${Math.min(100, m.pop / 1.35)}%"></i></div></div>
        </div>
      </div>
      <div class="cab-metrics">
        <div><div class="k">前日収支</div><div class="v ${netCls}">${netTxt}</div></div>
        <div><div class="k">前日客数</div><div class="v">${m.lastCust === null ? "―" : m.lastCust + "人"}</div></div>
        <div><div class="k">売却額</div><div class="v">${yen(machineValue(m))}</div></div>
      </div>
      <div class="setrow">
        <span class="lb">設定</span>
        <div class="seg ${segCls}" role="group" aria-label="出玉設定">
          ${[1,2,3,4,5,6].map(v => `<button type="button" data-set="${idx}:${v}" aria-pressed="${m.setting === v}" ${dead ? "disabled" : ""}>${v}</button>`).join("")}
        </div>
      </div>
      <div class="cab-acts">
        <button class="btn sm ghost" data-trial="${idx}" style="flex:1">${ic("play")}試打</button>
        <button class="btn sm danger" data-sell="${idx}" ${dead ? "disabled" : ""}>${ic("tag")}売却</button>
      </div>
    </article>`;
  }).join("");
}

/* ---------- shop ---------- */
function renderShop() {
  $("shopSlots").textContent = `空き枠 ${Math.max(0, state.cap - state.machines.length)}`;
  $("shopNote").innerHTML =
    "新台は導入から5日間「新台効果」で人気1.4倍。同一機種を複数並べると<b>シマ効果</b>(+6%/台・最大+30%)。" +
    "売却額は購入価格の45%。導入直後は<b>新装開店フェア</b>(店長室)で告知すると効果大。";
  const dead = isDead();
  $("shopList").innerHTML = CATALOG.map(c => {
    const owned = state.machines.filter(m => m.cid === c.id).length;
    const full = state.machines.length >= state.cap, poor = state.money < c.price;
    const label = full ? "設置枠なし" : poor ? "資金不足" : "導入する";
    const boom = trendMult(c.id) > 1;
    const decay = c.decay <= 0.8 ? "遅い" : c.decay <= 1.4 ? "普通" : "速い";
    return `<article class="shop-card" style="--cc:${accOf(c.id)}">
      <div class="shop-hero">
        <div class="shop-art"><i></i><u></u><s></s></div>
        <div class="shop-meta">
          <div class="shop-name">${esc(c.name)}</div>
          <div class="cab-spec">${esc(c.spec.label)}</div>
          <div class="cab-desc">${esc(c.desc)}</div>
          <div class="shop-price num">${yen(c.price)}</div>
          <div class="kv"><span>集客力 <b>${c.pop}</b></span><span>人気低下 <b>${decay}</b></span>${owned ? `<span>設置中 <b>×${owned}</b></span>` : ""}</div>
          ${boom ? '<div class="badges"><span class="bdg boom">ブーム中</span></div>' : ""}

      </div>
      <div class="shop-acts">
        <button class="btn sm ghost" data-shoptrial="${c.id}" style="flex:1">${ic("play")}試打</button>
        <button class="btn sm gold" data-buy="${c.id}" style="flex:1.4" ${full || poor || dead ? "disabled" : ""}>${ic("plus")}${label}</button>
      </div>
    </article>`;
  }).join("");
}

/* ---------- ledger ---------- */
function renderLedger() {
  const h = state.history;
  if (!h.length) {
    $("ledgerBody").innerHTML = `<div class="card"><div class="empty">${ic("ledger")}まだ営業記録がありません<br>営業を始めると損益の推移がここに表示されます。</div></div>`;
    return;
  }
  const data = h.slice(0, 30).reverse();
  const W = 660, H = 190, mL = 54, mR = 10, mT = 12, mB = 24;
  const pw = W - mL - mR, ph = H - mT - mB;
  let mx = Math.max(0, ...data.map(d => d.net)), mn = Math.min(0, ...data.map(d => d.net));
  if (mx === mn) mx = 1;
  const y = v => mT + (mx - v) / (mx - mn) * ph;
  const bw = Math.max(3, pw / data.length - 2.5);
  const man = v => Math.abs(v) >= 1e6 ? Math.round(v / 1e4).toLocaleString("ja-JP") + "万" : (Math.round(v / 1e3) / 10) + "万";
  const bars = data.map((d, i) => {
    const X = mL + i * (pw / data.length) + 1, y0 = y(0), yv = y(d.net);
    return `<rect data-i="${i}" x="${X.toFixed(1)}" y="${Math.min(y0, yv).toFixed(1)}" width="${bw.toFixed(1)}"
      height="${Math.max(2, Math.abs(y0 - yv)).toFixed(1)}" rx="2" fill="${d.net >= 0 ? "var(--pos)" : "var(--neg)"}" opacity=".92"/>`;
  }).join("");
  const total = h.reduce((a, r) => a + r.net, 0);
  const best = h.reduce((a, r) => r.net > a.net ? r : a, h[0]);
  $("ledgerBody").innerHTML = `
    <div class="card">
      <div class="bd" style="margin-bottom:8px">
        <span class="k">累計純利益 (${h.length}営業日)</span><span class="v ${total >= 0 ? "pos" : "neg"}">${sign(total)}</span>
        <span class="k">最高の一日</span><span class="v pos">${sign(best.net)} <small style="color:var(--tx-3)">${best.day}日目</small></span>
      </div>
      <div class="chart-wrap" id="chartWrap">
        <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="直近${data.length}営業日の純利益の推移">
          <line x1="${mL}" y1="${y(0)}" x2="${W - mR}" y2="${y(0)}" stroke="var(--tx-3)" stroke-width="1.1"/>
          ${mx > 0 ? `<line x1="${mL}" y1="${y(mx)}" x2="${W - mR}" y2="${y(mx)}" stroke="var(--edge)" stroke-dasharray="3 4"/>
            <text x="${mL - 7}" y="${y(mx) + 4}" text-anchor="end" font-size="10" fill="var(--tx-3)">${man(mx)}</text>` : ""}
          ${mn < 0 ? `<line x1="${mL}" y1="${y(mn)}" x2="${W - mR}" y2="${y(mn)}" stroke="var(--edge)" stroke-dasharray="3 4"/>
            <text x="${mL - 7}" y="${y(mn) + 4}" text-anchor="end" font-size="10" fill="var(--tx-3)">${man(mn)}</text>` : ""}
          <text x="${mL - 7}" y="${y(0) + 4}" text-anchor="end" font-size="10" fill="var(--tx-3)">0</text>
          <text x="${mL}" y="${H - 7}" font-size="10" fill="var(--tx-3)">${data[0].day}日目</text>
          <text x="${W - mR}" y="${H - 7}" text-anchor="end" font-size="10" fill="var(--tx-3)">${data[data.length - 1].day}日目</text>
          ${bars}
        </svg>
        <div class="tip" id="chartTip"></div>
      </div>
      <div class="legend"><span><i style="background:var(--pos)"></i>基線より上 = 黒字</span><span><i style="background:var(--neg)"></i>基線より下 = 赤字</span></div>
    </div>
    <div class="card tight" style="padding:0">
      ${h.map(r => `<div class="led">
        <span class="d">${r.day}日目${r.note ? `<span class="flag ${r.note === "特日" ? "tokubi" : "week"}" style="color:${r.note === "特日" ? "var(--gold-2)" : "var(--blue)"}">${r.note}</span>` : ""}</span>
        <span></span>
        <span class="net ${r.net >= 0 ? "pos" : "neg"}"><small aria-hidden="true">${r.net >= 0 ? "▲" : "▼"}</small>${sign(r.net)}</span>
        <span class="meta">客${r.cust} (${r.cas ?? "-"}/${r.reg ?? "-"}/${r.pro ?? "-"}) · 売上${yen(r.sales)} · 払出${yen(r.payout)} · 経費${yen(r.exp)}</span>
      </div>`).join("")}
    </div>`;
  const wrap = $("chartWrap"), tip = $("chartTip"), svg = wrap.querySelector("svg");
  const show = (e, t) => {
    if (t.tagName !== "rect" || !t.dataset.i) { tip.style.display = "none"; return; }
    const d = data[+t.dataset.i], b = wrap.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    tip.textContent = `${d.day}日目 ${d.net >= 0 ? "▲" : "▼"} ${sign(d.net)}`;
    tip.style.left = (p.clientX - b.left) + "px"; tip.style.top = (p.clientY - b.top) + "px";
    tip.style.display = "block";
  };
  svg.addEventListener("mousemove", e => show(e, e.target));
  svg.addEventListener("touchstart", e => show(e, e.target), { passive: true });
  svg.addEventListener("mouseleave", () => tip.style.display = "none");
  svg.addEventListener("touchend", () => tip.style.display = "none");
}

/* ==========================================================================
   A-05  DAY START → RESULT  (開店の合図 → 当日結果)
   ========================================================================== */
function runDay() {
  if (isDead()) { openBankrupt(); return; }
  if (busy) return;                 // 連打・Enter連打で日が進むのを防ぐ
  if (sheetOpen()) return;          // 結果表示中の再実行を防ぐ
  if (!state.machines.length) { openNoMachine(); return; }
  busy = true;

  const finish = () => {
    let result = null;
    try { result = simulateDay(); } catch (e) { busy = false; throw e; }
    renderAll();
    openResult(result);
    busy = false;
  };

  if (reduced()) { setTimeout(finish, 120); return; }

  const cur = $("curtain");
  cur.querySelector(".t").textContent = isTokubi(state.day) ? "特日 開店" : "開店";
  cur.classList.add("on");
  void cur.offsetWidth;
  cur.classList.add("run");
  let done = false;
  const end = () => {
    if (done) return; done = true;
    cur.classList.remove("run", "on");
    finish();
  };
  setTimeout(end, 760);             // 開店演出 760ms → 結果提示(600〜1200ms の範囲内)
}

function openResult(result) {
  const { rec, notes } = result;
  const hasGlyph = n => /^[\p{Extended_Pictographic}]/u.test(n);
  const evs = notes.map(n => `<div class="ev">${hasGlyph(n) ? "" : `<span class="ic">${ic("bolt")}</span>`}<span>${esc(n)}</span></div>`).join("");
  const perM = state.machines.slice().sort((a, b) => (b.lastNet ?? 0) - (a.lastNet ?? 0)).map(m => {
    const v = m.lastNet ?? 0;
    return `<div><span class="m">${esc(catalogOf(m).name)} [設定${m.setting}]</span>
      <span class="n ${v >= 0 ? "pos" : "neg"}">${sign(v)}</span></div>`;
  }).join("");

  const wk = weeklyData(rec);
  const weekHtml = wk ? `<div class="week">
    <h4>週次レポート (${rec.day - 6}〜${rec.day}日目)</h4>
    <div class="bd">
      <span class="k">週間純利益</span><span class="v ${wk.total >= 0 ? "pos" : "neg"}">${sign(wk.total)}</span>

    ${wk.advice.map(a => `<p class="adv">${ic("info")}<span>${esc(a)}</span></p>`).join("")}

  const dead = state.money < 0;

  let banner = "";
  if (dead) {
    banner = `<div class="banner dead">
      <div style="font-family:var(--disp);font-size:20px;font-weight:800;color:var(--red);letter-spacing:.2em">倒産</div>
      <p class="note" style="margin:8px 0 0">資金が尽き、融資枠も限界。${rec.day}日間の経営、お疲れさまでした。</p>
      <button class="btn danger wide" style="margin-top:10px" data-act="reset-now">${ic("refresh")}最初からやり直す</button></div>`;
  } else if (cleared) {
    banner = `<div class="banner clear">
      <div style="font-size:10px;letter-spacing:.28em;color:var(--gold-2)">CLEAR RANK</div>
      <div class="rank">${clearRank(rec.day)}</div>
      <div style="font-family:var(--disp);font-size:14px;color:var(--gold-1);letter-spacing:.08em">祝・純資産1億円達成!!</div>
      <p class="note" style="margin:8px 0 0">${rec.day}日目にしてあなたの店は地域No.1ホールとなった!<br>
      S:65日以内 / A:85日 / B:120日 ・ このまま帝国を広げ続けてもOK!</p></div>`;
  }

  openSheet(`
    <div class="res-hero">
      <div class="day">DAY ${rec.day}${rec.note ? " 〈" + esc(rec.note) + "〉" : ""}</div>
      <div class="lbl">本日の純利益</div>
      <div class="amt ${rec.net >= 0 ? "pos" : "neg"}" id="resAmt">${sign(rec.net)}</div>
    </div>
    <div class="sheet-b">
      ${evs}
      <div class="bd" style="margin-top:8px">
        <span class="k">来店客数</span><span class="v">${rec.cust}人</span>
        <span class="k sub">一般 / 常連 / プロ</span><span class="v sub">${rec.cas} / ${rec.reg} / ${rec.pro}人</span>
        <span class="div"></span>
        <span class="k">総売上(打ち込み)</span><span class="v">${yen(rec.sales)}</span>
        <span class="k">出玉払出</span><span class="v neg">−${yen(rec.payout)}</span>
        <span class="k">経費${rec.interest ? " (利息 " + yen(rec.interest) + " 含む)" : ""}</span><span class="v neg">−${yen(rec.exp)}</span>

      <div class="mach-res">${perM}</div>

    </div>`, { locked: dead });

  const amt = $("resAmt");
