      <p class="note" style="margin-top:10px">試打なので<b>営業収支には影響しません</b>。メダルが尽きたら無料で補充できます。</p>
      <div class="btn-grid" style="margin-top:10px">
        <button class="btn" id="trRefill">${ic("plus")}メダル補充 +500</button>
        <button class="btn danger" data-sheet-close>${ic("x")}試打を終える</button>
      </div>
    </div>`);

  const lamp = $("trLamp"), banner = $("trBanner");
  const reels = [$("reel0"), $("reel1"), $("reel2")];
  const stops = [$("stop0"), $("stop1"), $("stop2")];

  function updateStats() {
    $("tCredits").textContent = t.credits;
    $("tGames").textContent = t.games;
    $("tBB").textContent = t.bb;
    $("tRB").textContent = t.rb;
    $("tDiff").textContent = (t.diff >= 0 ? "+" : "") + t.diff;
  }

  /* --- 抽選(保護ロジック: 数式・確率は不変) --- */
  function rollFlag() {
    const st = t.setting;
    const pBig = 1 / slotDenom(c.spec.big1, c.spec.big6, st);
    const pReg = 1 / slotDenom(c.spec.reg1, c.spec.reg6, st);
    const r = Math.random();
    if (r < pBig) return "big";
    if (r < pBig + pReg) return "reg";
    if (r < pBig + pReg + 1 / 6.5) return "grape";
    if (r < pBig + pReg + 1 / 6.5 + 1 / 33) return "cherry";
    if (r < pBig + pReg + 1 / 6.5 + 1 / 33 + 1 / 7.3) return "replay";
    return "none";
  }
  function finalSymbols(flag) {
    switch (flag) {
      case "big":    return ["7️⃣","7️⃣","7️⃣"];
      case "reg":    return ["🅱️","🅱️","🅱️"];
      case "grape":  return ["🍇","🍇","🍇"];
      case "cherry": return ["🍒","🔔","🃏"];
      case "replay": return ["🃏","🃏","🃏"];
      default: {
        const a = SLOT_SYMBOLS[Math.floor(rand(1, 6))];
        let b = SLOT_SYMBOLS[Math.floor(rand(0, 6))];
        let d = SLOT_SYMBOLS[Math.floor(rand(0, 6))];
        if (a === b && b === d) d = SLOT_SYMBOLS[(SLOT_SYMBOLS.indexOf(d) + 1) % 6];
        return [a, b, d];
      }
    }
  }

  function lever() {
    if (t.spinning || t.credits < 3) {
      if (t.credits < 3) banner.textContent = "メダル切れ — 補充してください";
      return;
    }
    t.credits -= 3; t.diff -= 3; t.games++;
    t.flag = rollFlag();
    t.final = finalSymbols(t.flag);
    t.spinning = true; t.stopped = [false, false, false];
    lamp.classList.remove("on");
    banner.textContent = ""; banner.classList.remove("win");
    reels.forEach((r, i) => {
      r.classList.remove("stopped");
      r.classList.add("spin");
      t.timers[i] = setInterval(() => {
        r.innerHTML = symHTML(SLOT_SYMBOLS[Math.floor(Math.random() * 6)]);
      }, 70);
      stops[i].disabled = false;
    });
    $("trLever").disabled = true;
    updateStats();
  }
  function stopReel(i) {
    if (t.stopped[i]) return;
    t.stopped[i] = true;
    clearInterval(t.timers[i]);
    reels[i].classList.remove("spin");
    reels[i].classList.add("stopped");
    reels[i].innerHTML = symHTML(t.final[i]);
    stops[i].disabled = true;
    if (t.stopped.every(Boolean)) resolve();
  }
  function resolve() {
    t.spinning = false;
    $("trLever").disabled = false;
    let pay = 0, msg = "";
    switch (t.flag) {
      case "big":    pay = c.spec.bigPay; t.bb++; msg = `BIG BONUS! +${pay}枚`; break;
      case "reg":    pay = c.spec.regPay; t.rb++; msg = `REG BONUS +${pay}枚`; break;
      case "grape":  pay = 8;  msg = "ぶどう +8枚"; break;
      case "cherry": pay = 2;  msg = "チェリー +2枚"; break;
      case "replay": pay = 3;  msg = "リプレイ"; break;
    }
    if (t.flag === "big" || t.flag === "reg") {
      lamp.classList.add("on");
      banner.classList.add("win");
      grantAch("trial-hit");
      if (t.bb >= 10) grantAch("trial-10");
    }
    t.credits += pay; t.diff += pay;
    if (t.diff >= 2000) grantAch("trial-5k");
    banner.textContent = msg;
    updateStats();
  }

  $("trLever").addEventListener("click", lever);
  stops.forEach((b, i) => b.addEventListener("click", () => stopReel(i)));
  $("trSet").addEventListener("change", e => { t.setting = Number(e.target.value); });
  $("trRefill").addEventListener("click", () => { t.credits += 500; updateStats(); });
  sheetCleanup = () => { t.timers.forEach(x => clearInterval(x)); };
}

/* ---- パチンコ試打 ---- */
function openPachiTrial(c, initSetting) {
  const t = {
    setting: initSetting,
    balls: 1000, startBalls: 1000, spins: 0, hits: 0, maxRen: 0,
    busy: false, auto: false, autoTimer: null, timers: [],
  };
  openSheet(`
    <div class="sheet-h"><span style="color:var(--gold-2)">${ic("target")}</span><span class="t">試打</span>
      <button class="x" data-close aria-label="試打を終える">${ic("x")}</button></div>
    <div class="sheet-b">
      <div class="mach">
        <div class="mach-h">
          <span style="min-width:0"><span class="nm">${esc(c.name)}</span><span class="sp">${esc(c.spec.label)}</span></span>
          <label class="trial-sel" style="margin-left:auto">釘
            <select id="trSet" aria-label="釘(設定)">${[1,2,3,4,5,6].map(v => `<option value="${v}" ${v === initSetting ? "selected" : ""}>${v}</option>`).join("")}</select>
          </label>
        </div>
        <div class="mach-stage">
          <div class="reach" id="pReach" aria-live="polite"></div>
          <div class="digits">
            <div class="digit" id="dg0">7</div>
            <div class="digit" id="dg1">7</div>
            <div class="digit" id="dg2">7</div>
          </div>
          <div class="mach-banner" id="pBanner" aria-live="polite"></div>
        </div>
        <div class="mach-ctl">
          <button class="lever" id="pSpin">回す</button>
          <label class="switch"><input type="checkbox" id="pAuto"> オート</label>
        </div>
        <div class="mach-stats">
          <div><div class="k">持ち玉</div><div class="v" id="pBalls">1000</div></div>
          <div><div class="k">回転数</div><div class="v" id="pSpins">0</div></div>
          <div><div class="k">当り</div><div class="v" style="color:var(--gold-1)" id="pHits">0</div></div>
          <div><div class="k">最高連</div><div class="v" id="pMaxRen">0</div></div>
          <div><div class="k">差玉</div><div class="v" id="pDiff">0</div></div>
        </div>
      </div>
      <p class="note" style="margin-top:10px">試打なので<b>営業収支には影響しません</b>。玉が尽きたら無料で補充できます。設定(釘)が良いほど玉持ちが良くなります。</p>
      <div class="btn-grid" style="margin-top:10px">
        <button class="btn" id="pRefill">${ic("plus")}玉補充 +1000</button>
        <button class="btn danger" data-sheet-close>${ic("x")}試打を終える</button>
      </div>
    </div>`);

  const digits = [$("dg0"), $("dg1"), $("dg2")];
  const banner = $("pBanner"), reach = $("pReach");

  function updateStats() {
    $("pBalls").textContent = t.balls;
    $("pSpins").textContent = t.spins;
    $("pHits").textContent = t.hits;
    $("pMaxRen").textContent = t.maxRen;
    const diff = t.balls - t.startBalls;
    $("pDiff").textContent = (diff >= 0 ? "+" : "") + diff;
    if (diff >= 5000) grantAch("trial-5k");
  }
  function later(fn, ms) { const id = setTimeout(fn, ms); t.timers.push(id); return id; }
  /* --- 保護ロジック: 玉持ち(1回転あたりの消費) --- */
  function spinCost() { return Math.max(2, Math.round(5.5 - t.setting * 0.5)); }

  function setDigit(el, v, cls) {
    el.textContent = v;
    el.classList.remove("spin");
    if (cls) el.classList.add(cls);
  }
  function spin() {
    if (t.busy) return;
    const cost = spinCost();
    if (t.balls < cost) { banner.textContent = "玉切れ — 補充してください"; t.busy = false; return; }
    t.busy = true;
    t.balls -= cost; t.spins++;
    banner.textContent = ""; banner.classList.remove("win");
    reach.textContent = ""; reach.classList.remove("on");
    digits.forEach(d => { d.classList.remove("hit"); d.classList.add("spin"); });
    const spinAnim = setInterval(() => {
      digits.forEach(d => { if (d.classList.contains("spin")) d.textContent = Math.floor(Math.random() * 10); });
    }, 80);
    t.timers.push(spinAnim);

    const win = Math.random() < 1 / c.spec.denom;
    const isReach = win || Math.random() < 1 / 12;
    const n = Math.floor(Math.random() * 10);
    let mid;
    if (win) mid = n;
    else { mid = (n + 1 + Math.floor(Math.random() * 8)) % 10; }
    const L = n, R = isReach ? n : (n + 1 + Math.floor(Math.random() * 8)) % 10;

    later(() => setDigit(digits[0], L), 400);
    later(() => {
      setDigit(digits[2], R);
      if (isReach) { reach.textContent = "リーチ!!"; reach.classList.add("on"); }
    }, 800);
    later(() => {
      clearInterval(spinAnim);
      setDigit(digits[1], win ? mid : (isReach ? mid : Math.floor(Math.random() * 10)));
      if (!win && !isReach && digits[0].textContent === digits[1].textContent && digits[1].textContent === digits[2].textContent) {
        digits[1].textContent = (Number(digits[1].textContent) + 1) % 10;
      }
      reach.classList.remove("on");
      if (win) hitSequence();
      else { reach.textContent = ""; t.busy = false; updateStats(); }
    }, isReach ? 2000 : 1200);
    updateStats();
  }
  function hitSequence() {
    t.hits++;
    let ren = 1;
    digits.forEach(d => d.classList.add("hit"));
    grantAch("trial-hit");
    t.balls += c.spec.firstBalls;
    banner.textContent = `大当り!! +${c.spec.firstBalls}玉`;
    banner.classList.add("win");
    reach.textContent = "RUSH突入!?";
    reach.classList.add("on");
    updateStats();
    function rushStep() {
      later(() => {
        if (Math.random() < c.spec.rushPct) {
          ren++;
          t.balls += c.spec.rushBalls;
          banner.textContent = `RUSH ${ren}連!! +${c.spec.rushBalls}玉`;
          reach.textContent = "継続!";
          if (ren >= 10) grantAch("trial-10");
          updateStats();
          rushStep();
        } else {
          banner.textContent = `RUSH終了 (${ren}連 / +${(c.spec.firstBalls + (ren - 1) * c.spec.rushBalls).toLocaleString()}玉)`;
          banner.classList.remove("win");
          reach.textContent = ""; reach.classList.remove("on");
          t.maxRen = Math.max(t.maxRen, ren);
          digits.forEach(d => d.classList.remove("hit"));
          t.busy = false;
          updateStats();
        }
      }, 850);
    }
    rushStep();
  }

  $("pSpin").addEventListener("click", spin);
  $("pAuto").addEventListener("change", e => {
    t.auto = e.target.checked;
    if (t.auto) t.autoTimer = setInterval(() => { if (!t.busy) spin(); }, 500);
    else { clearInterval(t.autoTimer); t.autoTimer = null; }
  });
  $("trSet").addEventListener("change", e => { t.setting = Number(e.target.value); });
  $("pRefill").addEventListener("click", () => { t.balls += 1000; t.startBalls += 1000; updateStats(); });
  sheetCleanup = () => {
    t.timers.forEach(x => { clearTimeout(x); clearInterval(x); });
    if (t.autoTimer) clearInterval(t.autoTimer);
  };
}

/* ==========================================================================
   オンボーディング / リセット
   ========================================================================== */
function openOnboarding() {
  const item = (icon, title, body) => `<div class="ob-item"><span class="ic">${ic(icon)}</span>
    <span><span class="tt">${title}</span>${body}</span></div>`;
  openSheet(`
    <div class="ob-hero">
      <div class="logo">パチスロ帝国</div>
      <div class="sub">PACHISLOT EMPIRE</div>
    </div>
    <div class="sheet-b">
      <p class="note">あなたは小さなパチンコホールの新米オーナー。<b>純資産1億円</b>の地域No.1ホールを目指そう!</p>
      <div style="margin-top:10px">
        ${item("target", "設定のメリハリがすべて", "渋れば儲かるが評判が下がり<b>行政指導</b>のリスク。出せば<b>常連</b>が育つが<b>プロ</b>に狙われる。「出す台」と「回収する台」を作り分けろ!")}
        ${item("fire", "7のつく日は特日 / 週替わりブーム / シマ効果", "特日は高設定で評判爆上げ。ブーム機種は集客1.4倍。同一機種を並べればシマ効果。")}
        ${item("bank", "銀行融資で攻めるか、堅実に行くか", "借金で一気に拡大もできるが利息は毎日重くのしかかる。クリア条件は「純資産」(借金は差し引き)。")}
        ${item("play", "実機を試打できる!", "どの台も「試打」で実際に打てる。設定ごとの出方を体感して経営に活かそう。")}
      </div>
      <p class="note" style="margin-top:12px"><b>難易度を選んで開店:</b></p>
      <div class="diff-grid">
        ${["easy","normal","hard"].map(k => {
          const d = DIFFS[k];
          const ds = k === "easy" ? "余裕のある滑り出し" : k === "normal" ? "推奨バランス" : "家賃増・プロ多・警戒厳しめ";
          return `<button class="diff ${k}" data-diff="${k}"><span><span class="nm">${esc(d.label)}</span>
            <span class="ds">${ds}</span></span><span class="mn">${yen(d.money)}</span></button>`;
        }).join("")}
      </div>
    </div>`, { locked: true });
}
function startGame(diff) {
  state = newGame(diff);
  save(true);
  closeSheet(true);
  renderAll();
  toastMsg(`難易度「${DIFFS[diff].label}」で開店!`);
}
function doReset() {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  state = newGame("normal");
  closeSheet(true);
  renderAll();
  openOnboarding();
}

/* ==========================================================================
   操作(イベント委譲)
   ========================================================================== */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-set],[data-trial],[data-sell],[data-buy],[data-shoptrial],[data-act],[data-ad],[data-rate],[data-area],[data-diff],[data-sheet-close]");
  if (!el) return;
  const d = el.dataset;

  if ("sheetClose" in d) { closeSheet(); return; }
  if (d.diff) { startGame(DIFFS[d.diff] ? d.diff : "normal"); return; }
  if (d.area) { setArea(d.area); return; }

  /* --- 台の設定 --- */
  if (d.set) {
    if (isDead()) return;
    const [i, v] = d.set.split(":").map(Number);
    const m = state.machines[i];
    if (!m || !(v >= 1 && v <= 6)) return;
    m.setting = v;
    save(true); renderHall(); renderStage(); renderSide();
    return;
  }
  if (d.trial) {
    const m = state.machines[Number(d.trial)];
    if (m) openTrial(catalogOf(m), m.setting);
    return;
  }
  if (d.sell) {
    if (isDead()) return;
    const i = Number(d.sell), m = state.machines[i];
    if (!m) return;
    const c = catalogOf(m), val = machineValue(m);
    confirmSheet({
      title: "台を売却しますか?",
      body: `<b>${esc(c.name)}</b> を <b>${yen(val)}</b> で売却します。売却した台は戻せません。`,
      yes: "売却する",
      onYes: () => {
        if (isDead()) return;
        const idx = state.machines.indexOf(m);
        if (idx < 0) return;
        state.money += machineValue(m);
        state.machines.splice(idx, 1);
        save(); renderAll();
        toastMsg(`${c.name} を売却しました`);
      },
    });
    return;
  }
  if (d.shoptrial) {
    const c = CATALOG.find(x => x.id === d.shoptrial);
    if (c) openTrial(c, 3);
    return;
  }
  if (d.buy) {
    if (isDead()) return;
    const c = CATALOG.find(x => x.id === d.buy);
    if (!c) return;
    if (state.money < c.price || state.machines.length >= state.cap) return;
    state.money -= c.price;
    const m = makeMachine(c.id);
    m.uid = ++state.uid;
    m.boughtDay = state.day;
    state.machines.push(m);
    save(); renderAll();
    toastMsg(`${c.name} を導入しました`);
    return;
  }
  if (d.ad) {
    if (isDead()) return;
    if (!ADS.some(a => a.id === d.ad)) return;
    state.ad = d.ad;
    save(); renderMgmt();
    return;
  }
  if (d.rate) {
    if (isDead()) return;
    state.rate = d.rate === "low" ? "low" : "normal";
    save(); renderMgmt();
    return;
  }

  /* --- 店長室のアクション --- */
  switch (d.act) {
    case "hire":
      if (isDead()) return;
      state.staff++; save(); renderMgmt(); renderNav(); renderSide(); break;
    case "fire":
      if (isDead()) return;
      if (state.staff > 1) { state.staff--; save(); renderMgmt(); renderNav(); renderSide(); } break;
    case "expand": {
      if (isDead()) return;
      const cost = expandCost();
      if (state.money < cost || state.cap >= MAX_CAP) return;
      state.money -= cost; state.cap += 5;
      save(); renderAll(); toastMsg(`店舗を拡張(最大${state.cap}台)`); break;
    }
    case "grand": {
      if (isDead()) return;
      const recentBuy = state.machines.some(m => m.boughtDay !== null && state.day - m.boughtDay <= 1);
      if (state.grandOpen || !recentBuy || state.day - state.lastGrand < 7 || state.money < 300000) return;
      state.money -= 300000; state.grandOpen = true; state.lastGrand = state.day;
      save(); renderAll(); toastMsg("新装開店フェアを予約!次の営業日に開催"); break;
    }
    case "borrow":
      if (isDead()) return;
      if (state.debt + 1000000 > creditLimit()) return;
      state.debt += 1000000;
      state.maxDebt = Math.max(state.maxDebt, state.debt);
      state.money += 1000000;
      save(); renderAll(); break;
    case "repay": {
      if (isDead()) return;
      const amount = Math.min(1000000, state.debt, state.money);
      if (amount <= 0) return;
      state.debt -= amount; state.money -= amount;
      if (state.debt === 0 && state.maxDebt >= 10000000) grantAch("loan-clear");
      save(); renderAll(); break;
    }
    case "save": save(); toastMsg("セーブしました"); break;
    case "reset":
      confirmSheet({
        title: "最初からやり直しますか?",
        body: "現在のセーブデータは消えます。この操作は取り消せません。",
        yes: "やり直す",
        onYes: doReset,
      });
      break;
    case "reset-now": doReset(); break;
    case "go-shop": closeSheet(true); setArea("shop"); break;
  }
});
$("btnOpen").addEventListener("click", runDay);

/* ==========================================================================
   起動
   ========================================================================== */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("./sw.js").catch(() => {});
}
$("stageFallback").innerHTML = buildStageArt();

const loaded = load();
if (loaded && Array.isArray(loaded.machines)) {
  state = loaded;
  renderAll();
  if (isDead()) openBankrupt();
} else {
  state = newGame("normal");
  renderAll();
  openOnboarding();
}
</script>
