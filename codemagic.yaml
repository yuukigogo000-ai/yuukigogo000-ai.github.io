# Manual runs only. Do not enable billing or purchase credits.
# This workflow compiles the current Pachislot launch candidate on a cloud Mac
# The simulator workflow is unsigned; the signed candidate workflow never uploads.
workflows:
  pachislot-ios-simulator:
    name: Pachislot Empire iOS simulator compile
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: 24
      xcode: "26.4.1"
    scripts:
      - name: Install, sync and verify source
        script: |
          set -euo pipefail
          cd pachinko/mobile
          npm ci --ignore-scripts --no-fund --no-audit
          npm run ios:sync
          npm test
          python3 scripts/verify-ios.py --synced --report .evidence/ios-preflight.json
      - name: Compile simulator app and verify packaged runtime
        script: |
          set -euo pipefail
          cd pachinko/mobile
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios-simulator CODE_SIGNING_ALLOWED=NO build
          python3 scripts/verify-ios.py --app build/ios-simulator/Build/Products/Debug-iphonesimulator/App.app --report .evidence/ios-simulator-bundle.json
          ditto -c -k --sequesterRsrc --keepParent build/ios-simulator/Build/Products/Debug-iphonesimulator/App.app build/PachislotEmpire-simulator.zip
    artifacts:
      - pachinko/mobile/build/PachislotEmpire-simulator.zip
      - pachinko/mobile/.evidence/ios-*.json

  pachinko-ios-signed-candidate:
    name: Pachinko iOS signed internal TestFlight candidate
    instance_type: mac_mini_m2
    max_build_duration: 20
    integrations:
      app_store_connect: BANDHUB
    environment:
      node: 24
      xcode: "26.4.1"
      ios_signing:
        provisioning_profiles:
          - pachinko_appstore_20261002
        certificates:
          - bandhub_app_store_20260926
    scripts:
      - name: Install, test and sync
        script: |
          set -euo pipefail
          cd pachinko/mobile
          npm ci --ignore-scripts --no-fund --no-audit
          npm test
          npm run ios:sync
          python3 scripts/verify-ios.py --synced --report .evidence/ios-preflight.json
      - name: Archive signed candidate without uploading
        script: |
          set -euo pipefail
          cd pachinko/mobile
          xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly":true}'
          xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
          python3 scripts/verify-signed-ipa.py build/ios/ipa/*.ipa
    artifacts:
      - pachinko/mobile/build/ios/ipa/*.ipa
      - pachinko/mobile/.evidence/ios-*.json
