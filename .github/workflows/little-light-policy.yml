name: Little Light policy
on:
  push:
    paths: ['little-light/privacy/**', 'scripts/check-little-light-policy.py', 'sitemap.xml', '.github/workflows/little-light-policy.yml']
  pull_request:
    paths: ['little-light/privacy/**', 'scripts/check-little-light-policy.py', 'sitemap.xml', '.github/workflows/little-light-policy.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m py_compile scripts/check-little-light-policy.py
      - run: python3 scripts/check-little-light-policy.py --self-test
