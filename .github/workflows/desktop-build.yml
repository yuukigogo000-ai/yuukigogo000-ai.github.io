name: Desktop Build

# 手動実行(workflow_dispatch)か、desktop-v* タグのプッシュで
# Windows / macOS / Linux のインストーラをビルドする。
# タグ起動のときは GitHub Release に成果物を添付する。

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build installers
        run: npm run dist

      - name: List artifacts
        shell: bash
        run: ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: setlism-${{ matrix.os }}
          if-no-files-found: error
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: files

      - uses: softprops/action-gh-release@v2
        with:
          name: セトリズム デスクトップ版 ${{ github.ref_name }}
          files: files/*
          body: |
            バンドのためのセトリ設計スタジオ「セトリズム」デスクトップ版です。

            - **Windows**: `SETLISM-*-win-x64.exe`(インストーラ)/ `portable` 版はインストール不要
            - **macOS**: `SETLISM-*-mac-*.dmg`(Apple Silicon = arm64 / Intel = x64)
              ※署名なしのため初回は「右クリック → 開く」で起動してください
            - **Linux**: `SETLISM-*-linux-x86_64.AppImage`(実行権限を付けてそのまま起動)

            Web版はこちら: https://yuukigogo000-ai.github.io/band/
