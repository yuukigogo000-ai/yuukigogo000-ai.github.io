name: BANDHUB share security
on:
  push:
    paths: ['band/**', 'tests/share-security.mjs', '.github/workflows/band-share-security.yml']
  pull_request:
    paths: ['band/**', 'tests/share-security.mjs', '.github/workflows/band-share-security.yml']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/share-security.mjs
      - run: node --check band/app.js && node --check band/share.js && node --check band/sw.js
