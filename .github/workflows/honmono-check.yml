name: HONMONO checks

on:
  push:
    branches: [main]
    paths: ['honmono/**', '.github/workflows/honmono-check.yml']
  pull_request:
    paths: ['honmono/**', '.github/workflows/honmono-check.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated browser test dependency
        run: |
          npm install --no-save --ignore-scripts --prefix "$env:RUNNER_TEMP/honmono-test" playwright-core@1.62.1
          if ($LASTEXITCODE -ne 0) { throw 'Test dependency installation failed' }
          $testModules = Join-Path $env:RUNNER_TEMP 'honmono-test/node_modules'
          "NODE_PATH=$testModules" >> $env:GITHUB_ENV
          node "$testModules/playwright-core/cli.js" install webkit
          if ($LASTEXITCODE -ne 0) { throw 'WebKit installation failed' }
          if (!(Test-Path 'C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe')) { throw 'Edge is required by the browser tests' }
      - name: JavaScript syntax
        run: |
          node --check honmono/checker/reaction.js
          if ($LASTEXITCODE -ne 0) { throw 'Reaction script syntax failed' }
          node --check honmono/tests/test_reaction_map.js
      - name: Static site verification
        run: python -X utf8 honmono/tests/verify_site.py
      - name: Static verifier mutations
        run: python -X utf8 honmono/tests/verify_site.py --selftest
      - name: All page browser smoke tests
        run: node honmono/tests/test_pages_smoke.js
      - name: Browser smoke mutations
        run: node honmono/tests/test_pages_smoke.js --mutate
      - name: Score explanation and result visibility
        run: node honmono/tests/test_result_explanation.js
      - name: Measured reaction behavior and served source freshness
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/honmono-reaction
        run: node honmono/tests/test_reaction_map.js
      - name: Tests leave source unchanged
        run: git diff --exit-code
