<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>カラダ日報</title>
<style>
/* ===========================================================
   カラダ日報 — トークン
   出所: Google Stitch デザインシステム "Zenith Health Ledger"
        (シード色 1C3160 / M3) + @material/material-color-utilities
   生値はこの :root だけに置く(UI_PLAYBOOK §5 METRIC)
   =========================================================== */
:root {
  color-scheme: light;
  /* 面 */
  --page:    #f4f3f1;
  --card:    #ffffff;
  --sunken:  #e9e8e6;
  --track:   #dedcd8;
  --accent:  #1c3160;
  --on-accent: #ffffff;
  --accent-soft: #dae2ff;
  /* 文字・線 */
  --ink:     #1b1b1f;
  --muted:   #44464f;
  --line:    #d7d6d3;
  /* 状態 */
  --good:    #0f6b3f;
  --warn:    #8a5000;
  --bad:     #ba1a1a;
  /* グラフ */
  --c-weight: #1c3160;
  --c-sys:    #ba1a1a;
  --c-dia:    #00696e;
  --grid:     #e0dfdd;
  /* 余白 */
  --sp1: 4px; --sp2: 8px; --sp3: 12px; --sp4: 16px; --sp5: 24px; --sp6: 32px;
  /* 文字階層(5) */
  --fs-hero:  2rem;      /* 32 */
  --fs-title: 1.25rem;   /* 20 */
  --fs-body:  1rem;      /* 16 */
  --fs-label: 0.875rem;  /* 14 */
  --fs-cap:   0.75rem;   /* 12 */
  /* 角丸(3) */
  --r1: 2px; --r2: 4px; --r3: 999px;
  --tap: 48px;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page:    #131316;
    --card:    #1b1b1f;
    --sunken:  #26262b;
    --track:   #3a3a40;
    --accent:  #b1c5ff;
    --on-accent: #002c71;
    --accent-soft: #1c438f;
    --ink:     #e4e2e6;
    --muted:   #c5c6d0;
    --line:    #3a3a40;
    --good:    #7ad39a;
    --warn:    #ffb95c;
    --bad:     #ffb4ab;
    --c-weight: #b1c5ff;
    --c-sys:    #ff8a80;
    --c-dia:    #4fd8de;
    --grid:     #33333a;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--page);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
  font-size: var(--fs-body);
  line-height: 1.55;
  -webkit-text-size-adjust: 100%;
}
.wrap {
  max-width: 480px;
  margin: 0 auto;
  padding: 0 var(--sp4) calc(88px + env(safe-area-inset-bottom));
}

/* ---------- 外殻: トップバー ---------- */
.appbar {
  position: sticky; top: 0; z-index: 20;
  background: var(--card);
  border-bottom: 1px solid var(--line);
  padding-top: env(safe-area-inset-top);
}
.appbar-inner {
  max-width: 480px; margin: 0 auto;
  display: grid; grid-template-columns: var(--tap) 1fr var(--tap);
  align-items: center; height: 56px; padding: 0 var(--sp2);
}
.iconbtn {
  width: var(--tap); height: var(--tap);
  display: grid; place-items: center;
  background: transparent; border: 0; border-radius: var(--r3);
  color: var(--ink); cursor: pointer; padding: 0; position: relative;
}
.iconbtn .dot {
  position: absolute; top: 10px; right: 10px;
  width: 8px; height: 8px; border-radius: var(--r3); background: var(--bad);
}
.appbar h1 { margin: 0; font-size: var(--fs-title); text-align: center; letter-spacing: .02em; }

/* ---------- 見出し・あいさつ ---------- */
.greet { padding: var(--sp5) 0 var(--sp3); }
.greet .date { font-size: var(--fs-label); color: var(--muted); }
.greet .hello { font-size: var(--fs-title); font-weight: 700; margin: var(--sp1) 0 0; }
.greet .coach { font-size: var(--fs-label); color: var(--muted); margin: var(--sp2) 0 0; }

section { scroll-margin-top: 64px; }
h2.sec {
  font-size: var(--fs-title); font-weight: 700;
  margin: var(--sp5) 0 var(--sp3);
  display: flex; align-items: center; gap: var(--sp2);
}
h2.sec svg { color: var(--accent); }

/* ---------- 曜日ストリップ ---------- */
.strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: var(--sp1); }
.strip div {
  text-align: center; padding: var(--sp2) 0 var(--sp1);
  border-radius: var(--r2); font-size: var(--fs-cap); color: var(--muted);
}
.strip div .d { font-size: var(--fs-label); color: var(--ink); display: block; }
.strip div.today { background: var(--accent); }
.strip div.today, .strip div.today .d { color: var(--on-accent); }
.strip .mark { display: block; height: 6px; line-height: 6px; font-size: var(--fs-cap); }

/* ---------- カード ---------- */
.card {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--r2); padding: var(--sp4);
}
.cards { display: grid; gap: var(--sp3); }
.card .lbl {
  display: flex; align-items: center; gap: var(--sp2);
  font-size: var(--fs-label); color: var(--muted);
}
.card .val { font-size: var(--fs-hero); font-weight: 700; line-height: 1.15; margin-top: var(--sp1); }
.card .val .u { font-size: var(--fs-label); font-weight: 400; color: var(--muted); margin-left: var(--sp1); }
.card .sub { font-size: var(--fs-label); color: var(--muted); }
.card .why { font-size: var(--fs-cap); color: var(--muted); margin-top: var(--sp1); }

/* ---------- 帯マーカー(判定の位置) ---------- */
.band { margin-top: var(--sp3); }
.band-track {
  position: relative; height: 8px; background: var(--track); border-radius: var(--r1);
}
.band-tick { position: absolute; top: -3px; width: 1px; height: 14px; background: var(--muted); }
.band-mark {
  position: absolute; top: -3px; width: 4px; height: 14px; border-radius: var(--r1);
  transform: translateX(-2px);
}
.band-mark.ok   { background: var(--good); }
.band-mark.warn { background: var(--warn); }
.band-mark.bad  { background: var(--bad); }
.band-mark.flat { background: var(--accent); }
.band-ends {
  display: flex; justify-content: space-between;
  font-size: var(--fs-cap); color: var(--muted); margin-top: var(--sp1);
}

/* ---------- 判定ピル(枠線・面を増やさない) ---------- */
.pill {
  display: inline-block; border: 1px solid currentColor; border-radius: var(--r3);
  padding: 0 var(--sp2); font-size: var(--fs-cap); line-height: 20px;
}
.pill.ok   { color: var(--good); }
.pill.warn { color: var(--warn); }
.pill.bad  { color: var(--bad); }
.pill.flat { color: var(--accent); }

/* ---------- メーター(週の純アルコール) ---------- */
.meter { position: relative; height: 8px; background: var(--track); border-radius: var(--r1); margin-top: var(--sp3); }
.meter i { display: block; height: 100%; border-radius: var(--r1); background: var(--accent); }
.meter i.over { background: var(--warn); }
.meter i.way  { background: var(--bad); }
.meter .limit { position: absolute; top: -3px; width: 1px; height: 14px; background: var(--muted); }

/* ---------- 継続カード ---------- */
.streak {
  background: var(--accent); color: var(--on-accent);
  border: 1px solid var(--accent); border-radius: var(--r2);
  padding: var(--sp4); display: flex; align-items: center; gap: var(--sp3);
}
.streak .n { font-size: var(--fs-hero); font-weight: 700; line-height: 1.1; }
.streak .n span { font-size: var(--fs-label); font-weight: 400; margin-left: var(--sp1); }
.streak .t { font-size: var(--fs-cap); }
.streak .grow { margin-left: auto; text-align: right; }
.chip {
  display: inline-block; background: var(--card); color: var(--ink);
  border-radius: var(--r3); padding: 0 var(--sp3);
  font-size: var(--fs-label); line-height: 28px; font-weight: 700;
}

/* ---------- 晩酌カウンター ---------- */
.drinks { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp3); }
.drink {
  position: relative; min-height: 88px;
  background: var(--card); color: var(--ink);
  border: 1px solid var(--line); border-radius: var(--r2);
  display: grid; place-items: center; gap: var(--sp1);
  font-size: var(--fs-body); cursor: pointer; padding: var(--sp3);
}
.drink .plus { font-size: var(--fs-label); color: var(--muted); }
.drink .cnt {
  position: absolute; top: var(--sp2); right: var(--sp2);
  background: var(--accent); color: var(--on-accent);
  border-radius: var(--r3); font-size: var(--fs-cap); line-height: 20px; padding: 0 var(--sp2);
}
.drink[aria-pressed="true"] { border-color: var(--accent); }
.drink-sum {
  display: flex; align-items: center; gap: var(--sp3);
  margin-top: var(--sp3); font-size: var(--fs-body);
}
.drink-sum .g { font-weight: 700; }
.drink-sum .note { font-size: var(--fs-cap); color: var(--muted); }

/* ---------- ボタン ---------- */
.btn {
  width: 100%; min-height: var(--tap);
  background: var(--accent); color: var(--on-accent);
  border: 1px solid var(--accent); border-radius: var(--r2);
  font-size: var(--fs-body); font-weight: 700; font-family: inherit;
  cursor: pointer; margin-top: var(--sp3);
}
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); font-weight: 400; }
.btn.auto { width: auto; min-width: 96px; padding: 0 var(--sp4); margin: 0; }
.btnrow { display: flex; gap: var(--sp2); flex-wrap: wrap; margin-top: var(--sp3); }

/* ---------- 入力マトリクス ---------- */
.rows { background: var(--card); border: 1px solid var(--line); border-radius: var(--r2); }
.row {
  display: flex; align-items: center; gap: var(--sp3);
  padding: var(--sp2) var(--sp4); min-height: 56px;
  border-bottom: 1px solid var(--line);
}
.row:last-child { border-bottom: 0; }
.row .lbl { flex: 0 0 auto; width: 86px; color: var(--ink); font-size: var(--fs-body); }
.row .lbl svg { color: var(--muted); }
.row .fields { flex: 1 1 auto; display: flex; align-items: center; gap: var(--sp2); min-width: 0; }
.row .u { flex: 0 0 auto; width: 44px; font-size: var(--fs-cap); color: var(--muted); }
input[type=number], input[type=text], input[type=date] {
  width: 100%; min-width: 0; min-height: var(--tap);
  padding: 0 var(--sp3); text-align: right;
  font-size: var(--fs-body); font-family: inherit;
  color: var(--ink); background: var(--card);
  border: 1px solid var(--line); border-radius: var(--r2);
}
input:focus-visible, .btn:focus-visible, .drink:focus-visible, .iconbtn:focus-visible, summary:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.slash { color: var(--muted); }
.hint { font-size: var(--fs-cap); color: var(--muted); margin: var(--sp2) 0 0; }
.saved { font-size: var(--fs-label); color: var(--good); margin: var(--sp2) 0 0; min-height: 22px; }

/* ---------- グラフ ---------- */
.chart { margin-bottom: var(--sp5); }
.chart:last-child { margin-bottom: 0; }
.chart-head { display: flex; align-items: baseline; gap: var(--sp3); flex-wrap: wrap; }
.chart-head .t { font-size: var(--fs-label); font-weight: 700; }
.chart-head .now { font-size: var(--fs-label); color: var(--muted); margin-left: auto; }
.legend { display: flex; gap: var(--sp3); font-size: var(--fs-cap); color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: var(--sp1); }
.legend i { width: 14px; height: 2px; display: inline-block; }
.chart svg { width: 100%; height: auto; display: block; margin-top: var(--sp2); }
.empty { font-size: var(--fs-label); color: var(--muted); text-align: center; padding: var(--sp5) 0; }

/* ---------- 表 ---------- */
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: var(--fs-label); }
th, td { padding: var(--sp2) var(--sp3); text-align: right; white-space: nowrap; }
th { background: var(--sunken); color: var(--muted); font-weight: 700; font-size: var(--fs-cap); }
td { border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
th:first-child, td:first-child { text-align: left; }
td:last-child, th:last-child { text-align: center; }
td.off { color: var(--bad); }
tr:last-child td { border-bottom: 0; }

/* ---------- 折りたたみ ---------- */
details { background: var(--card); border: 1px solid var(--line); border-radius: var(--r2); margin-top: var(--sp3); }
summary {
  min-height: var(--tap); display: flex; align-items: center; gap: var(--sp2);
  padding: 0 var(--sp4); cursor: pointer; font-size: var(--fs-body); list-style: none;
}
summary::-webkit-details-marker { display: none; }
summary .grow { margin-left: auto; color: var(--muted); }
details .body { padding: 0 var(--sp4) var(--sp4); }

/* ---------- 下タブ ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--card); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
.tabbar-inner { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tab {
  min-height: 56px; display: grid; place-items: center; gap: 2px;
  background: transparent; border: 0; color: var(--muted);
  font-size: var(--fs-cap); font-family: inherit; cursor: pointer; padding: var(--sp2) 0;
}
.tab[aria-current="true"] { color: var(--accent); font-weight: 700; }

/* ---------- ドロワー / お知らせ ---------- */
.scrim {
  position: fixed; inset: 0; z-index: 30; background: var(--ink); opacity: .45;
  border: 0; padding: 0; cursor: pointer;
}
.drawer {
  position: fixed; z-index: 31; top: 0; bottom: 0; left: 0;
  width: min(320px, 85vw); background: var(--card);
  border-right: 1px solid var(--line); overflow-y: auto;
  padding: var(--sp4) var(--sp4) var(--sp6);
}
.drawer h2 { font-size: var(--fs-title); margin: var(--sp2) 0 var(--sp4); }
.drawer .row { padding-left: 0; padding-right: 0; border-color: var(--line); }
.panel {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--r2); padding: var(--sp4); margin-top: var(--sp3);
}
.panel p { margin: 0 0 var(--sp2); font-size: var(--fs-label); }
.panel p:last-child { margin-bottom: 0; }
.panel .k { color: var(--muted); font-size: var(--fs-cap); }
[hidden] { display: none !important; }
</style>
</head>
<body>

<header class="appbar">
  <div class="appbar-inner">
    <button class="iconbtn" id="btnMenu" aria-label="設定を開く">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <h1>カラダ日報</h1>
    <button class="iconbtn" id="btnBell" aria-label="お知らせを開く">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 6-2 7-2 7h16s-2-1-2-7"/><path d="M13.7 20a2 2 0 0 1-3.4 0"/></svg>
      <span class="dot" id="bellDot" hidden></span>
    </button>
  </div>
</header>

<div class="wrap">

  <section id="sec-home">
    <div class="greet">
      <div class="date" id="today"></div>
      <p class="hello" id="hello">おつかれさまです</p>
      <p class="coach" id="coach"></p>
    </div>

    <div class="strip" id="strip"></div>

    <h2 class="sec">今日の状態</h2>
    <div class="cards" id="status"></div>
  </section>

  <section id="sec-drink">
    <h2 class="sec">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l-1 5a4 4 0 0 1-8 0Z"/><path d="M15 5h2a2 2 0 0 1 0 4h-2"/><path d="M7 21h8"/><path d="M11 13v8"/></svg>
      今夜の晩酌
    </h2>
    <div class="drinks" id="drinks"></div>
    <div class="drink-sum" id="drinkSum"></div>
    <div class="btnrow">
      <button class="btn auto ghost" id="btnUndo">やり直す</button>
      <button class="btn auto ghost" id="btnMore">その他のお酒</button>
    </div>
    <div id="moreDrinks" class="drinks" style="margin-top:var(--sp3)" hidden></div>
    <button class="btn" id="btnDry">休肝日で確定</button>
  </section>

  <section id="sec-record">
    <h2 class="sec">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      今日の記録
    </h2>
    <div class="rows">
      <div class="row">
        <span class="lbl">日付</span>
        <span class="fields"><input type="date" id="fDate" aria-label="日付"></span>
        <span class="u"></span>
      </div>
      <div class="row">
        <span class="lbl">体重</span>
        <span class="fields"><input type="number" id="fWeight" inputmode="decimal" step="0.1" min="20" max="300" placeholder="77.1" aria-label="体重"></span>
        <span class="u">kg</span>
      </div>
      <div class="row">
        <span class="lbl">腹囲</span>
        <span class="fields"><input type="number" id="fWaist" inputmode="decimal" step="0.5" min="40" max="200" placeholder="87.5" aria-label="腹囲"></span>
        <span class="u">cm</span>
      </div>
      <div class="row">
        <span class="lbl">血圧</span>
        <span class="fields">
          <input type="number" id="fSys" inputmode="numeric" step="1" min="50" max="300" placeholder="130" aria-label="血圧 上">
          <span class="slash">／</span>
          <input type="number" id="fDia" inputmode="numeric" step="1" min="30" max="200" placeholder="92" aria-label="血圧 下">
        </span>
        <span class="u">mmHg</span>
      </div>
      <div class="row">
        <span class="lbl">歩数</span>
        <span class="fields"><input type="number" id="fSteps" inputmode="numeric" step="1" min="0" max="200000" placeholder="6500" aria-label="歩数"></span>
        <span class="u">歩</span>
      </div>
      <div class="row">
        <span class="lbl">睡眠</span>
        <span class="fields"><input type="number" id="fSleep" inputmode="decimal" step="0.5" min="0" max="24" placeholder="6.5" aria-label="睡眠"></span>
        <span class="u">時間</span>
      </div>
      <div class="row">
        <span class="lbl">メモ</span>
        <span class="fields"><input type="text" id="fMemo" placeholder="接待 / 腰にきてる" aria-label="メモ"></span>
        <span class="u"></span>
      </div>
    </div>
    <button class="btn" id="btnSave">記録を保存</button>
    <p class="saved" id="savedMsg" role="status"></p>
    <p class="hint">腹囲はへその高さで、息を吐いて測ります。</p>
  </section>

  <section id="sec-trend">
    <h2 class="sec">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/></svg>
      30日の推移
    </h2>
    <div class="card">
      <div class="chart" id="chartWeight"></div>
      <div class="chart" id="chartBp"></div>
    </div>
  </section>

  <section id="sec-checkup">
    <h2 class="sec">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9z"/><path d="M9 12h6M9 16h4"/></svg>
      健康診断
    </h2>
    <div class="card" id="checkup"></div>
    <details id="chkForm">
      <summary>健診結果を入力・編集<span class="grow">＋</span></summary>
      <div class="body">
        <div class="rows" id="chkRows"></div>
        <button class="btn" id="btnSaveChk">健診結果を保存</button>
      </div>
    </details>
    <details id="listBox">
      <summary>記録一覧（直近60件）<span class="grow">›</span></summary>
      <div class="body"><div class="tablewrap" id="list"></div></div>
    </details>
  </section>
</div>

<nav class="tabbar" aria-label="画面切り替え">
  <div class="tabbar-inner">
    <button class="tab" data-go="sec-home" aria-current="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      ホーム
    </button>
    <button class="tab" data-go="sec-record">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      記録
    </button>

<script>
"use strict";
/* ===========================================================
   ロジックは従来のまま(判定基準・保存形式・キーは不変)
   =========================================================== */
const $ = id => document.getElementById(id);
const REC_KEY = "ojisan_health_records";
const SET_KEY = "ojisan_health_settings";
const CHK_KEY = "ojisan_health_checkups";

const params = new URLSearchParams(location.search);
const STATE = params.get("state");

let records = [], settings = {}, checkups = [];

function load(key, fallback) {
  try { const v = JSON.parse(localStorage.getItem(key)); return v ?? fallback; } catch { return fallback; }
}
function persist() {
  if (STATE) return;            // 状態プレビュー中は保存しない
  localStorage.setItem(REC_KEY, JSON.stringify(records));
  localStorage.setItem(SET_KEY, JSON.stringify(settings));
  localStorage.setItem(CHK_KEY, JSON.stringify(checkups));
}
function isoOf(d) { return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function todayISO() { return isoOf(new Date()); }
function daysAgoISO(n) { const d = new Date(); d.setDate(d.getDate() - n); return isoOf(d); }
function fmtDate(iso) { const [,m,d] = iso.split("-"); return Number(m) + "/" + Number(d); }
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function num(v) { const n = parseFloat(v); return isFinite(n) ? n : null; }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

const SENRYU = [
  "健診の 前夜だけ飲む 特保茶",
  "腹囲測る 息を吸うのは 反則です",
  "休肝日 カレンダーには 書いてある",
  "階段を 使った日だけ 声でかい",
  "万歩計 稼ぐつもりが タクシーで",
  "γ-GTP 読み方覚え 三年目",
  "痛風の 気配で覚える プリン体",
  "糖質を 抜いた分だけ 語り出す",
  "体重計 乗る前に外す 腕時計",
  "ジム契約 通ったのは 初月だけ",
  "〆のラーメン 断った夜は よく眠れ",
  "ハイボール 糖質ゼロを 免罪符",
  "目標は 去年も言った 気がします",
  "血圧計 深呼吸して 二度目測る",
  "若手より 検査項目で マウント取る"
];

const DRINKS = [
  { key: "b500", label: "ビール",     g: 20, main: true },
  { key: "high", label: "ハイボール", g: 14, main: true },
  { key: "sake", label: "日本酒",     g: 22, main: true },
  { key: "wine", label: "ワイン",     g: 12, main: true },
  { key: "b350", label: "缶ビール",   g: 14, main: false },
  { key: "sho",  label: "焼酎",       g: 12, main: false },
  { key: "chu",  label: "チューハイ", g: 18, main: false }
];
const GLASS_ICON = {
  b500: '<path d="M6 3h9l-1 5a4 4 0 0 1-8 0Z"/><path d="M15 5h2a2 2 0 0 1 0 4h-2"/><path d="M7 21h8"/><path d="M11 13v8"/>',
  b350: '<rect x="8" y="3" width="8" height="18" rx="2"/><path d="M8 8h8"/>',
  high: '<path d="M6 4h12l-1.5 16h-9Z"/><path d="M7 10h10"/>',
  sake: '<path d="M10 3h4v3l3 4v11H7V10l3-4Z"/><path d="M10 6h4"/>',
  sho:  '<path d="M7 8h10l-1 12H8Z"/><path d="M9 4h6v4H9z"/>',
  chu:  '<path d="M7 7h10l-1 13H8Z"/><path d="M12 3v4"/><path d="M9 11h6"/>',
  wine: '<path d="M8 3h8l-1 6a3 3 0 0 1-6 0Z"/><path d="M12 12v7"/><path d="M9 21h6"/>'
};
function alcGrams(rec) {
  if (!rec) return null;
  if (rec.alc) return DRINKS.reduce((s, d) => s + (rec.alc[d.key] || 0) * d.g, 0);
  if (rec.alc_g != null) return rec.alc_g;
  if (rec.drinks != null) return rec.drinks * 20;
  return null;
}
function drinkCount(rec) {
  if (!rec) return null;
  if (rec.alc) return DRINKS.reduce((s, d) => s + (rec.alc[d.key] || 0), 0);
  return rec.drinks ?? null;
}

/* --- 判定(基準は不変) --- */
function bpClass(sys, dia) {
  if (sys == null || dia == null) return null;
  if (sys >= 180 || dia >= 110) return { label: "III度高血圧", tone: "bad" };
  if (sys >= 160 || dia >= 100) return { label: "II度高血圧",  tone: "bad" };
  if (sys >= 140 || dia >= 90)  return { label: "I度高血圧",   tone: "bad" };
  if (sys >= 130 || dia >= 80)  return { label: "高値血圧",    tone: "warn" };
  if (sys >= 120)               return { label: "正常高値",    tone: "warn" };
  return { label: "正常", tone: "ok" };
}
function bmiClass(bmi) {
  if (bmi == null) return null;
  if (bmi >= 30)  return { label: "肥満(2度〜)", tone: "bad" };
  if (bmi >= 25)  return { label: "肥満(1度)",   tone: "warn" };
  if (bmi < 18.5) return { label: "低体重",      tone: "warn" };
  return { label: "普通体重", tone: "ok" };
}
function metaboClass() {
  const w = latest("waist");
  if (!w) return null;
  const bp = latest("sys");
  const chk = checkups.length ? checkups[checkups.length - 1] : null;
  let flags = 0; const reasons = [];
  if (bp && (bp.sys >= 130 || bp.dia >= 85)) { flags++; reasons.push("血圧"); }
  if (chk && ((chk.tg != null && chk.tg >= 150) || (chk.hdl != null && chk.hdl < 40))) { flags++; reasons.push("脂質"); }
  if (chk && ((chk.glu != null && chk.glu >= 110) || (chk.hba1c != null && chk.hba1c >= 6.0))) { flags++; reasons.push("血糖"); }
  if (w.waist < 85) return { waist: w, label: "セーフ", tone: "ok", why: "メタボラインまで " + (85 - w.waist).toFixed(1) + "cm の余裕" };
  if (flags >= 2)   return { waist: w, label: "メタボ該当",   tone: "bad",  why: reasons.join("・") + "も基準超え" };
  if (flags === 1)  return { waist: w, label: "メタボ予備群", tone: "warn", why: reasons.join("・") + "が基準超え" };
  return { waist: w, label: "腹囲オーバー", tone: "warn", why: "基準 85cm を " + (w.waist - 85).toFixed(1) + "cm 超過" };
}
const CHK_METRICS = [
  { key: "ggt",   label: "γ-GTP",     unit: "U/L",   judge: v => v <= 50 ? 0 : v <= 100 ? 1 : 2, ref: "〜50",  better: "low" },
  { key: "tg",    label: "中性脂肪",  unit: "mg/dL", judge: v => v < 150 ? 0 : v < 300 ? 1 : 2,  ref: "〜149", better: "low" },
  { key: "hdl",   label: "HDL",       unit: "mg/dL", judge: v => v >= 40 ? 0 : 2,                ref: "40〜",  better: "high" },
  { key: "ldl",   label: "LDL",       unit: "mg/dL", judge: v => v < 120 ? 0 : v < 140 ? 1 : 2,  ref: "〜119", better: "low" },
  { key: "glu",   label: "血糖",      unit: "mg/dL", judge: v => v < 100 ? 0 : v < 126 ? 1 : 2,  ref: "〜99",  better: "low" },
  { key: "hba1c", label: "HbA1c",     unit: "%",     judge: v => v < 5.6 ? 0 : v < 6.5 ? 1 : 2,  ref: "〜5.5", better: "low" },
  { key: "ua",    label: "尿酸",      unit: "mg/dL", judge: v => v <= 7.0 ? 0 : v < 9.0 ? 1 : 2, ref: "〜7.0", better: "low" }
];
function chkVerdict(m, v, prev) {
  if (v == null) return null;
  const lvl = m.judge(v);
  const rel = (prev != null && prev !== 0) ? (v - prev) / Math.abs(prev) : null;
  const improved = rel != null && (m.better === "high" ? rel >= 0.05 : rel <= -0.05);
  const worsened = rel != null && (m.better === "high" ? rel <= -0.05 : rel >= 0.05);
  if (lvl === 2) return { label: "要相談", tone: "bad" };
  if (improved)  return { label: "改善", tone: "ok" };
  if (lvl === 1 && worsened) return { label: "注意", tone: "warn" };
  if (lvl === 1 && rel == null) return { label: "注意", tone: "warn" };
  if (lvl === 1) return { label: "経過観察", tone: "flat" };
  return { label: "基準内", tone: "ok" };
}

const RANKS = [
  { days: 365, title: "会長" }, { days: 100, title: "専務" }, { days: 60, title: "部長" },
  { days: 30, title: "課長" },  { days: 14, title: "係長" },  { days: 7,  title: "主任" },
  { days: 3, title: "平社員" }, { days: 1, title: "研修中" }
];
function streakDays() {
  const dates = new Set(records.map(r => r.date));
  let n = 0; const d = new Date();
  if (!dates.has(isoOf(d))) d.setDate(d.getDate() - 1);
  while (dates.has(isoOf(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function rankOf(days) { for (const r of RANKS) if (days >= r.days) return r; return { days: 0, title: "見習い" }; }
function nextRank(days) { let next = null; for (const r of RANKS) if (days < r.days) next = r; return next; }

function latest(field) { for (let i = records.length - 1; i >= 0; i--) if (records[i][field] != null) return records[i]; return null; }
function valueOnOrBefore(field, dateISO) { let best = null; for (const r of records) if (r[field] != null && r.date <= dateISO) best = r; return best; }
function upsert(rec) {
  const i = records.findIndex(r => r.date === rec.date);
  if (i >= 0) records[i] = rec; else { records.push(rec); records.sort((a,b) => a.date < b.date ? -1 : 1); }
}
function getOrCreateToday() {
  const date = todayISO();
  let r = records.find(x => x.date === date);
  if (!r) { r = { date, weight:null, waist:null, sys:null, dia:null, steps:null, sleep:null, alc:null, memo:null };
    records.push(r); records.sort((a,b) => a.date < b.date ? -1 : 1); }
  return r;
}

/* ===========================================================
   部品
   =========================================================== */
function icon(paths, size) {
  return `<svg width="${size||20}" height="${size||20}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`;
}
const IC = {
  scale: '<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M12 8v3"/><path d="M8.5 11h7"/>',
  tape:  '<rect x="2" y="8" width="20" height="8" rx="2"/><path d="M7 8v3M12 8v4M17 8v3"/>',
  heart: '<path d="M12 20s-7-4.4-7-9a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 4.6-7 9-7 9Z"/>',
  glass: '<path d="M6 4h12l-1.5 16h-9Z"/><path d="M7 10h10"/>',
  flame: '<path d="M12 3s5 4 5 8a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 1 0 1-3-1-7Z"/>'
};
function band(o) {
  const p = clamp((o.value - o.min) / (o.max - o.min), 0, 1) * 100;
  const t = o.tick != null ? clamp((o.tick - o.min) / (o.max - o.min), 0, 1) * 100 : null;
  return `<div class="band">
    <div class="band-track" role="img" aria-label="${esc(o.aria)}">
      ${t != null ? `<span class="band-tick" style="left:${t.toFixed(1)}%"></span>` : ""}
      <span class="band-mark ${o.tone}" style="left:${p.toFixed(1)}%"></span>
    </div>
    <div class="band-ends"><span>${esc(o.left)}</span><span>${esc(o.right)}</span></div>
  </div>`;
}
function pill(v) { return v ? `<span class="pill ${v.tone}">${esc(v.label)}</span>` : ""; }

/* ===========================================================
   描画
   =========================================================== */
function renderGreeting() {
  const d = new Date();
  const wd = "日月火水木金土"[d.getDay()];
  $("today").textContent = `${d.getMonth()+1}月${d.getDate()}日（${wd}）`;
  $("hello").textContent = d.getHours() < 10 ? "おはようございます" : "おつかれさまです";
  const msgs = coachMessages();
  const doy = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 864e5);
  $("coach").textContent = msgs.length ? msgs[0] : SENRYU[doy % SENRYU.length];
}
function coachMessages() {
  const msgs = [];
  const bp = latest("sys");
  if (bp && bp.dia != null) {
    const c = bpClass(bp.sys, bp.dia);
    if (c && c.tone === "bad") msgs.push("その血圧は武勇伝になりません。近いうちに病院へ。");
  }
  const m = metaboClass();
  if (m && m.label === "メタボ該当") msgs.push("メタボ判定が出ています。腹囲マイナス1cm＝体重約1kg減から。");
  const chk = checkups.length ? checkups[checkups.length - 1] : null;
  if (chk && chk.ua != null && chk.ua > 7.0) msgs.push("尿酸値が7超え。水を多めに、ビールは本数半分から。");
  if (chk && chk.ggt != null && chk.ggt > 100) msgs.push("γ-GTPが三桁です。肝臓が退職届を書く前に休肝日を。");
  const w = latest("weight");
  const prev = w ? valueOnOrBefore("weight", daysAgoISO(7)) : null;
  if (w && prev && prev.date !== w.date) {
    const d = w.weight - prev.weight;
    if (d >= 1.0) msgs.push("先週比プラス1kg超。今夜の〆は我慢しましょう。");
    else if (d <= -0.5) msgs.push("体重、いい感じに落ちています。スーツが誇らしげです。");
  }
  const weekAgo = daysAgoISO(6);
  const alcRecs = records.filter(r => r.date >= weekAgo && alcGrams(r) != null);
  if (alcRecs.length >= 5 && alcRecs.every(r => alcGrams(r) > 0)) msgs.push("今週まだ休肝日ゼロ。肝臓も定時退社させましょう。");
  if (!records.length) msgs.push("まずは今日の体重と腹囲から。現実を直視するのが第一歩です。");
  return msgs;
}

function renderStrip() {
  const has = new Set(records.map(r => r.date));
  let html = "";
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const iso = isoOf(d);
    const wd = "日月火水木金土"[d.getDay()];
    html += `<div class="${i === 0 ? "today" : ""}">${wd}<span class="d">${d.getDate()}</span><span class="mark">${has.has(iso) ? "・" : ""}</span></div>`;
  }
  $("strip").innerHTML = html;
}

function card(inner) { return `<div class="card">${inner}</div>`; }

function renderStatus() {
  const out = [];

  // 体重(BMIの帯)
  const w = latest("weight");
  if (w) {
    const prev = valueOnOrBefore("weight", daysAgoISO(7));
    let sub = "";
    if (prev && prev.date !== w.date) {
      const d = w.weight - prev.weight;
      sub = `前週比 ${d >= 0 ? "+" : "−"}${Math.abs(d).toFixed(1)} kg`;
    } else sub = "前週のデータなし";
    let bandHtml = "", why = "";
    if (settings.height != null) {
      const bmi = w.weight / ((settings.height / 100) ** 2);
      const c = bmiClass(bmi);
      bandHtml = band({ value: bmi, min: 17, max: 33, tick: 25, tone: c.tone,
        left: "普通", right: "肥満", aria: `BMI ${bmi.toFixed(1)}、${c.label}` });
      why = `BMI ${bmi.toFixed(1)}・${c.label}`;
    } else {
      why = "身長を設定するとBMIが出ます";
    }
    if (settings.target != null) {
      const gap = w.weight - settings.target;
      why += gap <= 0 ? "／目標達成" : `／目標まで ${gap.toFixed(1)}kg`;
    }
    out.push(card(`<div class="lbl">${icon(IC.scale)}体重</div>
      <div class="val">${w.weight.toFixed(1)}<span class="u">kg</span></div>
      <div class="sub">${esc(sub)}</div>${bandHtml}<div class="why">${esc(why)}</div>`));
  } else {
    out.push(card(`<div class="lbl">${icon(IC.scale)}体重</div><div class="val">—<span class="u">kg</span></div><div class="sub">未記録</div>`));
  }

  // 腹囲(メタボの帯)
  const m = metaboClass();
  if (m) {
    out.push(card(`<div class="lbl">${icon(IC.tape)}腹囲</div>
      <div class="val">${m.waist.waist.toFixed(1)}<span class="u">cm</span></div>
      <div class="sub">${pill({ label: m.label, tone: m.tone })}</div>
      ${band({ value: m.waist.waist, min: 75, max: 100, tick: 85, tone: m.tone, left: "セーフ", right: "メタボ", aria: `腹囲 ${m.waist.waist}cm、${m.label}` })}
      <div class="why">${esc(m.why)}</div>`));
  } else {
    out.push(card(`<div class="lbl">${icon(IC.tape)}腹囲</div><div class="val">—<span class="u">cm</span></div>
      <div class="sub">未記録</div><div class="why">85cm が特定健診の境界線です</div>`));
  }

  // 血圧
  const bp = latest("sys");
  if (bp && bp.dia != null) {
    const c = bpClass(bp.sys, bp.dia);
    out.push(card(`<div class="lbl">${icon(IC.heart)}血圧</div>
      <div class="val">${bp.sys}<span class="u">/ ${bp.dia} mmHg</span></div>
      <div class="sub">${pill(c)}</div>
      ${band({ value: bp.sys, min: 100, max: 180, tick: 140, tone: c.tone, left: "正常", right: "高血圧", aria: `収縮期 ${bp.sys}、${c.label}` })}
      <div class="why">${esc(fmtDate(bp.date))} 時点・上が140または下が90を超えると高血圧です</div>`));
  } else {
    out.push(card(`<div class="lbl">${icon(IC.heart)}血圧</div><div class="val">—</div><div class="sub">未記録</div>`));
  }

  // 今週の純アルコール
  const weekAgo = daysAgoISO(6);
  const weekRecs = records.filter(r => r.date >= weekAgo && alcGrams(r) != null);
  if (weekRecs.length) {
    const total = Math.round(weekRecs.reduce((s, r) => s + alcGrams(r), 0));
    const dry = weekRecs.filter(r => alcGrams(r) === 0).length;
    const LIMIT = 140;
    const pct = clamp(total / (LIMIT * 2), 0, 1) * 100;
    const cls = total <= LIMIT ? "" : (total <= LIMIT * 2 ? "over" : "way");
    const tone = total <= LIMIT ? "ok" : (total <= LIMIT * 2 ? "warn" : "bad");
    out.push(card(`<div class="lbl">${icon(IC.glass)}今週の酒</div>
      <div class="val">${total}<span class="u">/ 140 g</span></div>
      <div class="sub">${pill({ label: total <= LIMIT ? "適量圏内" : "適量超え", tone })}</div>
      <div class="meter" role="img" aria-label="今週の純アルコール ${total}グラム、適量140グラム">
        <span class="limit" style="left:50%"></span><i class="${cls}" style="width:${pct.toFixed(1)}%"></i>
      </div>
      <div class="why">休肝日 ${dry}日／${weekRecs.length}日ぶん・厚労省の目安は1日20g</div>`));
  } else {
    out.push(card(`<div class="lbl">${icon(IC.glass)}今週の酒</div><div class="val">—<span class="u">g</span></div>

/* --- グラフ --- */
const CW = 320, CH = 150, PAD = { t: 16, r: 34, b: 20, l: 30 };
function niceTicks(min, max, count) {
  if (min === max) { min -= 1; max += 1; }
  const step0 = (max - min) / count;
  const mag = Math.pow(10, Math.floor(Math.log10(step0)));
  let step = mag;
  for (const m of [1, 2, 5, 10]) if (m * mag >= step0) { step = m * mag; break; }
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = lo; v <= hi + step / 2; v += step) ticks.push(Math.round(v * 100) / 100);
  return { lo, hi, ticks };
}
function movingAvg(points, n) {
  return points.map((p, i) => {
    const from = Math.max(0, i - n + 1);
    const slice = points.slice(from, i + 1);
    const avg = slice.reduce((s, q) => s + q.value, 0) / slice.length;
    return { date: p.date, value: Math.round(avg * 10) / 10 };
  });
}
function drawChart(el, title, unit, series, opts) {
  const all = series.flatMap(s => s.points);
  if (!all.length) {
    el.innerHTML = `<div class="chart-head"><span class="t">${esc(title)}</span></div><div class="empty">データがありません</div>`;
    return;
  }
  const dates = [...new Set(all.map(p => p.date))].sort();
  const X = d => PAD.l + (dates.length === 1 ? (CW - PAD.l - PAD.r) / 2
              : (dates.indexOf(d) / (dates.length - 1)) * (CW - PAD.l - PAD.r));
  let vmin = Math.min(...all.map(p => p.value)), vmax = Math.max(...all.map(p => p.value));
  if (opts.include != null) { vmin = Math.min(vmin, opts.include); vmax = Math.max(vmax, opts.include); }
  const { lo, hi, ticks } = niceTicks(vmin, vmax, 3);
  const Y = v => PAD.t + (1 - (v - lo) / (hi - lo)) * (CH - PAD.t - PAD.b);

  let s = `<svg viewBox="0 0 ${CW} ${CH}" role="img" aria-label="${esc(opts.aria)}">`;
  for (const t of ticks) {
    s += `<line x1="${PAD.l}" y1="${Y(t).toFixed(1)}" x2="${CW - PAD.r}" y2="${Y(t).toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>`;
    s += `<text x="${PAD.l - 4}" y="${(Y(t) + 4).toFixed(1)}" text-anchor="end" font-size="12" fill="var(--muted)">${t}</text>`;
  }
  [0, Math.floor((dates.length - 1) / 2), dates.length - 1].forEach((i, k, arr) => {
    if (i < 0 || (k > 0 && i === arr[k - 1])) return;
    s += `<text x="${X(dates[i]).toFixed(1)}" y="${CH - 4}" text-anchor="middle" font-size="12" fill="var(--muted)">${fmtDate(dates[i])}</text>`;
  });
  if (opts.goal != null && opts.goal >= lo && opts.goal <= hi) {
    s += `<line x1="${PAD.l}" y1="${Y(opts.goal).toFixed(1)}" x2="${CW - PAD.r}" y2="${Y(opts.goal).toFixed(1)}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 3"/>`;
    s += `<text x="${CW - PAD.r}" y="${(Y(opts.goal) - 4).toFixed(1)}" text-anchor="end" font-size="12" fill="var(--muted)">目標 ${opts.goal}</text>`;
  }
  for (const se of series) {
    if (!se.points.length) continue;
    const d = se.points.map((p, i) => (i ? "L" : "M") + X(p.date).toFixed(1) + " " + Y(p.value).toFixed(1)).join(" ");
    s += `<path d="${d}" fill="none" stroke="${se.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"${se.dash ? ' stroke-dasharray="5 3"' : ""}${se.faint ? ' opacity="0.45"' : ""}/>`;
    if (se.dots) for (const p of se.points)
      s += `<circle cx="${X(p.date).toFixed(1)}" cy="${Y(p.value).toFixed(1)}" r="3" fill="${se.color}"/>`;
    if (se.label) {
      const last = se.points[se.points.length - 1];
      s += `<circle cx="${X(last.date).toFixed(1)}" cy="${Y(last.value).toFixed(1)}" r="4" fill="${se.color}"/>`;
      s += `<text x="${CW - PAD.r + 4}" y="${(Y(last.value) + 4).toFixed(1)}" font-size="12" font-weight="700" fill="${se.color}">${last.value}</text>`;
    }
  }
  s += `</svg>`;

  const legend = series.filter(x => x.name).map(x =>
    `<span><i style="background:${x.color}"></i>${esc(x.name)}</span>`).join("");
  el.innerHTML = `<div class="chart-head"><span class="t">${esc(title)}</span>
    <span class="now">${esc(unit)}</span></div>
    ${legend ? `<div class="legend">${legend}</div>` : ""}${s}`;
}

/* --- CSV --- */
function csvEscape(v) { v = (v === null || v === undefined) ? "" : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function downloadCsv(name, lines) {
  const blob = new Blob(["﻿" + lines.join("\n") + "\n"], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
}
const CSV_COLS = ["date","weight","waist","sys","dia","steps","sleep","alc_g","drinks","memo"];
$("btnCsvDay").addEventListener("click", () => {
  const lines = [CSV_COLS.join(",")];
  for (const r of records) { const o = { ...r, alc_g: alcGrams(r), drinks: drinkCount(r) };
    lines.push(CSV_COLS.map(c => csvEscape(o[c])).join(",")); }
  downloadCsv("カラダ日報_日次_" + todayISO() + ".csv", lines);
});
$("btnCsvChk").addEventListener("click", () => {
  const cols = ["date", ...CHK_METRICS.map(m => m.key)];
  const lines = [cols.join(",")];
  for (const c of checkups) lines.push(cols.map(k => csvEscape(c[k])).join(","));
  downloadCsv("カラダ日報_健診_" + todayISO() + ".csv", lines);
});
$("btnImport").addEventListener("click", () => $("fileImport").click());
$("fileImport").addEventListener("change", ev => {
  const file = ev.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const rows = parseCsv(String(reader.result).replace(/^﻿/, ""));
      if (!rows.length || rows[0][0] !== "date") { alert("CSVの形式が違います（1列目のヘッダは date）"); return; }
      const header = rows[0]; let added = 0, updated = 0;
      for (const row of rows.slice(1)) {
        if (!row.length || !row[0]) continue;
        const rec = { date: row[0], weight:null, waist:null, sys:null, dia:null, steps:null, sleep:null, alc:null, alc_g:null, drinks:null, memo:null };
        header.forEach((h, i) => {
          if (h === "date") return;
          if (h === "memo") rec.memo = row[i] || null;
          else if (CSV_COLS.includes(h)) rec[h] = num(row[i]);
        });
        const idx = records.findIndex(r => r.date === rec.date);
        if (idx >= 0) { records[idx] = rec; updated++; } else { records.push(rec); added++; }
      }
      records.sort((a,b) => a.date < b.date ? -1 : 1);
      persist(); renderAll();
      alert(`インポート完了: 追加 ${added}件 / 更新 ${updated}件`);
    } catch (e) { alert("インポートに失敗しました: " + e); }
    ev.target.value = "";
  };
  reader.readAsText(file);
});
function parseCsv(text) {
  const rows = []; let row = [], cur = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) { if (c === '"') { if (text[i+1] === '"') { cur += '"'; i++; } else inQ = false; } else cur += c; }
    else if (c === '"') inQ = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i+1] === "\n") i++;
      row.push(cur); cur = "";
      if (row.length > 1 || row[0] !== "") rows.push(row);
      row = [];
    } else cur += c;
  }
  if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
  return rows;
}

/* ===========================================================
   状態プレビュー(?state=empty|demo|saved) — 本番URLでは無視
   =========================================================== */
function demoData() {
  const recs = []; let w = 78.4, waist = 88.6;
  for (let i = 29; i >= 0; i--) {
    const iso = daysAgoISO(i);
    w += Math.sin(i * 1.7) * 0.25 - 0.04;
    waist += Math.sin(i * 1.3) * 0.12 - 0.03;
    const r = { date: iso, weight: Math.round(w * 10) / 10, waist: null, sys: null, dia: null,
                steps: 5200 + Math.round(Math.sin(i * 2.3) * 2200), sleep: 6 + (i % 3) * 0.5,
                alc: null, memo: null };
    if (i % 3 === 0) r.waist = Math.round(waist * 2) / 2;
    if (i % 2 === 0) { r.sys = 138 + Math.round(Math.sin(i) * 6) - Math.round((29 - i) * 0.2); r.dia = 88 + Math.round(Math.cos(i) * 4); }
    r.alc = (i % 3 === 0) ? {} : (i % 5 === 0 ? { b500: 2, high: 1, sake: 1 } : { b500: 1, high: 1 });
    if (i === 1) r.memo = "部の飲み会";
    recs.push(r);
  }
  return recs;
}
function applyState() {
  if (STATE === "empty") { records = []; checkups = []; settings = {}; return; }
  if (STATE === "demo" || STATE === "saved") {
    records = demoData();
    checkups = [
      { date: "2025-06-10", ggt: 88, tg: 168, hdl: 42, ldl: 138, glu: 102, hba1c: 5.7, ua: 7.4 },
      { date: "2026-06-09", ggt: 72, tg: 152, hdl: 45, ldl: 131, glu: 99,  hba1c: 5.6, ua: 7.1 }
    ];
    settings = { height: 171, target: 72, checkupDate: daysAgoISO(-24) };
  }
}

/* ===========================================================
   起動
   =========================================================== */
records = load(REC_KEY, []); settings = load(SET_KEY, {}); checkups = load(CHK_KEY, []);
if (STATE) applyState();
renderCheckupForm();
if (settings.height != null) $("sHeight").value = settings.height;
if (settings.target != null) $("sTarget").value = settings.target;
if (settings.checkupDate) $("sCheckup").value = settings.checkupDate;
renderAll();
if (STATE === "saved") { $("savedMsg").textContent = `保存しました（${fmtDate(todayISO())}）`; }
</script>
</body>
