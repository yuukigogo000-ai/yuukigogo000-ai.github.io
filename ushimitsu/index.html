<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0d0e14">
<title>うしみつ時計</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex,nofollow">
<style>
  /* レイアウト: 1 画面のアプリ。上から 刻限・体力 → 化け物 → 時計(canvas)→ 見通しの一言 → 構えと札 → 回す刻と「決める」。 */
  /* 色は夜の 1 種類だけ(明るい版は作らない)。見た目は仮で、仕上げは別作業 */
  :root {
    color-scheme: dark;
    --bg: #0d0e14; --surface: #1a1c26; --fg: #ebe6d8; --muted: #9a968a; --line: #343746;
    --face: #151722; --rim: #3d4154; --hand: #ebe6d8;
    --f0: #e0705a; --f1: #5fb0c9; --f2: #c79bdf; --foe-fg: #0d0e14;
    --atk: #e0705a; --def: #6aa8ff; --waza: #e0b85a; --fire: #ff9a4a;
    --accent: #e0b85a; --accent-fg: #17130a; --danger: #ff7a66; --good: #7fd6a8;
    --font: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.45;
    display: flex; flex-direction: column; gap: 6px; box-sizing: border-box;
    padding-block: 8px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    overscroll-behavior: contain; -webkit-user-select: none; user-select: none;
  }
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .top h1 { font-size: 15px; margin: 0; font-weight: 700; }
  .top .when { color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar { display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
  .bar .hp { flex: 1 1 auto; height: 10px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); overflow: hidden; }
  .bar .hp i { display: block; height: 100%; background: var(--good); }
  .bar .hp i.low { background: var(--danger); }
  .bar button { min-height: 32px; padding: 2px 10px; font-size: 13px; }
  .main { flex: 1 1 auto; min-height: 0; position: relative; display: flex; flex-direction: column; gap: 6px; }
  .foes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
  .foe { border: 1px solid var(--line); border-top-width: 5px; border-radius: 8px; padding: 3px 5px; background: var(--surface); min-width: 0; text-align: left; min-height: 64px; font: inherit; color: var(--fg); position: relative; }
  .foe b { display: block; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .foe span { display: block; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .foe span.next { color: var(--fg); }
  .foe.sel { box-shadow: inset 0 0 0 2px var(--accent); }
  .foe.gone { opacity: .35; }
  .foe .pop { position: absolute; right: 4px; top: 2px; font-weight: 800; font-size: 15px; color: var(--danger); animation: pop .7s ease-out forwards; pointer-events: none; }
  @keyframes pop { from { transform: translateY(6px); opacity: 1; } to { transform: translateY(-10px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .foe .pop { animation-duration: .01s; } }
  .stage-wrap { flex: 1 1 auto; min-height: 0; position: relative; display: flex; justify-content: center; align-items: center; }
  canvas { display: block; touch-action: none; max-width: 100%; }
  .sheet { display: flex; flex-direction: column; gap: 6px; }
  .info { color: var(--muted); min-height: 2.9em; font-size: 13px; text-align: center; }
  .info b { color: var(--fg); font-weight: 700; }
  .info .bad { color: var(--danger); } .info .ok { color: var(--good); }
  .acts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .acts.cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .acts.cards.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .commit { display: grid; grid-template-columns: 48px minmax(0, 1fr) 48px minmax(0, 2fr); gap: 6px; align-items: stretch; }
  .commit .k { display: flex; align-items: center; justify-content: center; font-weight: 700; font-variant-numeric: tabular-nums; border: 1px solid var(--line); border-radius: 8px; }
  button {
    font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 4px; min-height: 44px; min-width: 0;
  }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; font-weight: 700; }
  button:disabled { opacity: .45; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button small { display: block; font-size: 11px; color: inherit; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button.act { border-left-width: 5px; }
  button.act.atk { border-left-color: var(--atk); } button.act.def { border-left-color: var(--def); }
  button.act.waza { border-left-color: var(--waza); } button.act.fire { border-left-color: var(--fire); }
  button.act.sel { box-shadow: inset 0 0 0 2px var(--accent); }
  button.act.empty { border-style: dashed; }
  .panel {
    position: absolute; inset: 0; display: flex; flex-direction: column; gap: 8px; align-items: stretch; justify-content: flex-start;
    background: var(--bg); padding: 4px 0; overflow-y: auto; z-index: 2;
  }
  /* 中身が短いときは中央、長いときは上から順に読めて下へ送れる */
  .panel > :first-child { margin-top: auto; } .panel > :last-child { margin-bottom: auto; }
  .panel h2 { font-size: 20px; margin: 0; text-align: center; }
  .panel h3 { font-size: 13px; margin: 6px 0 0; color: var(--muted); font-weight: 400; }
  .panel p { margin: 0; text-align: center; color: var(--muted); }
  .panel p.tale { color: var(--fg); text-align: left; line-height: 1.8; }
  .panel p.note { color: var(--good); }
  .panel .rows { display: grid; grid-template-columns: auto auto; gap: 2px 14px; justify-content: center; font-variant-numeric: tabular-nums; }
  .panel .rows span:nth-child(odd) { color: var(--muted); }
  .choice { text-align: left; padding: 8px 10px; }
  .choice b { display: block; } .choice span { display: block; color: var(--muted); font-size: 13px; }
  .choice.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .hour { display: grid; grid-template-columns: 5.2em minmax(0, 1fr); gap: 8px; align-items: center; padding: 3px 0; border-top: 1px solid var(--line); }
  .hour .h { color: var(--muted); font-size: 13px; }
  .hour.past { opacity: .4; } .hour.now .h { color: var(--accent); font-weight: 700; }
  .hour .o { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
  .hour .o span { color: var(--muted); }
  .item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; text-align: left; padding: 6px 10px; }
  .item b { display: block; } .item span { display: block; color: var(--muted); font-size: 13px; }
  .item em { font-style: normal; font-variant-numeric: tabular-nums; color: var(--accent); }
</style>
</head>
<body>

<div class="top">
  <h1>うしみつ時計</h1>
  <div class="when" id="when"></div>
</div>
<div class="bar" id="bar" hidden>
  <span id="hpText"></span>
  <div class="hp" aria-hidden="true"><i id="hpBar"></i></div>
  <span id="zeni"></span>
  <button type="button" id="bag">もちもの</button>
</div>
<div class="main" id="main">
  <div class="foes" id="foes" aria-label="化け物"></div>
  <div class="stage-wrap" id="wrap">
    <canvas id="cv" aria-label="時計。針を引っぱって、行動に使う刻を決めます"></canvas>
  </div>
  <div class="sheet">
    <div class="info" id="info"></div>
    <div class="acts" id="basics"></div>
    <div class="acts cards" id="cards"></div>
    <div class="commit">
      <button type="button" id="less" aria-label="刻をへらす">−</button>
      <div class="k" id="kText"></div>
      <button type="button" id="more" aria-label="刻をふやす">＋</button>
      <button type="button" class="primary" id="go">決める</button>
    </div>
  </div>
  <div class="panel" id="panel" hidden></div>
</div>

<script>(function () {
"use strict";
// うしみつ時計: 中身の表(札・おまもり・化け物・夜回り)。決まりは battle.js / run.js。
// 数字はすべて仮置き(模擬の打ち手でしか確かめていない)。

// ---- 札 ---------------------------------------------------------------------
// min〜max: 使う刻(針を回す量)。配列は「回した刻ごとの値」(min から順)。
//   dmg ダメージ / hits 回数 / all 全員 / crush かまえへの効きの倍率 / exec 弱った相手への上乗せ / byBurn やけどの何倍かを上乗せ
//   self 自分へのダメージ / strip かたさを消す / guard 守り(回している間) / ward 見切り / counter 無傷なら次の攻撃に上乗せ
//   burn やけど / delay 印をおくらせる / heal 回復 / power 次の攻撃に上乗せ / draw 札を引く / quick 次の行動を短く / cleanse のろいと砂を消す
//   once 1 回の戦いで 1 度きり
const CARDS = {
  kiru:      { name: '斬りこむ', kind: 'atk', min: 1, max: 3, dmg: [5, 11, 18] },
  tsuki:     { name: '突き', kind: 'atk', min: 1, max: 1, dmg: [4], crush: 2 },
  nidan:     { name: '二度打ち', kind: 'atk', min: 2, max: 2, dmg: [5], hits: 2 },
  nagi:      { name: 'なぎ払い', kind: 'atk', min: 2, max: 3, dmg: [5, 9], all: true },
  daijodan:  { name: '大上段', kind: 'atk', min: 4, max: 4, dmg: [28] },
  kaeshi:    { name: '返し刀', kind: 'atk', min: 1, max: 1, dmg: [3], guard: [3] },
  sutemi:    { name: '捨て身', kind: 'atk', min: 2, max: 2, dmg: [17], self: 3 },
  todome:    { name: 'とどめ', kind: 'atk', min: 1, max: 1, dmg: [6], exec: 6 },
  kuzushi:   { name: 'くずしの一撃', kind: 'atk', min: 2, max: 2, dmg: [7], crush: 3 },
  hayawaza:  { name: '早業', kind: 'atk', min: 0, max: 0, dmg: [3] },
  hyoshigi:  { name: '拍子木', kind: 'atk', min: 1, max: 1, dmg: [3], all: true, guard: [2] },
  oharai:    { name: 'お祓い', kind: 'atk', min: 2, max: 2, dmg: [9], strip: true },
  hinoko:    { name: '火の粉', kind: 'fire', min: 1, max: 2, burn: [3, 6] },
  abura:     { name: '油をまく', kind: 'fire', min: 2, max: 2, burn: [3], all: true },
  oibi:      { name: '追い火', kind: 'fire', min: 1, max: 1, dmg: [2], byBurn: 2 },
  hidaruma:  { name: '火だるま', kind: 'fire', min: 3, max: 3, burn: [10] },
  migamae:   { name: '身がまえ', kind: 'def', min: 1, max: 3, guard: [6, 13, 21] },
  mikiri:    { name: '見切り', kind: 'def', min: 1, max: 1, ward: 1 },
  yanagi:    { name: '柳に風', kind: 'def', min: 2, max: 2, guard: [8], counter: 6 },
  jizo:      { name: '石地蔵', kind: 'def', min: 3, max: 3, guard: [25] },
  shio:      { name: '塩をまく', kind: 'def', min: 1, max: 1, guard: [3], cleanse: true },
  migawari:  { name: '身代わり札', kind: 'def', min: 0, max: 0, ward: 1, once: true },
  fuda:      { name: '札を貼る', kind: 'waza', min: 1, max: 2, delay: [2, 3] },
  suzu:      { name: '鈴を鳴らす', kind: 'waza', min: 1, max: 1, delay: [1], all: true },
  kanashibari: { name: '金しばり', kind: 'waza', min: 2, max: 2, dmg: [4], delay: [3] },
  hitoiki:   { name: '一息', kind: 'waza', min: 2, max: 2, heal: [6], once: true },
  kiai:      { name: '気合', kind: 'waza', min: 1, max: 1, power: [6] },
  sente:     { name: '先手', kind: 'waza', min: 0, max: 0, quick: 1, draw: 1 },
  yonabe:    { name: '夜なべ', kind: 'waza', min: 3, max: 3, guard: [8], draw: 2 },
};
const CARD_IDS = Object.keys(CARDS);
// いつでも使える 2 つの構え(札ではない)。値は夜回りごとに違う
const BASIC = { utsu: { name: '打つ', kind: 'atk', min: 1, max: 3 }, ukeru: { name: '受ける', kind: 'def', min: 1, max: 3 } };

const NUM = ['dmg', 'guard', 'burn', 'heal', 'power'];
// 札の id('kiru' または きたえた 'kiru+')から、実際の値を引く
function getCard(id) {
  const plus = id.endsWith('+'), base = CARDS[plus ? id.slice(0, -1) : id];
  if (!base) throw new Error('知らない札: ' + id);
  if (!plus) return { id, ...base };
  const c = { id, ...base, name: base.name + '+' };
  let grew = false;
  for (const k of NUM) if (c[k]) { c[k] = c[k].map((v) => Math.ceil(v * 1.35)); grew = true; }
  if (c.delay) { c.delay = c.delay.map((v) => v + 1); grew = true; }
  if (c.counter) c.counter += 3;
  if (c.exec) c.exec += 3;
  if (!grew) { if (c.ward) c.ward += 1; if (c.draw) c.draw += 1; }
  return c;
}
const canUpgrade = (id) => !id.endsWith('+');

// ---- おまもり -----------------------------------------------------------------
const RELICS = {
  hiuchi:   { name: '火打ち石', text: '戦いの始めに、化け物みんなにやけど 3' },
  tokei:    { name: 'こわれた懐中時計', text: '戦いの最初の行動は、針が進まない' },
  suzu:     { name: '魔よけの鈴', text: 'かまえを崩すたび、体力 3 回復' },
  hanten:   { name: '厚い半纏', text: '「受ける」の守り +2' },
  toishi:   { name: '研ぎ石', text: '「打つ」のダメージ +2' },
  ningyo:   { name: '身代わり人形', text: '一夜に 1 度だけ、倒れるところを体力 1 でこらえる' },
  yakogai:  { name: '夜光貝', text: '3 刻以上の行動をするたび、そのあいだ守り 4' },
  juzu:     { name: '数珠', text: 'のろいを受けない' },
  hoshigaki: { name: '干し柿', text: '戦いに勝つたび、体力 4 回復' },
  oni:      { name: '鬼の面', text: '体力が半分以下のとき、攻撃のダメージ +3' },
  fudabako: { name: '札箱', text: '手札の上限 +1' },
  hane:     { name: '朝告げ鳥の羽', text: '丑三つ時の夜明けが 4 刻早く来る' },
  maneki:   { name: 'まねき猫', text: '手に入る銭 +30%' },
  omamori:  { name: '古いお守り', text: '戦いの始めに、見切り 1' },
  himo:     { name: '赤いひも', text: '1 刻の行動のあと、次の攻撃 +2' },
  kane:     { name: '割れ鐘', text: '化け物の最初の印が 2 刻おそくなる' },
};
const RELIC_IDS = Object.keys(RELICS);

// ---- 化け物 -------------------------------------------------------------------
// pat: 行動の並び(くり返す)。w = その行動までの刻。poise = かまえ(それだけ削ると行動をつぶせる)
//   dmg(×x 回)/ curse のろい / slow 砂(次の行動 +1 刻)/ steal 札を落とす / armor かたさ / up 攻撃上げ / heal 回復 / summon 仲間を呼ぶ
const FOES = {
  chochin:   { name: '提灯お化け', hp: 32, pat: [{ n: '火をふく', dmg: 5, w: 3 }, { n: '火をふく', dmg: 5, w: 3 }, { n: '大あくび', dmg: 12, w: 5, poise: 7 }] },
  kasa:      { name: 'からかさ', hp: 26, pat: [{ n: 'けとばす', dmg: 4, w: 3 }, { n: 'けとばす', dmg: 4, w: 3 }, { n: 'はねまわる', dmg: 2, x: 3, w: 3 }] },
  kooni:     { name: '小鬼', hp: 16, pat: [{ n: 'ひっかく', dmg: 3, w: 3 }] },
  hitotsume: { name: '一つ目小僧', hp: 38, pat: [{ n: 'にらむ', curse: 3, w: 3 }, { n: 'なぐる', dmg: 7, w: 3 }] },
  nopperabo: { name: 'のっぺらぼう', hp: 40, pat: [{ n: '顔をかくす', armor: 3, w: 2 }, { n: 'なぐる', dmg: 8, w: 4 }] },
  kappa:     { name: '河童', hp: 56, pat: [{ n: '水をかける', dmg: 5, w: 2 }, { n: 'すもう', dmg: 15, w: 5, poise: 9 }] },
  sunakake:  { name: '砂かけ婆', hp: 44, pat: [{ n: '砂をかける', dmg: 2, slow: 1, w: 3 }, { n: 'つえでたたく', dmg: 7, w: 3 }] },
  rokuro:    { name: 'ろくろ首', hp: 68, pat: [{ n: '巻きつく', dmg: 6, steal: 1, w: 3 }, { n: '首をのばす', dmg: 17, w: 6, poise: 11 }] },
  yukionna:  { name: '雪女', hp: 72, pat: [{ n: '冷たい息', dmg: 8, w: 4 }, { n: '吹雪', dmg: 3, x: 4, w: 5 }, { n: 'こおらせる', slow: 1, curse: 2, w: 3 }] },
  kamaitachi: { name: '鎌いたち', hp: 20, pat: [{ n: '切りつける', dmg: 4, w: 3 }] },
  // 手ごわい相手
  nurikabe:  { name: 'ぬりかべ', hp: 100, pat: [{ n: 'かたくなる', armor: 4, w: 3 }, { n: 'たおれこむ', dmg: 20, w: 6, poise: 14 }, { n: 'おしつぶす', dmg: 9, w: 3 }] },
  kasha:     { name: '火車', hp: 88, pat: [{ n: '火の輪', dmg: 6, x: 2, w: 3 }, { n: 'いきおいづく', up: 2, w: 2 }, { n: 'ひきずる', dmg: 14, w: 5, poise: 10 }] },
  mukade:    { name: '大百足', hp: 80, pat: [{ n: 'かみつく', dmg: 5, curse: 2, w: 2 }, { n: '百の足', dmg: 2, x: 6, w: 4 }, { n: '毒の牙', dmg: 8, curse: 4, w: 4, poise: 9 }] },
  // 真夜中の主
  ogama:     { name: '大がま', hp: 95, pat: [{ n: '舌をのばす', dmg: 8, steal: 1, w: 3 }, { n: '毒のあわ', dmg: 3, curse: 4, w: 3 }, { n: 'とびのる', dmg: 20, w: 6, poise: 14 }, { n: 'ふくらむ', armor: 4, heal: 6, w: 2 }] },
  tsuchigumo: { name: '土ぐも', hp: 80, pat: [{ n: '子を呼ぶ', summon: 'kogumo', w: 3 }, { n: '糸をはく', dmg: 5, slow: 1, w: 3 }, { n: 'かみくだく', dmg: 16, w: 5, poise: 11 }] },
  kogumo:    { name: '子ぐも', hp: 12, minion: true, pat: [{ n: 'かむ', dmg: 3, w: 2 }] },
  // 丑三つ時に来るもの(それぞれ、戦いの決まりを 1 つ変える)
  gasha:     { name: 'がしゃどくろ', hp: 145, rule: '手を倒しても、骨を集めてまた生やす', pat: [{ n: '骨を集める', summon: 'gashate', w: 3 }, { n: 'にぎりつぶす', dmg: 24, w: 7, poise: 18 }, { n: '歯を鳴らす', dmg: 6, curse: 3, w: 3 }] },
  gashate:   { name: 'どくろの手', hp: 34, minion: true, pat: [{ n: 'なぎはらう', dmg: 6, w: 2 }] },
  ushioni:   { name: '牛鬼', hp: 140, rule: '毒の息: 3 刻ごとに 2 ダメージ(守りでは防げない)', aura: { every: 3, dmg: 2 }, pat: [{ n: 'つので突く', dmg: 10, w: 3 }, { n: '毒をはく', dmg: 4, curse: 5, w: 3 }, { n: 'ふみつぶす', dmg: 26, w: 7, poise: 18 }] },
  onyudo:    { name: '大入道', hp: 165, rule: '動くたびに、攻撃が 2 ずつ上がる', grow: 2, pat: [{ n: 'ふみつける', dmg: 7, w: 3 }, { n: '見おろす', dmg: 4, slow: 1, w: 2 }, { n: '張り手', dmg: 12, w: 4, poise: 12 }] },
};
const ENCOUNTERS = {
  easy: [['chochin'], ['kasa', 'kooni'], ['hitotsume'], ['kooni', 'kooni'], ['nopperabo'], ['kasa', 'chochin']],
  hard: [['kappa', 'kooni'], ['sunakake', 'kasa'], ['rokuro'], ['yukionna'], ['kamaitachi', 'kamaitachi', 'kamaitachi'], ['nopperabo', 'hitotsume']],
  elite: [['nurikabe'], ['kasha'], ['mukade']],
  mid: [['ogama'], ['tsuchigumo']],
  boss: [['gasha'], ['ushioni'], ['onyudo']],
};

const DIFFS = {

// うしみつ時計: 戦いの決まり。依存は data.js だけ。乱数は盤面の中の種だけ(同じ手順なら同じ結果)。
//
// 核になる決まり:
//   - 行動は「何をするか」と「針を何刻回すか」で決める。回した刻だけ時間が進む
//   - 攻めは、回し終わった刻に当たる。同じ刻なら、あなたが先
//   - 守りは、回しているあいだだけ効く
//   - 化け物は、時計に置かれた印の刻が来ると動く(印は必ず見えている)
//   - 「かまえ」のある大技は、印の刻までにその数だけ削るとつぶせる


const HAND_MAX = 3;     // 手札の上限
const DRAW_EVERY = 2;   // 何刻ごとに札を 1 枚引くか
const CLOCK = 12;       // 時計の 1 周
const LOW_HP = 0.3;     // 火事場: これ以下で守りが 1.5 倍
const DELAY_ONCE = true; // 同じ印は 1 回しかおくらせられない
const LAP_UP = 2;        // 時計がひと回りするたび、化け物の攻撃がこれだけ上がる(長引かせても得をしない)

function rnd(s) { // mulberry32。種は s.rng(整数)
  s.rng = (s.rng + 0x6D2B79F5) >>> 0; let t = s.rng;
  t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const pick = (s, n) => Math.floor(rnd(s) * n);
function shuffle(s, a) { for (let i = a.length - 1; i > 0; i--) { const j = pick(s, i + 1); const x = a[i]; a[i] = a[j]; a[j] = x; } return a; }
const cloneState = (s) => JSON.parse(JSON.stringify(s));
function hashState(s) { // FNV-1a
  const str = JSON.stringify(s); let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return h.toString(16);
}

const has = (b, id) => b.relics.includes(id);
const alive = (b) => b.foes.filter((f) => !f.dead);
const fdmg = (b, v) => Math.max(1, Math.round(v * b.mul.dmg));
const handMax = (b) => HAND_MAX + (has(b, 'fudabako') ? 1 : 0);
const lowHp = (b) => b.hp <= Math.floor(b.maxHp * LOW_HP);

function schedule(b, f, extra) {
  const pat = FOES[f.kind].pat, ai = f.pi % pat.length, act = pat[ai];
  f.mark = { at: b.t + act.w + (extra || 0), ai, poise: act.poise ? Math.max(1, Math.round(act.poise * b.mul.hp)) : 0, dealt: 0, delayed: false };
  f.pi++;
}
function addFoe(b, kind, extra) {
  const d = FOES[kind], hp = Math.max(1, Math.round(d.hp * b.mul.hp));
  const f = { id: b.nextId++, kind, name: d.name, hp, maxHp: hp, armor: 0, burn: 0, up: 0, pi: 0, core: !d.minion, dead: false, broken: false, mark: null };
  b.foes.push(f); schedule(b, f, extra); return f;
}

// hero: { char(CHARS の 1 つ), hp, maxHp, deck:[札 id], relics:[id], dollUsed }
function newBattle({ seed, hero, foes, mul, dawn }) {
  const b = {
    rng: (seed >>> 0) || 1, t: 0, char: hero.char.id, utsu: hero.char.utsu.slice(), ukeru: hero.char.ukeru.slice(),
    hp: hero.hp, maxHp: hero.maxHp, relics: hero.relics.slice(), dollUsed: !!hero.dollUsed,
    guard: 0, guardUntil: -1, ward: 0, power: 0, curse: 0, slow: 0, quick: 0, first: true,
    draw: [], hand: [], disc: [], gone: [], foes: [], nextId: 0, mul: { hp: mul ? mul.hp : 1, dmg: mul ? mul.dmg : 1 },
    dawn: dawn ? dawn - (hero.relics.includes('hane') ? 4 : 0) : 0, aura: null, over: null,
    stats: { dealt: 0, taken: 0, breaks: 0, acts: 0, kills: 0 },
  };
  if (has(b, 'toishi')) b.utsu = b.utsu.map((v) => v + 2);
  if (has(b, 'hanten')) b.ukeru = b.ukeru.map((v) => v + 2);
  foes.forEach((kind, i) => { const f = addFoe(b, kind, i + (has(b, 'kane') ? 2 : 0)); if (has(b, 'hiuchi')) f.burn = 3; if (FOES[kind].aura) b.aura = { ...FOES[kind].aura }; });
  if (has(b, 'omamori')) b.ward = 1;
  b.draw = shuffle(b, hero.deck.slice());
  drawCards(b, handMax(b), null);
  return b;
}

function drawCards(b, n, ev) {
  for (let i = 0; i < n; i++) {
    if (b.hand.length >= handMax(b)) return;
    if (!b.draw.length) { if (!b.disc.length) return; b.draw = shuffle(b, b.disc); b.disc = []; }
    const id = b.draw.pop(); b.hand.push(id); if (ev) ev.push({ e: 'draw', id });
  }
}

// いま選べる行動の中身。a は 'utsu' / 'ukeru' / 手札の番号
function specOf(b, a) {
  if (a === 'utsu') return { id: 'utsu', ...BASIC.utsu, dmg: b.utsu };
  if (a === 'ukeru') return { id: 'ukeru', ...BASIC.ukeru, guard: b.ukeru };
  const id = b.hand[a]; return id ? getCard(id) : null;
}
const needsTarget = (sp) => !sp.all && !!(sp.dmg || sp.burn || sp.delay || sp.byBurn);
// 実際に進む刻(砂・先手・懐中時計をふくむ)
function costOf(b, k) { if (b.first && has(b, 'tokei')) return 0; return Math.max(0, k + b.slow - b.quick); }
const at = (arr, sp, k) => arr[Math.min(arr.length - 1, k - sp.min)];
const guardOf = (b, sp, k) => (sp.guard ? Math.floor(at(sp.guard, sp, k) * (lowHp(b) ? 1.5 : 1)) : 0) + (k >= 3 && has(b, 'yakogai') ? 4 : 0);

function whyNot(b, o) {
  if (b.over) return '戦いは終わっています';
  const sp = specOf(b, o.a); if (!sp) return 'その札はありません';
  if (!(o.k >= sp.min && o.k <= sp.max)) return sp.name + ' は ' + (sp.min === sp.max ? sp.min : sp.min + '〜' + sp.max) + ' 刻です';
  if (needsTarget(sp)) { const f = b.foes.find((x) => x.id === o.target); if (!f || f.dead) return '相手を選んでください'; }
  return null;
}

function kill(b, f, ev) {
  f.dead = true; f.hp = 0; f.mark = null; b.stats.kills++; ev.push({ e: 'kill', id: f.id });
  if (!b.foes.some((x) => x.core && !x.dead)) { b.over = 'win'; ev.push({ e: 'over', r: 'win' }); }
}
function breakFoe(b, f, ev) {
  f.broken = true; b.stats.breaks++; ev.push({ e: 'break', id: f.id });
  schedule(b, f, 2 + (b.char === 'suzu' ? 2 : 0)); // つぶされた行動は飛ばして、次の行動へ(2 刻ひるむ)
  let heal = (has(b, 'suzu') ? 3 : 0) + (b.char === 'suzu' ? 3 : 0);
  if (heal) { heal = Math.min(heal, b.maxHp - b.hp); b.hp += heal; if (heal) ev.push({ e: 'heal', v: heal }); }
}
function hurtFoe(b, f, d, crush, ev, why) { // d は、かたさを引いたあとの値
  if (f.dead) return;
  f.hp -= d; b.stats.dealt += d; ev.push({ e: why, id: f.id, v: d });
  if (f.hp <= 0) return kill(b, f, ev);
  if (f.mark && f.mark.poise) { f.mark.dealt += d * crush; if (f.mark.dealt >= f.mark.poise) breakFoe(b, f, ev); }
}
function hurtHero(b, d, ev, why) { // 守りで防げないダメージ
  b.hp -= d; b.stats.taken += d; ev.push({ e: why, v: d });
  if (b.hp <= 0) {
    if (has(b, 'ningyo') && !b.dollUsed) { b.hp = 1; b.dollUsed = true; ev.push({ e: 'doll' }); }
    else { b.hp = 0; b.over = 'lose'; ev.push({ e: 'over', r: 'lose' }); }
  }
}
function hitHero(b, d, ev, from) {
  if (b.ward > 0) { b.ward--; ev.push({ e: 'ward', id: from }); return; }
  let blocked = 0;
  if (b.guard > 0 && b.t <= b.guardUntil) { blocked = Math.min(b.guard, d); b.guard -= blocked; d -= blocked; }
  if (blocked) ev.push({ e: 'block', v: blocked, id: from });
  if (d > 0) hurtHero(b, d, ev, 'hit');
}

function foeAct(b, f, ev) {
  const act = FOES[f.kind].pat[f.mark.ai]; f.mark = null; f.armor = 0; f.broken = false;
  ev.push({ e: 'foe', id: f.id, n: act.n });
  if (act.dmg) {
    const d = Math.max(0, fdmg(b, act.dmg) + f.up - (b.char === 'tomo' && f.burn > 0 ? 2 : 0));
    for (let i = 0; i < (act.x || 1) && !b.over; i++) hitHero(b, d, ev, f.id);
  }
  if (b.over) return;
  if (act.curse && !has(b, 'juzu')) { b.curse += act.curse; ev.push({ e: 'cursed', v: act.curse }); }
  if (act.slow) { b.slow = 1; ev.push({ e: 'slowed' }); }
  if (act.steal && b.hand.length) { const i = pick(b, b.hand.length); const id = b.hand.splice(i, 1)[0]; b.disc.push(id); ev.push({ e: 'steal', card: id }); }
  if (act.armor) f.armor += act.armor;
  if (act.up) f.up += act.up;
  if (act.heal) f.hp = Math.min(f.maxHp, f.hp + Math.round(act.heal * b.mul.hp));
  if (act.summon && alive(b).length < 3) { const n = addFoe(b, act.summon, 0); ev.push({ e: 'summon', id: n.id }); }
  if (FOES[f.kind].grow) f.up += FOES[f.kind].grow;
  schedule(b, f, 0);
}

// 行動が当たる(回し終わった刻)
function land(b, sp, k, target, ev) {
  const tg = sp.all ? alive(b) : b.foes.filter((f) => f.id === target && !f.dead);
  if (sp.dmg) {
    const bonus = b.power + (has(b, 'oni') && b.hp * 2 <= b.maxHp ? 3 : 0); b.power = 0;
    for (let h = 0; h < (sp.hits || 1); h++) for (const f of tg) {
      if (f.dead) continue;
      if (sp.strip) f.armor = 0;
      let d = at(sp.dmg, sp, k) + bonus + (sp.byBurn ? f.burn * sp.byBurn : 0) + (sp.exec && f.hp * 2 <= f.maxHp ? sp.exec : 0);
      d = Math.max(0, d - f.armor);
      hurtFoe(b, f, d, sp.crush || 1, ev, 'dmg');
    }
  }
  if (sp.self) { const d = Math.min(sp.self, b.hp - 1); if (d > 0) { b.hp -= d; ev.push({ e: 'self', v: d }); } } // 捨て身では倒れない
  if (sp.burn) for (const f of tg) if (!f.dead) { f.burn += at(sp.burn, sp, k); ev.push({ e: 'burned', id: f.id, v: at(sp.burn, sp, k) }); }
  if (sp.delay) for (const f of tg) if (!f.dead && f.mark && !(DELAY_ONCE && f.mark.delayed)) { f.mark.at += at(sp.delay, sp, k); f.mark.delayed = true; ev.push({ e: 'delay', id: f.id, v: at(sp.delay, sp, k) }); }
  if (sp.heal) { const v = Math.min(at(sp.heal, sp, k), b.maxHp - b.hp); b.hp += v; ev.push({ e: 'heal', v }); }
  if (sp.power) b.power += at(sp.power, sp, k);
  if (sp.cleanse) { b.curse = 0; b.slow = 0; }
  if (sp.quick) b.quick += sp.quick;
  if (sp.draw) drawCards(b, sp.draw, ev);
}

function tick(b, landing, ev) {
  b.t++; ev.push({ e: 'tick', t: b.t });
  for (const f of b.foes) if (!f.dead && f.burn > 0) { const d = f.burn; f.burn--; hurtFoe(b, f, d, 1, ev, 'burn'); if (b.over) return; }
  if (b.curse > 0) { b.curse--; hurtHero(b, 1, ev, 'curse'); if (b.over) return; }
  if (b.aura && b.t % b.aura.every === 0) { hurtHero(b, fdmg(b, b.aura.dmg), ev, 'aura'); if (b.over) return; }
  if (landing) { landing(); if (b.over) return; }
  for (const f of b.foes.slice()) if (!f.dead && f.mark && f.mark.at <= b.t) { foeAct(b, f, ev); if (b.over) return; }
  if (b.t % DRAW_EVERY === 0) drawCards(b, 1, ev);
  if (b.t % CLOCK === 0) { for (const f of b.foes) if (!f.dead) f.up += LAP_UP; ev.push({ e: 'lap', v: LAP_UP }); }
  if (b.dawn && b.t >= b.dawn) { b.over = 'dawn'; ev.push({ e: 'over', r: 'dawn' }); }
}

// 行動する。o = { a: 'utsu' | 'ukeru' | 手札の番号, k: 回す刻, target: 相手の id }
// 返り値 { ok, why, events }。events は起きた順(画面の再生用)
function act(b, o) {
  const why = whyNot(b, o); if (why) return { ok: false, why, events: [] };
  const sp = specOf(b, o.a), k = o.k, ev = [], cost = costOf(b, k);
  b.first = false; b.slow = 0; b.quick = 0; b.stats.acts++;
  if (typeof o.a === 'number') { const id = b.hand.splice(o.a, 1)[0]; (sp.once ? b.gone : b.disc).push(id); }
  ev.push({ e: 'act', name: sp.name, k, cost });
  const g = guardOf(b, sp, k);
  if (g) { if (b.t > b.guardUntil) b.guard = 0; b.guard += g; b.guardUntil = Math.max(b.guardUntil, b.t + Math.max(k, cost)); ev.push({ e: 'guard', v: g }); }
  if (sp.ward) b.ward += sp.ward;
  const hp0 = b.hp;
  const doLand = () => land(b, sp, k, o.target, ev);
  if (cost === 0) doLand();
  for (let i = 1; i <= cost && !b.over; i++) tick(b, i === cost ? doLand : null, ev);
  if (!b.over) {
    if (sp.counter && b.hp >= hp0) { b.power += sp.counter; ev.push({ e: 'counter', v: sp.counter }); }
    if (k === 1 && has(b, 'himo')) b.power += 2;
    if (b.guardUntil <= b.t) b.guard = 0; // 回し終わったら守りは消える
  }
  return { ok: true, events: ev };
}

// 行動する前の見通し(盤面は変えない)。運は入らないので、見えた通りになる
function preview(b, o) {
  const c = cloneState(b), r = act(c, o);
  if (!r.ok) return { ok: false, why: r.why };
  return {
    ok: true, cost: c.t - b.t, hp: c.hp, hpLost: Math.max(0, b.hp - c.hp), over: c.over,
    foes: b.foes.filter((f) => !f.dead).map((f) => { const n = c.foes.find((x) => x.id === f.id); return { id: f.id, hp: n.hp, lost: f.hp - n.hp, dead: n.dead, broke: r.events.some((e) => e.e === 'break' && e.id === f.id) }; }),
    fired: r.events.filter((e) => e.e === 'foe').length, blocked: r.events.filter((e) => e.e === 'block').reduce((a, e) => a + e.v, 0), events: r.events,
  };
}

// 化け物の次の行動(画面の予告用)。数字は、いまの状態で実際に出る値
function intent(b, f) {
  if (!f.mark) return null;
  const a = FOES[f.kind].pat[f.mark.ai], parts = [];
  if (a.dmg) { const d = Math.max(0, fdmg(b, a.dmg) + f.up - (b.char === 'tomo' && f.burn > 0 ? 2 : 0)); parts.push(a.x ? d + '×' + a.x : '' + d); }
  if (a.curse) parts.push('のろい ' + a.curse);
  if (a.slow) parts.push('砂');
  if (a.steal) parts.push('札を落とす');
  if (a.armor) parts.push('かたさ ' + a.armor);
  if (a.up) parts.push('攻撃 +' + a.up);
  if (a.heal) parts.push('回復');
  if (a.summon) parts.push(FOES[a.summon].name + 'を呼ぶ');
  return { at: f.mark.at, in: f.mark.at - b.t, name: a.n, text: parts.join('・'), dmg: a.dmg ? Math.max(0, fdmg(b, a.dmg) + f.up - (b.char === 'tomo' && f.burn > 0 ? 2 : 0)) * (a.x || 1) : 0,
    poise: f.mark.poise, poiseLeft: f.mark.poise ? Math.max(0, f.mark.poise - f.mark.dealt) : 0, delayed: f.mark.delayed };
}

// 札の説明(値から作るので、文と効果がずれない)。k を渡すとその刻の値、渡さなければ全部
function describe(sp, k, b) {
  const v = (arr) => (k !== undefined ? at(arr, sp, k) : arr.length > 1 ? arr.join(' / ') : arr[0]);
  const p = [];
  if (sp.dmg) p.push((sp.all ? '全員に ' : '') + v(sp.dmg) + (sp.hits ? '×' + sp.hits : '') + ' ダメージ');
  if (sp.byBurn) p.push('相手のやけどの ' + sp.byBurn + ' 倍を上乗せ');
  if (sp.exec) p.push('体力が半分以下の相手には +' + sp.exec);
  if (sp.crush) p.push('かまえには ' + sp.crush + ' 倍効く');
  if (sp.strip) p.push('かたさを消してから当てる');
  if (sp.self) p.push('自分も ' + sp.self + ' ダメージ');
  if (sp.guard) p.push('守り ' + (b && k !== undefined ? guardOf(b, sp, k) : v(sp.guard)));
  if (sp.ward) p.push('次の攻撃を ' + sp.ward + ' 回かわす');
  if (sp.counter) p.push('無傷で受けきると次の攻撃 +' + sp.counter);
  if (sp.burn) p.push((sp.all ? '全員に' : '') + 'やけど ' + v(sp.burn));
  if (sp.delay) p.push((sp.all ? '全員の' : '') + '印を ' + v(sp.delay) + ' 刻おくらせる');
  if (sp.heal) p.push('体力 ' + v(sp.heal) + ' 回復');
  if (sp.power) p.push('次の攻撃 +' + v(sp.power));
  if (sp.cleanse) p.push('のろいと砂を消す');
  if (sp.quick) p.push('次の行動が ' + sp.quick + ' 刻みじかい');
  if (sp.draw) p.push('札を ' + sp.draw + ' 枚引く');
  if (sp.once) p.push('1 度きり');
  return p.join('、');
}
const ticksText = (sp) => (sp.min === sp.max ? sp.min + ' 刻' : sp.min + '〜' + sp.max + ' 刻');

// うしみつ時計: 文章だけを集めた表(決まりは入っていない)。
// 物語工房などで書き直すときは、このファイルの文だけを差し替えればよい(id・eff・need は変えない)。

const HOURS = ['暮れ六つ', '宵五つ', '夜四つ', '四つ半', '真夜九つ', '九つ半', '夜八つ', '丑の刻', '丑三つ時'];
const HOUR_LINES = [
  '日が落ちた。町の戸が、ひとつずつ閉まっていく。',

];
const INTRO = {

};

function newRun({ seed, char, diff }) {

  const evs = shuffle(r, EVENTS.map((e, i) => i));

}

  const likes = charOf(r).likes, bag = [];
  for (const id of CARD_IDS) for (let i = 0; i < (likes.includes(CARDS[id].kind) ? 3 : 1); i++) bag.push(id);
  const out = [];
  while (out.length < n) { const id = bag[pick(r, bag.length)]; if (!out.includes(id)) out.push(id); }
  return out;
}

// 道を選ぶ
function choose(r, i) {

  const node = r.nodes[r.step][i]; if (!node) return { ok: false, why: 'その道はありません' };
  r.node = { ...node, i };
  if (FIGHT.includes(node.type)) {
    r.battle = newBattle({ seed: (r.seed + r.step * 7919 + 1) >>> 0, hero: { char: charOf(r), hp: r.hp, maxHp: r.maxHp, deck: r.deck, relics: r.relics, dollUsed: r.dollUsed },
      foes: node.foes, mul: DIFFS[r.diff], dawn: node.type === 'boss' ? DAWN : 0 });
    r.phase = 'battle';
  } else if (node.type === 'event') { r.event = node.event; r.phase = 'event'; }
  else if (node.type === 'shop') {
    r.shop = { cards: rollCards(r, 3).map((id) => ({ id, sold: false })), relics: rollRelics(r, 2).map((id) => ({ id, sold: false })), healSold: false, removeSold: false };
    r.phase = 'shop';
  } else r.phase = 'rest';
  return { ok: true };
}
function advance(r) { r.step++; r.node = null; r.battle = null; r.reward = null; r.shop = null; r.event = null; r.phase = 'map'; }

// 戦いの 1 手。戦いが終わったら、ごほうび(または結末)へ進む
function fight(r, o) {
  if (r.phase !== 'battle') return { ok: false, why: 'いまは戦いではありません', events: [] };
  const res = act(r.battle, o); if (!res.ok || !r.battle.over) return res;
  const b = r.battle, type = r.node.type;
  r.hp = b.hp; r.dollUsed = b.dollUsed; r.stats.fights++; r.stats.dealt += b.stats.dealt; r.stats.taken += b.stats.taken; r.stats.breaks += b.stats.breaks; r.stats.ticks += b.t;
  if (b.over === 'lose') { r.phase = 'over'; r.result = { win: false, how: 'dead', step: r.step }; return res; }
  if (type === 'boss') { r.phase = 'over'; r.result = { win: true, how: b.over === 'dawn' ? 'dawn' : 'slain', step: r.step, ticks: b.t }; return res; }
  const healed = (r.relics.includes('hoshigaki') ? heal(r, 4) : 0) + (type === 'mid' ? heal(r, Math.ceil(r.maxHp * 0.3)) : 0);
  const zeni = Math.round(ZENI[type] * (r.relics.includes('maneki') ? 1.3 : 1)); r.zeni += zeni;
  const nRel = type === 'elite' ? 2 : type === 'mid' ? 3 : 0;
  r.reward = { zeni, healed, relics: nRel ? rollRelics(r, nRel) : null, cards: rollCards(r, 3) };
  if (r.reward.relics && !r.reward.relics.length) r.reward.relics = null;
  r.phase = 'reward';
  return res;
}
function takeRelic(r, i) {
  if (r.phase !== 'reward' || !r.reward.relics) return { ok: false, why: 'いまは選べません' };
  const id = r.reward.relics[i]; if (!id) return { ok: false, why: 'そのおまもりはありません' };
  r.relics.push(id); r.reward.relics = null; if (!r.reward.cards) advance(r); return { ok: true, id };
}
function takeCard(r, i) { // i = -1 で「もらわない」
  if (r.phase !== 'reward' || !r.reward.cards) return { ok: false, why: 'いまは選べません' };
  if (r.reward.relics) return { ok: false, why: '先におまもりを選んでください' };
  if (i >= 0) { const id = r.reward.cards[i]; if (!id) return { ok: false, why: 'その札はありません' }; r.deck.push(id); }
  r.reward.cards = null; advance(r); return { ok: true };

// 店。kind = 'card' | 'relic' | 'heal' | 'remove'。remove は手放す札の番号(deck の中の位置)を idx に渡す
function buy(r, kind, idx) {
  if (r.phase !== 'shop') return { ok: false, why: 'いまは店ではありません' };
  const price = PRICE[kind]; if (!price) return { ok: false, why: 'それは売っていません' };
  if (r.zeni < price) return { ok: false, why: '銭がたりません(' + price + ')' };
  const s = r.shop;
  if (kind === 'card' || kind === 'relic') {
    const it = s[kind + 's'][idx]; if (!it || it.sold) return { ok: false, why: '売り切れです' };
    it.sold = true; (kind === 'card' ? r.deck : r.relics).push(it.id);
  } else if (kind === 'heal') {
    if (s.healSold) return { ok: false, why: '売り切れです' }; if (r.hp >= r.maxHp) return { ok: false, why: '体力は満タンです' };
    s.healSold = true; heal(r, SHOP_HEAL);
  } else {
    if (s.removeSold) return { ok: false, why: '1 回だけです' }; if (r.deck.length <= 5) return { ok: false, why: '札は 5 枚より減らせません' };
    if (!(idx >= 0 && idx < r.deck.length)) return { ok: false, why: '手放す札を選んでください' };
    s.removeSold = true; r.deck.splice(idx, 1);
  }
  r.zeni -= price; return { ok: true };
}
function leave(r) { if (r.phase !== 'shop') return { ok: false, why: 'いまは店ではありません' }; advance(r); return { ok: true }; }

// 茶屋。how = 'heal'(体力を 3 割回復)| 'up'(札を 1 枚きたえる。idx = deck の中の位置)
function rest(r, how, idx) {
  if (r.phase !== 'rest') return { ok: false, why: 'いまは茶屋ではありません' };
  if (how === 'heal') { const v = heal(r, Math.ceil(r.maxHp * REST_HEAL)); advance(r); return { ok: true, healed: v }; }
  if (how === 'up') {
    const id = r.deck[idx]; if (!id || !canUpgrade(id)) return { ok: false, why: 'きたえる札を選んでください' };
    r.deck[idx] = id + '+'; advance(r); return { ok: true, id: id + '+' };
  }
  return { ok: false, why: '休むか、きたえるかを選んでください' };
}

// 出来事。ch = 'a' | 'b'。返り値の notes は、実際に起きたこと(画面に出す)
function canAnswer(r, ch) { const o = EVENTS[r.event][ch]; return !(o.need && o.need.zeni > r.zeni); }
function answer(r, ch) {
  if (r.phase !== 'event') return { ok: false, why: 'いまは出来事ではありません' };
  const ev = EVENTS[r.event], o = ev[ch]; if (!o) return { ok: false, why: 'a か b を選んでください' };
  if (!canAnswer(r, ch)) return { ok: false, why: '銭がたりません' };
  const e = o.eff, notes = [];
  if (e.zeni) { r.zeni = Math.max(0, r.zeni + e.zeni); notes.push('銭 ' + (e.zeni > 0 ? '+' : '') + e.zeni); }
  if (e.maxHp) { r.maxHp += e.maxHp; r.hp += e.maxHp; notes.push('体力の上限 +' + e.maxHp); }
  if (e.hp > 0) notes.push('体力 +' + heal(r, e.hp));
  if (e.hp < 0) { const d = Math.min(-e.hp, r.hp - 1); r.hp -= d; notes.push('体力 -' + d); } // 出来事では倒れない
  if (e.card) { r.deck.push(e.card); notes.push('札「' + CARDS[e.card].name + '」を得た'); }
  if (e.relic) { const id = rollRelics(r, 1)[0]; if (id) { r.relics.push(id); notes.push('おまもりを得た'); r.lastRelic = id; } else { r.zeni += 20; notes.push('銭 +20'); } }
  if (e.upgrade) { const ok = r.deck.map((id, i) => (canUpgrade(id) ? i : -1)).filter((i) => i >= 0); if (ok.length) { const i = ok[pick(r, ok.length)]; r.deck[i] += '+'; notes.push('札「' + CARDS[r.deck[i].slice(0, -1)].name + '」がきたえられた'); } }

  advance(r);

}

  }
  const optLabel = (n) => TYPE_JA[n.type] + (n.foes ? ': ' + n.foes.map((k) => FOES[k].name).join('・') : '');
  const optText = (n) => (n.type === 'event' ? '何かが起きる。2 つから選ぶ' : n.type === 'shop' ? '札・おまもり・手当て(銭 ' + run.zeni + ')' : n.type === 'rest' ? '体力を 3 割もどすか、札を 1 枚きたえる' : n.type === 'elite' ? '勝てば、おまもり' : n.type === 'mid' ? '勝てば、おまもりと手当て' : n.type === 'boss' ? FOES[n.foes[0]].rule : '勝てば、銭と札');
  function mapPanel() {
    const nodes = [el('h2', '', HOURS[run.step]), el('p', 'tale', HOUR_LINES[run.step])];
    run.nodes.forEach((opts, i) => {
      const row = el('div', 'hour' + (i < run.step ? ' past' : i === run.step ? ' now' : '')), o = el('div', 'o');
      row.append(el('div', 'h', HOURS[i]), o);
      if (i === run.step) opts.forEach((n, j) => o.append(choice(optLabel(n), optText(n), () => enter(j))));
      else o.append(el('span', '', opts.map(optLabel).join(' / ')));
      nodes.push(row);
    });
    show(nodes);
  }
  function enter(j) {
    const n = run.nodes[run.step][j]; choose(run, j); sel = null; tgt = -1; saveResume();
    if (n.type === 'boss') { sub = () => show([el('p', '', '丑三つ時'), el('h2', '', FOES[n.foes[0]].name), el('p', 'tale', BOSS_LINES[n.foes[0]]), el('p', 'tale', FOES[n.foes[0]].rule + '。夜明けの刻(朝の印)まで立っていれば、勝ち。'), btn('むかえうつ', 'primary', () => { sub = null; refresh(); })]); sfx('bell'); }
    refresh();
  }
  function rewardPanel() {
    const rw = run.reward, nodes = [el('h2', '', '切りぬけた'), el('p', '', '銭 +' + rw.zeni + (rw.healed ? '・体力 +' + rw.healed : ''))];
    if (rw.relics) { nodes.push(el('h3', '', 'おまもりを 1 つ選ぶ')); rw.relics.forEach((id, i) => nodes.push(choice(RELICS[id].name, RELICS[id].text, after(() => { takeRelic(run, i); sfx('coin'); })))); }
    else { nodes.push(el('h3', '', '札を 1 枚もらう(束は ' + run.deck.length + ' 枚)')); rw.cards.forEach((id, i) => nodes.push(choice(getCard(id).name, cardLine(id), after(() => takeCard(run, i))))); nodes.push(btn('もらわない', '', after(() => takeCard(run, -1)))); }
    show(nodes);
  }
  function pickCard(title, filter, onPick, back) { // 束から 1 枚選ぶ
    sub = () => { const nodes = [el('h2', '', title)]; run.deck.forEach((id, i) => { if (filter(id)) nodes.push(choice(getCard(id).name, cardLine(id), () => { sub = null; onPick(i); saveResume(); refresh(); })); }); nodes.push(btn('やめる', '', () => { sub = null; refresh(); })); show(nodes); };
    refresh();
  }
  function shopPanel() {
    const s = run.shop, nodes = [el('h2', '', '店'), el('p', '', '銭 ' + run.zeni)];
    const item = (name, text, price, sold, fn) => { const b = el('button', 'item'); b.type = 'button'; const l = el('div', ''); l.append(el('b', '', name), el('span', '', text)); b.append(l, el('em', '', sold ? '売り切れ' : '銭 ' + price)); b.disabled = sold || run.zeni < price; b.addEventListener('click', () => { sfx('coin'); fn(); }); return b; };
    nodes.push(el('h3', '', '札'));
    s.cards.forEach((it, i) => nodes.push(item(getCard(it.id).name, cardLine(it.id), PRICE.card, it.sold, after(() => buy(run, 'card', i)))));
    nodes.push(el('h3', '', 'おまもり'));
    s.relics.forEach((it, i) => nodes.push(item(RELICS[it.id].name, RELICS[it.id].text, PRICE.relic, it.sold, after(() => buy(run, 'relic', i)))));
    nodes.push(el('h3', '', 'そのほか'));
    const h = item('手当て', '体力 +' + SHOP_HEAL, PRICE.heal, s.healSold, after(() => buy(run, 'heal'))); if (run.hp >= run.maxHp) h.disabled = true; nodes.push(h);
    const rm = item('札を 1 枚手放す', '束をうすくして、ほしい札を引きやすくする', PRICE.remove, s.removeSold, () => pickCard('手放す札', () => true, (i) => buy(run, 'remove', i))); if (run.deck.length <= 5) rm.disabled = true; nodes.push(rm);
    nodes.push(btn('店を出る', 'primary', after(() => leave(run))));
    show(nodes);
  }
  function restPanel() {
    const v = Math.min(Math.ceil(run.maxHp * REST_HEAL), run.maxHp - run.hp);
    show([el('h2', '', '茶屋'), el('p', 'tale', '湯のみが、ひとつ多く出ている。だれのぶんかは、聞かないことにした。'),
      choice('休む', '体力 +' + v, after(() => rest(run, 'heal'))),
      choice('札をきたえる', '束の札を 1 枚、強くする', () => pickCard('きたえる札', canUpgrade, (i) => rest(run, 'up', i))),
      btn('もちものを見る', '', () => { bagOpen = true; refresh(); })]);
  }
  function eventPanel() {
    const ev = EVENTS[run.event], nodes = [el('p', '', '出来事'), el('h2', '', ev.title), el('p', 'tale', ev.text)];
    for (const ch of ['a', 'b']) {
      const b = choice(ev[ch].label, '', () => { const r = answer(run, ch); saveResume(); sfx('story');
        sub = () => show([el('h2', '', ev.title), el('p', 'tale', r.out), el('p', 'note', r.notes.length ? r.notes.join('・') : '何も変わらなかった'), btn('つぎへ', 'primary', () => { sub = null; refresh(); })]); refresh(); });
      b.disabled = !canAnswer(run, ch); nodes.push(b);
    }
    show(nodes);
  }
  function overPanel() {
    const rs = run.result, end = ENDINGS[rs.how], sv = load();
    if (!run.counted) {
      run.counted = true; sfx(rs.win ? 'victory' : 'defeat');
      const rec = sv.rec || {}, key = run.char + '/' + run.diff; rec[key] = rec[key] || { win: 0, play: 0 }; rec[key].play++; if (rs.win) rec[key].win++;
      const ends = sv.endings || {}; ends[rs.how] = true;
      const patch = { rec, endings: ends, resume: null };
      if (setup.mode === 'daily' && !(sv.daily && sv.daily.date === today() && sv.daily.win)) patch.daily = { date: today(), win: rs.win, how: rs.how, step: rs.step };
      store(patch);
    }
    const rows = el('div', 'rows'); const add = (a, b) => rows.append(el('span', '', a), el('span', '', b));
    add('たどりついた刻', HOURS[rs.step]); add('戦い', run.stats.fights + ' 回'); add('与えたダメージ', '' + run.stats.dealt); add('受けたダメージ', '' + run.stats.taken); add('くずした大技', run.stats.breaks + ' 回');
    if (rs.win) add('丑三つ時', rs.how === 'slain' ? rs.ticks + ' 刻で退治' : '夜明けまで耐えた');
    const nodes = [el('p', '', '結末'), el('h2', '', end.title)]; for (const line of end.lines) nodes.push(el('p', 'tale', line));
    nodes.push(rows, btn('もう一回', 'primary', () => begin(setup.mode)), btn('タイトルへ', '', () => { run = null; refresh(); }));
    show(nodes);
  }
  function bagPanel() {
    const c = charOf(run), nodes = [el('h2', '', 'もちもの'), el('h3', '', c.name), el('p', 'tale', c.trait)];
    nodes.push(el('h3', '', 'おまもり(' + run.relics.length + ')'));
    if (!run.relics.length) nodes.push(el('p', '', 'まだない')); for (const id of run.relics) nodes.push(el('p', 'tale', RELICS[id].name + ' — ' + RELICS[id].text));
    nodes.push(el('h3', '', '札の束(' + run.deck.length + ' 枚)'));
    const count = {}; for (const id of run.deck) count[id] = (count[id] || 0) + 1;
    for (const id of Object.keys(count)) nodes.push(el('p', 'tale', getCard(id).name + (count[id] > 1 ? ' ×' + count[id] : '') + ' — ' + cardLine(id)));
    const g = el('div', 'grid2'); g.append(btn('あそびかた', '', () => { bagOpen = false; sub = howPanel; refresh(); }), btn('とじる', 'primary', () => { bagOpen = false; refresh(); }));
    nodes.push(g, btn('この夜をやめてタイトルへ', '', () => { bagOpen = false; saveResume(); run = null; refresh(); }));
    show(nodes);
  }

  // ---- 入力 ------------------------------------------------------------------
  let dragging = false;
  cv.addEventListener('pointerdown', (e) => { if (busy) { skip = true; return; } if (!sel) return; dragging = true; try { cv.setPointerCapture(e.pointerId); } catch (x) { /* つかめなくても続ける */ } dragTo(e); });
  cv.addEventListener('pointermove', (e) => { if (dragging) dragTo(e); });
  cv.addEventListener('pointerup', () => { dragging = false; });
  cv.addEventListener('pointercancel', () => { dragging = false; });
  $('less').addEventListener('click', () => { if (sel) setK(sel.k - 1); });
  $('more').addEventListener('click', () => { if (sel) setK(sel.k + 1); });
  $('go').addEventListener('click', () => { sfx('tap'); commit(); });
  $('bag').addEventListener('click', () => { if (busy || !run) return; sfx('tap'); bagOpen = !bagOpen; if (!bagOpen) hide(); refresh(); });
  $('info').addEventListener('click', () => { if (busy) skip = true; });
  window.addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(wrap);
  try { const mq = window.matchMedia('(prefers-color-scheme: dark)'); mq.addEventListener('change', () => { readColors(); draw(); }); } catch (e) { /* 古いブラウザ */ }

  readColors(); refresh(); resize();
})();

})();</script>
<script>if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) { navigator.serviceWorker.register('sw.js').catch(function () {}); }</script>
