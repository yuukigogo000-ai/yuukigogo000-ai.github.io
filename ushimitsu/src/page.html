<title>うしみつ時計</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex,nofollow">
<style>
  /* レイアウト: 1 画面のアプリ。上から 刻限・体力 → 化け物 → 時計(canvas)→ 見通しの一言 → 構えと札 → 回す刻と「決める」。 */
  /* 色は夜の 1 種類だけ(明るい版は作らない)。見た目は仮で、仕上げは別作業 */
  :root {
    color-scheme: dark;
    --bg: #0d0e14; --surface: #1a1c26; --fg: #ebe6d8; --muted: #9a968a; --line: #343746;
    --face: #151722; --rim: #3d4154; --hand: #ebe6d8;
    --f0: #e0705a; --f1: #5fb0c9; --f2: #c79bdf; --foe-fg: #0d0e14;
    --atk: #e0705a; --def: #6aa8ff; --waza: #e0b85a; --fire: #ff9a4a;
    --accent: #e0b85a; --accent-fg: #17130a; --danger: #ff7a66; --good: #7fd6a8;
    --font: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.45;
    display: flex; flex-direction: column; gap: 6px; box-sizing: border-box;
    padding-block: 8px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    overscroll-behavior: contain; -webkit-user-select: none; user-select: none;
  }
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .top h1 { font-size: 15px; margin: 0; font-weight: 700; }
  .top .when { color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar { display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
  .bar .hp { flex: 1 1 auto; height: 10px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); overflow: hidden; }
  .bar .hp i { display: block; height: 100%; background: var(--good); }
  .bar .hp i.low { background: var(--danger); }
  .bar button { min-height: 32px; padding: 2px 10px; font-size: 13px; }
  .main { flex: 1 1 auto; min-height: 0; position: relative; display: flex; flex-direction: column; gap: 6px; }
  .foes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
  .foe { border: 1px solid var(--line); border-top-width: 5px; border-radius: 8px; padding: 3px 5px; background: var(--surface); min-width: 0; text-align: left; min-height: 64px; font: inherit; color: var(--fg); position: relative; }
  .foe b { display: block; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .foe span { display: block; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .foe span.next { color: var(--fg); }
  .foe.sel { box-shadow: inset 0 0 0 2px var(--accent); }
  .foe.gone { opacity: .35; }
  .foe .pop { position: absolute; right: 4px; top: 2px; font-weight: 800; font-size: 15px; color: var(--danger); animation: pop .7s ease-out forwards; pointer-events: none; }
  @keyframes pop { from { transform: translateY(6px); opacity: 1; } to { transform: translateY(-10px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .foe .pop { animation-duration: .01s; } }
  .stage-wrap { flex: 1 1 auto; min-height: 0; position: relative; display: flex; justify-content: center; align-items: center; }
  canvas { display: block; touch-action: none; max-width: 100%; }
  .sheet { display: flex; flex-direction: column; gap: 6px; }
  .info { color: var(--muted); min-height: 2.9em; font-size: 13px; text-align: center; }
  .info b { color: var(--fg); font-weight: 700; }
  .info .bad { color: var(--danger); } .info .ok { color: var(--good); }
  .acts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .acts.cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .acts.cards.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .commit { display: grid; grid-template-columns: 48px minmax(0, 1fr) 48px minmax(0, 2fr); gap: 6px; align-items: stretch; }
  .commit .k { display: flex; align-items: center; justify-content: center; font-weight: 700; font-variant-numeric: tabular-nums; border: 1px solid var(--line); border-radius: 8px; }
  button {
    font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 4px; min-height: 44px; min-width: 0;
  }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; font-weight: 700; }
  button:disabled { opacity: .45; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button small { display: block; font-size: 11px; color: inherit; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button.act { border-left-width: 5px; }
  button.act.atk { border-left-color: var(--atk); } button.act.def { border-left-color: var(--def); }
  button.act.waza { border-left-color: var(--waza); } button.act.fire { border-left-color: var(--fire); }
  button.act.sel { box-shadow: inset 0 0 0 2px var(--accent); }
  button.act.empty { border-style: dashed; }
  .panel {
    position: absolute; inset: 0; display: flex; flex-direction: column; gap: 8px; align-items: stretch; justify-content: flex-start;
    background: var(--bg); padding: 4px 0; overflow-y: auto; z-index: 2;
  }
  /* 中身が短いときは中央、長いときは上から順に読めて下へ送れる */
  .panel > :first-child { margin-top: auto; } .panel > :last-child { margin-bottom: auto; }
  .panel h2 { font-size: 20px; margin: 0; text-align: center; }
  .panel h3 { font-size: 13px; margin: 6px 0 0; color: var(--muted); font-weight: 400; }
  .panel p { margin: 0; text-align: center; color: var(--muted); }
  .panel p.tale { color: var(--fg); text-align: left; line-height: 1.8; }
  .panel p.note { color: var(--good); }
  .panel .rows { display: grid; grid-template-columns: auto auto; gap: 2px 14px; justify-content: center; font-variant-numeric: tabular-nums; }
  .panel .rows span:nth-child(odd) { color: var(--muted); }
  .choice { text-align: left; padding: 8px 10px; }
  .choice b { display: block; } .choice span { display: block; color: var(--muted); font-size: 13px; }
  .choice.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .hour { display: grid; grid-template-columns: 5.2em minmax(0, 1fr); gap: 8px; align-items: center; padding: 3px 0; border-top: 1px solid var(--line); }
  .hour .h { color: var(--muted); font-size: 13px; }
  .hour.past { opacity: .4; } .hour.now .h { color: var(--accent); font-weight: 700; }
  .hour .o { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
  .hour .o span { color: var(--muted); }
  .item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; text-align: left; padding: 6px 10px; }
  .item b { display: block; } .item span { display: block; color: var(--muted); font-size: 13px; }
  .item em { font-style: normal; font-variant-numeric: tabular-nums; color: var(--accent); }
</style>

<div class="top">
  <h1>うしみつ時計</h1>
  <div class="when" id="when"></div>
</div>
<div class="bar" id="bar" hidden>
  <span id="hpText"></span>
  <div class="hp" aria-hidden="true"><i id="hpBar"></i></div>
  <span id="zeni"></span>
  <button type="button" id="bag">もちもの</button>
</div>
<div class="main" id="main">
  <div class="foes" id="foes" aria-label="化け物"></div>
  <div class="stage-wrap" id="wrap">
    <canvas id="cv" aria-label="時計。針を引っぱって、行動に使う刻を決めます"></canvas>
  </div>
  <div class="sheet">
    <div class="info" id="info"></div>
    <div class="acts" id="basics"></div>
    <div class="acts cards" id="cards"></div>
    <div class="commit">
      <button type="button" id="less" aria-label="刻をへらす">−</button>
      <div class="k" id="kText"></div>
      <button type="button" id="more" aria-label="刻をふやす">＋</button>
      <button type="button" class="primary" id="go">決める</button>
    </div>
  </div>
  <div class="panel" id="panel" hidden></div>
</div>

<script>/*__BUNDLE__*/</script>
